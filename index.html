<style>
:root{--bg:#000;--well:rgba(16,16,22,.62);--fill:rgba(255,255,255,.11);--line:rgba(255,255,255,.08);--glass:rgba(8,8,12,.9);--stroke:rgba(255,255,255,.1);--mute:#798183;--fg:#fff;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:12px/1.25 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{flex:none;display:block}
[hidden]{display:none!important}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
.glow .b{position:absolute;inset:0;background-repeat:no-repeat;transition:opacity .5s ease;opacity:0}
.glow .b.on{opacity:1}
.app{position:relative;z-index:1;height:100dvh;padding:32px;display:flex;flex-direction:column}
.pill{-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:39px;padding:0 16px;border-radius:60px;font-size:12px;line-height:1;white-space:nowrap;border:1px solid transparent;flex:none;cursor:pointer;color:var(--fg)}
.pill.med{font-weight:500}
.pill.line{border-color:var(--stroke)}
.pill.white{background:#fff;color:#000;font-weight:500}
.pill.sm{height:29px;padding:0 12px;font-size:10px}
.pill:hover{filter:brightness(1.18)}
.pill.white:hover{filter:brightness(.94)}
.topbar{display:flex;align-items:center;gap:22px;height:53px;flex:none}
.topbar .logo{height:53px;width:auto;display:block;transform:translateY(5px)}
.topbar .sp{flex:1}
.topbar .wrap{position:relative;flex:none}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{height:29px;padding:0 12px;border-radius:60px;font-size:12px;color:var(--mute)}
.tab:hover{color:var(--fg)}
.tab[aria-pressed=true]{color:var(--fg);background:var(--fill)}
.mydots{display:none;gap:2px}
#mycBtn.set .mydots{display:inline-flex}
.mydots i{width:8px;height:8px;border-radius:50%;display:block}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,44%);gap:48px;flex:1;min-height:0;padding-top:26px}
/* featured */
.feat{display:flex;flex-direction:column;min-height:0;gap:14px}
.frame{position:relative;flex:none;aspect-ratio:1;width:100%;max-width:calc(100dvh - 268px);border-radius:14px;overflow:hidden;background:var(--well);border:1px solid var(--stroke)}
.feat{justify-content:center}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s ease;background:#000}
.frame img.on{opacity:1}
.cap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.cap .nm{font-size:14px;font-weight:500;margin-bottom:4px}
.cap .mk{font:10px var(--mono);color:var(--mute)}
.cap .d{font:10px var(--mono);color:var(--mute);flex:none}
.open{width:100%;height:39px}
/* tracklist */
.list{display:flex;flex-direction:column;min-height:0}
.thead,.row{display:grid;grid-template-columns:36px minmax(100px,1fr) minmax(0,1.5fr) 88px 72px;gap:16px;align-items:center}
.thead{height:32px;font:10px var(--mono);color:var(--mute);flex:none;padding:0 16px;position:relative}
.thead::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--stroke)}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 40px),transparent);padding-bottom:40px}
.scroll::-webkit-scrollbar{display:none}
.row{position:relative;height:44px;padding:0 16px;border-radius:10px;transition:background .12s}
/* the hairline is drawn separately so the rounded hover fill never bends it */
.row::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--stroke)}
.row:hover::after,.row.hi::after{opacity:0}
.row:hover,.row.hi{background:rgba(255,255,255,.05)}
.row .no{font:10px var(--mono);color:var(--mute)}
.row .nm{font-size:12px;font-weight:500}
.row .mk{font:10px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font:10px var(--mono);color:var(--mute)}
.row .go{justify-self:end;height:26px;padding:0 10px;border-radius:60px;border:1px solid var(--stroke);font-size:10px;opacity:0;transition:opacity .12s;display:inline-flex;align-items:center;gap:6px}
.row:hover .go,.row.hi .go{opacity:1}
.row .nm b{background:rgba(255,255,255,.18);border-radius:3px;font-weight:500}
.empty{padding:40px 8px;color:var(--mute)}
.field{display:flex;align-items:center;height:29px;border:1px solid var(--stroke);border-radius:60px;padding:0 12px;gap:8px;color:var(--mute);width:200px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font-size:12px;padding:0}
.field input::placeholder{color:var(--mute);opacity:.6}
.field:focus-within{border-color:var(--mute)}
.pop{position:absolute;right:0;top:calc(100% + 14px);z-index:70;width:292px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--stroke);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.pop .mt{font-size:12px;color:var(--fg)}
.mh{display:flex;align-items:center;justify-content:space-between}
.ib{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);border-radius:4px}
.rows{display:flex;flex-direction:column;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:12px;overflow:hidden}
.rows .r{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px}
.rows .r+.r{border-top:1px solid var(--stroke)}
.rows .r .d{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:none;cursor:pointer;border:0;padding:0}
.rows .r input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:12px;font-weight:500;text-transform:uppercase;outline:none;padding:0}
.rows .r .rm{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);opacity:.7}
.rows .r .rm:hover{opacity:1}
.addrow{display:flex;gap:12px;align-items:center}
.hexin{flex:1;min-width:0;height:29px;border:1px solid var(--stroke);border-radius:60px;background:transparent;padding:0 12px;font-size:12px;outline:none;text-transform:uppercase;color:var(--fg)}
.hexin::placeholder{color:var(--mute);opacity:.5;text-transform:none}
.hexin:focus{border-color:var(--mute)}
.hexin.bad{border-color:#FF6B6B}
.pill.sm#mycAdd{width:48px;padding:0;font-size:12px}
.mf{display:flex;align-items:center;justify-content:space-between;gap:12px}
.or{font-size:10px;color:var(--mute);line-height:1.4}
.lnk{font-size:10px;color:var(--mute);white-space:nowrap}
.lnk:hover{color:#FF6B6B}
.cpick{position:fixed;z-index:80;width:274px;padding:12px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--stroke);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.cpick .sv{position:relative;height:110px;cursor:crosshair;touch-action:none;border-radius:6px}
.cpick .dot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
.cpick .hue{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);margin:0}
.cpick .hue::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.cpick .hue::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
.cpick .row2{display:flex;align-items:center;gap:8px}
.cpick .row2 .hash{color:var(--mute)}
.cpick .row2 input{flex:1;min-width:0;height:29px;border:1px solid var(--stroke);border-radius:60px;background:transparent;color:var(--fg);padding:0 12px;font-size:12px;text-transform:uppercase;outline:none}
.cpick .ok{height:29px;padding:0 12px;border-radius:60px;background:#fff;color:#000;font-size:10px;font-weight:500}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;padding:16px}
  .topbar{height:auto;flex-wrap:wrap;gap:12px}
  .topbar .logo{height:36px;transform:none}
  .tabs{margin:0;flex-wrap:wrap;width:100%}
  .field{width:100%}
  .main{display:flex;flex-direction:column;gap:24px;padding-top:16px}
  .feat{order:-1}
  .frame{aspect-ratio:1;flex:none}
  .scroll{overflow:visible;-webkit-mask-image:none;mask-image:none;padding-bottom:0}
  .thead{display:none}
  .row{grid-template-columns:28px 1fr 64px;height:48px}
  .row .mk,.row .go{display:none}
  .pop{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto}
}
</style>
</head>
