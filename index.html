<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tools — small tools for making things</title>
<meta name="description" content="A small collection of free, single-purpose design tools. No accounts, no uploads, everything runs in your browser.">
<!-- SWAP THE DOMAIN on the lines below once your live URL is set -->
<meta property="og:title" content="Tools">
<meta property="og:description" content="A small collection of free, single-purpose design tools.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oddgrid.vercel.app/">
<meta property="og:image" content="https://oddgrid.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://oddgrid.vercel.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230b0b0d'/%3E%3Crect x='1' y='1' width='3' height='3' fill='%23FF87C3'/%3E%3Crect x='4' y='1' width='3' height='3' fill='%231B4FA0'/%3E%3Crect x='1' y='4' width='3' height='3' fill='%238E9A24'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23FF5B1E'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b0d; --panel:#101013; --line:#22222a; --line-soft:#1a1a20;
  --text:#EFEDE8; --muted:#7c7c88; --muted-2:#55555f;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}

.topbar{
  position:sticky; top:0; z-index:10;
  height:56px; padding:0 22px;
  display:flex; align-items:center; gap:12px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.topbar svg{display:block; border-radius:2px}
.topbar h1{margin:0; font-size:15px; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
.kicker{
  font-family:var(--mono); font-size:10.5px; color:var(--muted);
  letter-spacing:.02em; padding-left:12px; border-left:1px solid var(--line);
}
.spacer{flex:1}
.count{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); letter-spacing:.08em}

/* ---------- the card grid ---------- */
.grid{
  display:grid; gap:16px;
  grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
  padding:22px; max-width:1720px; margin:0 auto;
}
.card{
  position:relative; display:block;
  aspect-ratio:4/5;
  border-radius:6px; overflow:hidden;
  border:1px solid var(--line-soft);
  text-decoration:none;
  background:#000;
  transition:transform .16s ease, border-color .16s ease;
}
.card:hover, .card:focus-visible{
  transform:translateY(-4px);
  border-color:var(--muted-2);
  outline:none;
}
/* Card artwork: each tool's animated SVG gets dropped inside its
   .card-art (id="art-<slug>") — until then the card stays black. */
.card-art{position:absolute; inset:0; background:#000}
.card-art svg{width:100%; height:100%; display:block; object-fit:cover}

/* the white name plate, top-left like the reference */
.plate{
  position:absolute; left:0; top:7%;
  width:min(72%, 300px); aspect-ratio:2.9/1;
  background:#fff; color:#141414;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:14px 16px 12px;
}
.plate .nm{
  font-size:clamp(17px, 1.5vw, 22px); font-weight:500;
  letter-spacing:.005em; line-height:1;
}
.plate .no{
  align-self:flex-end;
  font-size:clamp(15px, 1.3vw, 19px); font-weight:400;
  font-variant-numeric:tabular-nums; line-height:1;
}

.foot{
  padding:10px 22px 34px; max-width:1720px; margin:0 auto;
  font-family:var(--mono); font-size:10px; line-height:1.6; color:var(--muted-2);
}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; padding:12px}
  .plate{padding:9px 11px 8px}
  .kicker{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <svg width="26" height="26" viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8" fill="#0b0b0d"/><rect x="1" y="1" width="3" height="3" fill="#FF87C3"/><rect x="4" y="1" width="3" height="3" fill="#1B4FA0"/><rect x="1" y="4" width="3" height="3" fill="#8E9A24"/><rect x="4" y="4" width="3" height="3" fill="#FF5B1E"/></svg>
  <h1>Tools</h1>
  <span class="kicker">Small tools for making things</span>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
</header>

<main class="grid" id="grid" aria-label="Tools"></main>

<p class="foot">No accounts, no uploads. Everything runs in your browser and exports as real files.</p>

<script>
(() => {
"use strict";
/* Order sets the card numbers. tint/desc kept for tooling and future art. */
const TOOLS=[
  {slug:"oddgrid",  name:"Oddgrid",  tint:"#FF87C3", desc:"generative pixel compositions"},
  {slug:"modular",  name:"Modular",  tint:"#FF5B1E", desc:"rounded modular grid posters"},
  {slug:"specimen", name:"Specimen", tint:"#8E9A24", desc:"type specimen posters"},
  {slug:"terrain",  name:"Terrain",  tint:"#1B4FA0", desc:"layered contour landscapes"},
  {slug:"stipple",  name:"Stipple",  tint:"#E4CDA7", desc:"halftone dot portraits of light"},
  {slug:"filament", name:"Filament", tint:"#63D8C2", desc:"flowing thread fields"},
  {slug:"tokens",   name:"Tokens",   tint:"#C5B8FF", desc:"geometric badge sets"},
  {slug:"magnet",   name:"Magnet",   tint:"#4ADE80", desc:"field-aligned mark grids"},
  {slug:"galaxy",   name:"Galaxy",   tint:"#EFEDE8", desc:"zoom-burst dot trails"},
  {slug:"ember",    name:"Ember",    tint:"#C75B33", desc:"heat-mapped field grids"},
  {slug:"static",   name:"Static",   tint:"#F0480F", desc:"glitch pixel posters"},
  {slug:"fete",     name:"Fete",     tint:"#FF3DA6", desc:"festival patch posters"},
  {slug:"weave",    name:"Weave",    tint:"#F2A0DC", desc:"striped ribbon bands"},
  {slug:"zig",      name:"Zig",      tint:"#EF9C8D", desc:"rounded zigzag patterns"},
  {slug:"quilt",    name:"Quilt",    tint:"#F5C21B", desc:"pixel blanket patterns"},
  {slug:"aura",     name:"Aura",     tint:"#F786A8", desc:"soft vibrant gradients"},
  {slug:"warp",     name:"Warp",     tint:"#7CE860", desc:"warped op-art patterns"}
];
const grid=document.getElementById("grid");
grid.innerHTML=TOOLS.map((t,i)=>`
  <a class="card" href="${t.slug}/index.html" aria-label="${t.name} — ${t.desc}">
    <div class="card-art" id="art-${t.slug}"></div>
    <div class="plate"><span class="nm">${t.name}</span><span class="no">${String(i+1).padStart(2,"0")}</span></div>
  </a>`).join("");
document.getElementById("count").textContent=String(TOOLS.length).padStart(2,"0")+" TOOLS";
})();
</script>
</body>
</html>
