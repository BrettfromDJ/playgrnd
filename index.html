<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tools — small tools for making things</title>
<meta name="description" content="A small collection of free, single-purpose design tools. No accounts, no uploads, everything runs in your browser.">
<!-- SWAP THE DOMAIN on the lines below once your live URL is set -->
<meta property="og:title" content="Tools">
<meta property="og:description" content="A small collection of free, single-purpose design tools.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oddgrid.vercel.app/">
<meta property="og:image" content="https://oddgrid.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://oddgrid.vercel.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230b0b0d'/%3E%3Crect x='1' y='1' width='3' height='3' fill='%23FF87C3'/%3E%3Crect x='4' y='1' width='3' height='3' fill='%231B4FA0'/%3E%3Crect x='1' y='4' width='3' height='3' fill='%238E9A24'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23FF5B1E'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b0d; --panel:rgba(11,11,13,.86); --panel-solid:#101013;
  --line:#22222a; --line-soft:#1a1a20;
  --text:#EFEDE8; --muted:#7c7c88; --muted-2:#55555f;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- live tool background: two stacked frames, crossfaded ---------- */
#bg{position:fixed; inset:0; z-index:0; background:var(--bg); overflow:hidden}
.bglayer{
  position:absolute; inset:0; width:100%; height:100%;
  border:0; display:block;
  opacity:0; transition:opacity 1.1s ease;
  pointer-events:none;
}
.bglayer.show{opacity:1}
@media (prefers-reduced-motion: reduce){
  .bglayer{transition:none}
}

/* ---------- floating left bar ---------- */
.bar{
  position:fixed; z-index:2;
  left:20px; top:20px; bottom:20px;
  width:320px; max-width:calc(100vw - 40px);
  display:flex; flex-direction:column;
  background:var(--panel);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}
.bar-head{
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; gap:10px;
}
.bar-head svg{flex:0 0 auto; display:block; border-radius:2px}
.bar-head .t{display:flex; flex-direction:column; gap:2px; min-width:0}
.bar-head h1{
  margin:0; font-size:15px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase;
}
.bar-head .kicker{
  margin:0; font-family:var(--mono); font-size:10.5px; color:var(--muted);
  letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list{
  flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
  list-style:none; margin:0; padding:6px 0;
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
.list a{
  display:flex; align-items:baseline; gap:12px;
  padding:11px 18px;
  text-decoration:none; color:var(--text);
  border-left:2px solid transparent;
  transition:background .12s ease, border-color .12s ease;
}
.list a:hover, .list a:focus-visible{
  background:rgba(255,255,255,.045);
  border-left-color:var(--tint,#fff);
  outline:none;
}
.list .idx{
  font-family:var(--mono); font-size:10.5px; color:var(--muted-2);
  width:20px; flex:0 0 auto;
}
.list li[data-active="1"] .idx{color:var(--tint)}
.list .nm{
  font-size:14px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  flex:0 0 auto;
}
.list .ds{
  font-family:var(--mono); font-size:10px; line-height:1.45; color:var(--muted);
  flex:1 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list a:hover .ds{color:var(--text)}
.list .dot{
  flex:0 0 auto; width:6px; height:6px; border-radius:50%;
  background:var(--tint); opacity:0; transform:scale(.5);
  transition:opacity .25s ease, transform .25s ease;
  align-self:center;
}
.list li[data-active="1"] .dot{opacity:1; transform:scale(1)}
.soon{
  padding:12px 18px; border-top:1px solid var(--line-soft);
  font-family:var(--mono); font-size:10.5px; color:var(--muted);
}
.soon b{color:var(--text); font-weight:500}
.bar-foot{
  padding:12px 18px 14px; border-top:1px solid var(--line-soft);
  font-family:var(--mono); font-size:10px; line-height:1.55; color:var(--muted-2);
}

/* ---------- scene caption, bottom right ---------- */
.scene-tag{
  position:fixed; z-index:2; right:20px; bottom:20px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
  color:var(--muted);
  background:var(--panel);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:6px;
  padding:7px 10px;
  cursor:pointer; user-select:none;
  display:flex; align-items:center; gap:8px;
  transition:color .12s ease;
}
.scene-tag:hover{color:var(--text)}
.scene-tag .sw{width:8px; height:8px; border-radius:2px; background:var(--tint,#fff)}

@media (max-width:720px){
  .bar{
    left:12px; right:12px; top:auto; bottom:12px; width:auto;
    max-height:min(62vh, 520px);
  }
  .scene-tag{right:12px; top:12px; bottom:auto}
  .list .ds{display:none}
  .list a{padding:12px 16px}
}
</style>
</head>
<body>

<!-- The background is the tools themselves: each frame loads a tool page in
     its ?embed mode (UI hidden, artwork full-bleed, motion on, fresh seed). -->
<div id="bg" aria-hidden="true">
  <iframe class="bglayer" id="bgA" title="" tabindex="-1" loading="eager" src="about:blank"></iframe>
  <iframe class="bglayer" id="bgB" title="" tabindex="-1" loading="eager" src="about:blank"></iframe>
</div>

<nav class="bar" aria-label="Tools">
  <div class="bar-head">
    <svg width="26" height="26" viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8" fill="#0b0b0d"/><rect x="1" y="1" width="3" height="3" fill="#FF87C3"/><rect x="4" y="1" width="3" height="3" fill="#1B4FA0"/><rect x="1" y="4" width="3" height="3" fill="#8E9A24"/><rect x="4" y="4" width="3" height="3" fill="#FF5B1E"/></svg>
    <div class="t">
      <h1>Tools</h1>
      <p class="kicker">Small tools for making things</p>
    </div>
  </div>
  <ul class="list" id="tool-list"></ul>
  <div class="soon"><b>More on the way</b> — building these as I need them.</div>
  <div class="bar-foot">No accounts, no uploads. Everything runs in your browser and exports as real vectors. The background is live output from the tool marked with a dot.</div>
</nav>

<button class="scene-tag" id="scene-tag" title="Next background">
  <span class="sw" id="scene-sw"></span>
  <span id="scene-label">BG</span>
</button>

<script>
"use strict";

const TOOLS = [
  {slug:"oddgrid",  name:"Oddgrid",  tint:"#FF87C3", desc:"generative pixel grids"},
  {slug:"modular",  name:"Modular",  tint:"#C6FF3D", desc:"blocks, dots, lines, gradients"},
  {slug:"specimen", name:"Specimen", tint:"#FF2CB0", desc:"colour blocks, dealt one at a time"},
  {slug:"terrain",  name:"Terrain",  tint:"#F6C21B", desc:"posterised fields, dithered edges"},
  {slug:"stipple",  name:"Stipple",  tint:"#FF2D2D", desc:"dot fields reading a noise field"},
  {slug:"filament", name:"Filament", tint:"#2B4BFF", desc:"flow fields traced into ropes"},
  {slug:"tokens",   name:"Tokens",   tint:"#FF2D6E", desc:"outlined shapes, compound forms"},
  {slug:"magnet",   name:"Magnet",   tint:"#4ADE80", desc:"field-aligned mark grids"},
  {slug:"galaxy",   name:"Galaxy",   tint:"#EFEDE8", desc:"zoom-burst dot trails"},
  {slug:"ember",    name:"Ember",    tint:"#C75B33", desc:"heat-mapped field grids"},
  {slug:"static",   name:"Static",   tint:"#F0480F", desc:"glitch pixel posters"},
  {slug:"fete",     name:"Fete",     tint:"#FF3DA6", desc:"festival patch posters"},
  {slug:"weave",    name:"Weave",    tint:"#F2A0DC", desc:"striped ribbon bands"},
  {slug:"zig",      name:"Zig",      tint:"#EF9C8D", desc:"rounded zigzag patterns"},
  {slug:"quilt",    name:"Quilt",    tint:"#F5C21B", desc:"pixel blanket patterns"},
  {slug:"aura",     name:"Aura",     tint:"#F786A8", desc:"soft vibrant gradients"},
];

/* build the list */
const listEl = document.getElementById("tool-list");
TOOLS.forEach((t,i)=>{
  const li = document.createElement("li");
  li.innerHTML =
    `<a href="${t.slug}/index.html" style="--tint:${t.tint}">`+
    `<span class="idx">${String(i+1).padStart(2,"0")}</span>`+
    `<span class="nm">${t.name}</span>`+
    `<span class="ds">${t.desc}</span>`+
    `<span class="dot"></span></a>`;
  listEl.appendChild(li);
});

/* ---------- background rotation over the real tools ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DWELL_MS = 12000;   /* how long each tool stays up */
const FADE_MS  = 1200;

let front = document.getElementById("bgA");
let back  = document.getElementById("bgB");
let current = -1;
let wanted  = -1;
let loading = false;
let hoverLock = false;
let lastSwitch = performance.now();

const tagLabel = document.getElementById("scene-label");
const tagSw    = document.getElementById("scene-sw");

function updateChrome(){
  const t = TOOLS[current];
  tagLabel.textContent = `BG — ${t.name.toUpperCase()} ${String(current+1).padStart(2,"0")}/${String(TOOLS.length).padStart(2,"0")}`;
  tagSw.style.background = t.tint;
  [...listEl.children].forEach((li,i)=>{
    li.dataset.active = i===current ? "1" : "0";
  });
}

function setScene(i){
  wanted = i;
  if(loading || i===current) return;
  loading = true;
  const target = back;
  /* the tool posts "tool-embed-ready" once its first frame has painted;
     a timeout covers the case where that signal never arrives */
  let done = false;
  const finish = ()=>{
    if(done) return;
    done = true;
    clearTimeout(fallback);
    removeEventListener("message", onReady);
    target.classList.add("show");
    front.classList.remove("show");
    const old = front;
    front = target; back = old;
    current = i;
    lastSwitch = performance.now();
    updateChrome();
    /* after the fade, park the old tool so it stops animating */
    setTimeout(()=>{ if(back===old && !loading) old.src="about:blank"; }, FADE_MS+200);
    loading = false;
    if(wanted!==current) setScene(wanted);
  };
  const onReady = (e)=>{
    if(e.source===target.contentWindow && e.data && e.data.type==="tool-embed-ready"){
      setTimeout(finish, 150);
    }
  };
  const fallback = setTimeout(()=>{
    if(done) return;
    removeEventListener("message", onReady);
    if(current<0){ finish(); return; }   /* first paint: show it regardless */
    /* the tool stalled (slow network) — keep the current scene, retry soon */
    done = true;
    target.src = "about:blank";
    loading = false;
    lastSwitch = performance.now() - DWELL_MS + 3000;
  }, 4000);
  addEventListener("message", onReady);
  target.src = `${TOOLS[i].slug}/index.html?embed=1#embed`;
}

/* hover on the list previews that tool's live background */
[...listEl.children].forEach((li,i)=>{
  li.addEventListener("mouseenter", ()=>{ hoverLock = true; setScene(i); });
  li.addEventListener("mouseleave", ()=>{ hoverLock = false; lastSwitch = performance.now(); });
});
document.getElementById("scene-tag").addEventListener("click", ()=>{
  setScene(((current<0?0:current)+1) % TOOLS.length);
});

/* auto-advance; with reduced motion, stay on one still scene */
setInterval(()=>{
  if(reduceMotion || hoverLock || loading || document.hidden) return;
  if(performance.now() - lastSwitch > DWELL_MS){
    setScene((current+1) % TOOLS.length);
  }
}, 500);

setScene((Math.random()*TOOLS.length)|0);
</script>
</body>
</html>
