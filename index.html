<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tools — small tools for making things</title>
<meta name="description" content="A small collection of free, single-purpose design tools. No accounts, no uploads, everything runs in your browser.">
<!-- SWAP THE DOMAIN on the lines below once your live URL is set -->
<meta property="og:title" content="Tools">
<meta property="og:description" content="A small collection of free, single-purpose design tools.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oddgrid.vercel.app/">
<meta property="og:image" content="https://oddgrid.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://oddgrid.vercel.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23EFEFEC'/%3E%3Crect x='1' y='1' width='3' height='3' fill='%23FF87C3'/%3E%3Crect x='4' y='1' width='3' height='3' fill='%231B4FA0'/%3E%3Crect x='1' y='4' width='3' height='3' fill='%238E9A24'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23FF5B1E'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EFEFEC; --ink:#111112; --muted:#6d6d68; --line:#d9d9d4;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}

.wrap{max-width:1760px; margin:0 auto; padding:0 clamp(16px,2.4vw,44px)}

.topbar{
  display:flex; align-items:baseline; gap:8px;
  padding-top:20px; padding-bottom:8px;
  font-size:13px; letter-spacing:.01em;
}
.topbar .brand{font-weight:600}
.topbar .home{color:var(--muted)}
.topbar .spacer{flex:1}
.topbar .count{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* ---------- four columns, tight grid: 4px around every image ---------- */
.grid{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:0; padding-top:4px; padding-bottom:64px;
}
.entry{display:block; padding:4px}
/* Artwork: each tool's animated SVG gets dropped inside its .card-art
   (id="art-<slug>") — empty slots just hold the space. */
.art{
  position:relative; aspect-ratio:4/5; overflow:hidden;
}
.art svg,.art img{width:100%; height:100%; display:block; object-fit:cover}
/* the label lives on the image: a white mono chip, top left */
.tag{
  position:absolute; left:24px; top:24px;
  background:#fff; color:#141414;
  font-family:var(--mono); font-size:13px; font-weight:500;
  letter-spacing:.04em; text-transform:uppercase;
  padding:9px 12px; line-height:1;
}
.entry:hover .art{opacity:.92}

.foot{
  border-top:1px solid var(--line);
  padding-top:16px; padding-bottom:44px;
  font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
}

@media (max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .tag{left:12px; top:12px; font-size:11px; padding:7px 9px}
}
@media (max-width:460px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="wrap topbar">
  <span class="brand">Tools<sup>®</sup></span>
  <span class="home">— Home</span>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
</header>

<main class="grid" id="grid" aria-label="Tools" style="max-width:1760px;margin:0 auto"></main>

<footer class="wrap foot">Everything exports as real files — SVG, PNG and video.</footer>

<script>
(() => {
"use strict";
/* Order sets the numbering. Give a tool an `art` path (drop the file in
   /art) and its card shows that animated SVG; without one the slot stays empty. */
const TOOLS=[
  {slug:"oddgrid",  name:"Oddgrid",  tint:"#FF87C3", desc:"generative pixel compositions", art:"art/oddgrid.svg"},
  {slug:"terrain",  name:"Terrain",  tint:"#1B4FA0", desc:"layered contour landscapes", art:"art/terrain.jpg"},
  {slug:"filament", name:"Filament", tint:"#63D8C2", desc:"flowing thread fields", art:"art/filament.svg"},
  {slug:"zig",      name:"Zig",      tint:"#EF9C8D", desc:"rounded zigzag patterns", art:"art/zig.svg"},
  {slug:"quilt",    name:"Quilt",    tint:"#F5C21B", desc:"pixel blanket patterns", art:"art/quilt.svg"},
  {slug:"galaxy",   name:"Galaxy",   tint:"#EFEDE8", desc:"zoom-burst dot trails", art:"art/galaxy.svg"},
  {slug:"aura",     name:"Aura",     tint:"#F786A8", desc:"soft vibrant gradients", art:"art/aura.png"},
  {slug:"warp",     name:"Warp",     tint:"#7CE860", desc:"warped op-art patterns", art:"art/warp.svg"},
  {slug:"specimen", name:"Specimen", tint:"#8E9A24", desc:"type specimen posters", art:"art/specimen.svg"},
  {slug:"tokens",   name:"Tokens",   tint:"#C5B8FF", desc:"geometric badge sets", art:"art/tokens.svg"},
  {slug:"vee",      name:"Vee",      tint:"#F0621E", desc:"mirrored chevron stripes", art:"art/vee.svg"},
  {slug:"fete",     name:"Fete",     tint:"#FF3DA6", desc:"festival patch posters", art:"art/fete.svg"},
  {slug:"parcel",   name:"Parcel",   tint:"#DFF23C", desc:"pixel parcel posters", art:"art/parcel.svg"},
  {slug:"magnet",   name:"Magnet",   tint:"#4ADE80", desc:"field-aligned mark grids", art:"art/magnet.svg"},
  {slug:"weave",    name:"Weave",    tint:"#F2A0DC", desc:"striped ribbon bands", art:"art/weave.svg"},
  {slug:"stipple",  name:"Stipple",  tint:"#E4CDA7", desc:"halftone dot portraits of light", art:"art/stipple.svg"},
  {slug:"modular",  name:"Modular",  tint:"#FF5B1E", desc:"rounded modular grid posters", art:"art/modular.svg"},
  {slug:"ember",    name:"Ember",    tint:"#C75B33", desc:"heat-mapped field grids", art:"art/ember.svg"},
  {slug:"static",   name:"Static",   tint:"#F0480F", desc:"glitch pixel posters", art:"art/static.svg"},
  {slug:"sol",      name:"Sol",      tint:"#F5A623", desc:"sun ray posters"}
];
const grid=document.getElementById("grid");
grid.innerHTML=TOOLS.map((t,i)=>{
  const n=String(i+1).padStart(2,"0");
  return `
  <a class="entry" href="${t.slug}/index.html" aria-label="${t.name} — ${t.desc}">
    <div class="art" id="art-${t.slug}">${t.art?`<img src="${t.art}" alt="" loading="lazy">`:""}<span class="tag">${n} ${t.name}</span></div>
  </a>`;
}).join("");
document.getElementById("count").textContent=String(TOOLS.length).padStart(2,"0")+" tools";
})();
</script>
</body>
</html>
