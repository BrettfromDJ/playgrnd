<style>
:root{
  --bg:#0b0b0d; --panel:rgba(11,11,13,.86); --panel-solid:#101013;
  --line:#22222a; --line-soft:#1a1a20;
  --text:#EFEDE8; --muted:#7c7c88; --muted-2:#55555f;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#bg{
  position:fixed; inset:0; width:100%; height:100%; display:block;
  z-index:0;
}

/* ---------- floating left bar ---------- */
.bar{
  position:fixed; z-index:2;
  left:20px; top:20px; bottom:20px;
  width:320px; max-width:calc(100vw - 40px);
  display:flex; flex-direction:column;
  background:var(--panel);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}
.bar-head{
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; gap:10px;
}
.bar-head svg{flex:0 0 auto; display:block; border-radius:2px}
.bar-head .t{display:flex; flex-direction:column; gap:2px; min-width:0}
.bar-head h1{
  margin:0; font-size:15px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase;
}
.bar-head .kicker{
  margin:0; font-family:var(--mono); font-size:10.5px; color:var(--muted);
  letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list{
  flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
  list-style:none; margin:0; padding:6px 0;
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
.list a{
  display:flex; align-items:baseline; gap:12px;
  padding:11px 18px;
  text-decoration:none; color:var(--text);
  border-left:2px solid transparent;
  transition:background .12s ease, border-color .12s ease;
}
.list a:hover, .list a:focus-visible{
  background:rgba(255,255,255,.045);
  border-left-color:var(--tint,#fff);
  outline:none;
}
.list .idx{
  font-family:var(--mono); font-size:10.5px; color:var(--muted-2);
  width:20px; flex:0 0 auto;
}
.list li[data-active="1"] .idx{color:var(--tint)}
.list .nm{
  font-size:14px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  flex:0 0 auto;
}
.list .ds{
  font-family:var(--mono); font-size:10px; line-height:1.45; color:var(--muted);
  flex:1 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list a:hover .ds{color:var(--text)}
.list .dot{
  flex:0 0 auto; width:6px; height:6px; border-radius:50%;
  background:var(--tint); opacity:0; transform:scale(.5);
  transition:opacity .25s ease, transform .25s ease;
  align-self:center;
}
.list li[data-active="1"] .dot{opacity:1; transform:scale(1)}
.soon{
  padding:12px 18px; border-top:1px solid var(--line-soft);
  font-family:var(--mono); font-size:10.5px; color:var(--muted);
}
.soon b{color:var(--text); font-weight:500}
.bar-foot{
  padding:12px 18px 14px; border-top:1px solid var(--line-soft);
  font-family:var(--mono); font-size:10px; line-height:1.55; color:var(--muted-2);
}

/* ---------- scene caption, bottom right ---------- */
.scene-tag{
  position:fixed; z-index:2; right:20px; bottom:20px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
  color:var(--muted);
  background:var(--panel);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:6px;
  padding:7px 10px;
  cursor:pointer; user-select:none;
  display:flex; align-items:center; gap:8px;
  transition:color .12s ease;
}
.scene-tag:hover{color:var(--text)}
.scene-tag .sw{width:8px; height:8px; border-radius:2px; background:var(--tint,#fff)}

@media (max-width:720px){
  body{overflow:auto}
  .bar{
    left:12px; right:12px; top:auto; bottom:12px; width:auto;
    max-height:min(62vh, 520px);
  }
  .scene-tag{right:12px; top:12px; bottom:auto}
  .list .ds{display:none}
  .list a{padding:12px 16px}
}

<canvas id="bg" aria-hidden="true"></canvas>

<nav class="bar" aria-label="Tools">
  <div class="bar-head">
    <svg width="26" height="26" viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8" fill="#0b0b0d"/><rect x="1" y="1" width="3" height="3" fill="#FF87C3"/><rect x="4" y="1" width="3" height="3" fill="#1B4FA0"/><rect x="1" y="4" width="3" height="3" fill="#8E9A24"/><rect x="4" y="4" width="3" height="3" fill="#FF5B1E"/></svg>
    <div class="t">
      <h1>Tools</h1>
      <p class="kicker">Small tools for making things</p>
    </div>
  </div>
  <ul class="list" id="tool-list"></ul>
  <div class="soon"><b>More on the way</b> — building these as I need them.</div>
  <div class="bar-foot">No accounts, no uploads. Everything runs in your browser and exports as real vectors.</div>
</nav>

<button class="scene-tag" id="scene-tag" title="Next background">
  <span class="sw" id="scene-sw"></span>
  <span id="scene-label">BG — 01/08</span>
</button>

<script>
"use strict";

/* ================= tools ================= */
const TOOLS = [
  {slug:"oddgrid",  name:"Oddgrid",  tint:"#FF87C3", desc:"outlined shapes, compound forms"},
  {slug:"modular",  name:"Modular",  tint:"#C6FF3D", desc:"blocks, dots, lines, gradients"},
  {slug:"plate",    name:"Plate",    tint:"#F0561E", desc:"diagrammatic figure plates"},
  {slug:"specimen", name:"Specimen", tint:"#FF2CB0", desc:"colour blocks, dealt one at a time"},
  {slug:"terrain",  name:"Terrain",  tint:"#F6C21B", desc:"posterised fields, dithered edges"},
  {slug:"stipple",  name:"Stipple",  tint:"#FF2D2D", desc:"dot fields reading a noise field"},
  {slug:"filament", name:"Filament", tint:"#2B4BFF", desc:"flow fields traced into ropes"},
  {slug:"tokens",   name:"Tokens",   tint:"#FF2D6E", desc:"generative pixel grids"},
];

/* build the list */
const listEl = document.getElementById("tool-list");
TOOLS.forEach((t,i)=>{
  const li = document.createElement("li");
  li.dataset.i = i;
  li.innerHTML =
    `<a href="${t.slug}/index.html" style="--tint:${t.tint}">`+
    `<span class="idx">${String(i+1).padStart(2,"0")}</span>`+
    `<span class="nm">${t.name}</span>`+
    `<span class="ds">${t.desc}</span>`+
    `<span class="dot"></span></a>`;
  listEl.appendChild(li);
});

/* ================= helpers ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(rng,arr){return arr[(rng()*arr.length)|0]}

/* small 3D value noise + fbm */
const PERM = (()=>{const r=mulberry32(1091);const p=new Uint8Array(512);const b=new Uint8Array(256);for(let i=0;i<256;i++)b[i]=i;for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=b[i];b[i]=b[j];b[j]=t}for(let i=0;i<512;i++)p[i]=b[i&255];return p})();
function hash3(x,y,z){return PERM[(PERM[(PERM[x&255]+y)&255]+z)&255]/255}
function sm(t){return t*t*(3-2*t)}
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=sm(xf),v=sm(yf),w=sm(zf);
  const l=(a,b,t)=>a+(b-a)*t;
  return l(
    l(l(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u), l(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u), v),
    l(l(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u), l(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u), v),
    w);
}
function fbm(x,y,z,oct){
  let a=0,amp=.5,f=1,tot=0;
  for(let i=0;i<oct;i++){a+=amp*vnoise(x*f,y*f,z*f);tot+=amp;amp*=.5;f*=2}
  return a/tot; /* 0..1 */
}
function easeOutBack(t){const c=1.70158;t=Math.min(1,Math.max(0,t));return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}

/* ================= scene engine =================
   Each scene owns an offscreen canvas so trail-based scenes
   (filament) can accumulate, and crossfades are clean.       */
const main = document.getElementById("bg");
const mctx = main.getContext("2d");
const DPR = Math.min(window.devicePixelRatio||1, 1.5);
let W=0,H=0;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SCENE_SECONDS = 9;
const FADE_SECONDS = 1.1;

function makeScene(def){
  return {
    def,
    canvas:document.createElement("canvas"),
    ctx:null, inited:false, start:0, state:null,
    ensure(){
      if(!this.inited || this.canvas.width!==W || this.canvas.height!==H){
        this.canvas.width=W; this.canvas.height=H;
        this.ctx=this.canvas.getContext("2d");
        this.state=this.def.init(W,H,mulberry32((Math.random()*1e9)|0));
        this.inited=true; this.start=performance.now()/1000;
        if(reduceMotion){ this.def.draw(this.ctx,W,H,3.2,this.state); }
      }
    },
    tick(now){
      this.ensure();
      if(reduceMotion) return;
      this.def.draw(this.ctx,W,H,now-this.start,this.state);
    }
  };
}

/* ================= scene: ODDGRID =================
   Outlined circles / squares on a drifting grid, some cells
   chained into capsule compound forms. Cream line on ink.   */
const sceneOddgrid = {
  init(W,H,rng){
    const g = Math.round(110*DPR);
    const cols = Math.ceil(W/g)+3, rows = Math.ceil(H/g)+3;
    const cells=[], taken=new Set();
    const key=(c,r)=>c+":"+r;
    /* capsules first: runs of 2-4 cells */
    for(let n=0;n<Math.round(cols*rows*0.05);n++){
      const horiz = rng()<.5, len = 2+((rng()*3)|0);
      const c=(rng()*(cols-len))|0, r=(rng()*(rows-len))|0;
      let ok=true;
      for(let i=0;i<len;i++) if(taken.has(key(c+(horiz?i:0),r+(horiz?0:i)))) ok=false;
      if(!ok) continue;
      for(let i=0;i<len;i++) taken.add(key(c+(horiz?i:0),r+(horiz?0:i)));
      cells.push({type:"capsule",c,r,len,horiz,ph:rng()*Math.PI*2,
        col:pick(rng,["#F1EBE1","#F1EBE1","#F1EBE1","#FF87C3","#FFF04D"])});
    }
    for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
      if(taken.has(key(c,r)) || rng()>.34) continue;
      const t=rng();
      cells.push({type: t<.45?"circle": t<.8?"square":"dashed",
        c,r,ph:rng()*Math.PI*2,
        fill:rng()<.14,
        col:pick(rng,["#F1EBE1","#F1EBE1","#F1EBE1","#F1EBE1","#FF87C3","#1B4FA0","#FFF04D","#FF7A1A"])});
    }
    return {g,cols,rows,cells};
  },
  draw(x,W,H,t,s){
    x.setTransform(1,0,0,1,0,0);
    x.fillStyle="#0b0b0d"; x.fillRect(0,0,W,H);
    const g=s.g, off=(t*6*DPR)%g;
    x.translate(-g-off*.6, -g-off);
    x.lineWidth=2*DPR;
    for(const cl of s.cells){
      const pulse = 1 + .028*Math.sin(t*1.4+cl.ph);
      const cx=cl.c*g+g/2, cy=cl.r*g+g/2, R=g*.36*pulse;
      x.strokeStyle=cl.col; x.fillStyle=cl.col;
      if(cl.type==="capsule"){
        const w=cl.horiz?g*(cl.len-1):0, h=cl.horiz?0:g*(cl.len-1);
        x.beginPath();
        x.roundRect(cx-R, cy-R, w+R*2, h+R*2, R);
        x.stroke();
        x.beginPath(); x.arc(cx,cy,R*.32,0,7); x.stroke();
        x.beginPath(); x.arc(cx+w,cy+h,R*.32,0,7); x.stroke();
      }else if(cl.type==="circle"){
        x.beginPath(); x.arc(cx,cy,R,0,7);
        cl.fill? x.fill() : x.stroke();
      }else if(cl.type==="square"){
        x.beginPath(); x.rect(cx-R,cy-R,R*2,R*2);
        cl.fill? x.fill() : x.stroke();
      }else{
        x.save();
        x.translate(cx,cy); x.rotate(t*.35+cl.ph);
        x.setLineDash([6*DPR,7*DPR]);
        x.beginPath(); x.arc(0,0,R,0,7); x.stroke();
        x.restore();
      }
    }
  }
};

/* ================= scene: MODULAR =================
   Cream ground; grid cells dealt a motif — solid block,
   dot matrix, line grid, gradient — re-dealing over time. */
const sceneModular = {
  init(W,H,rng){
    const g=Math.round(170*DPR);
    const cols=Math.ceil(W/g), rows=Math.ceil(H/g);
    const FG=["#0A0A0B","#C6FF3D","#FFE800","#0A0A0B","#D9F3F0","#FF5B1E"];
    const deal=(rng)=>({motif:pick(rng,["solid","dots","hlines","vlines","grad","empty","dots","solid"]),
      a:pick(rng,FG), b:pick(rng,FG), born:-1});
    const cells=[];
    for(let i=0;i<cols*rows;i++) cells.push(deal(rng));
    return {g,cols,rows,cells,deal,rng,last:0};
  },
  draw(x,W,H,t,s){
    if(t-s.last>.55){ s.last=t;
      const i=(s.rng()*s.cells.length)|0;
      s.cells[i]=s.deal(s.rng); s.cells[i].born=t;
    }
    x.setTransform(1,0,0,1,0,0);
    x.fillStyle="#F2F0EA"; x.fillRect(0,0,W,H);
    const g=s.g, pad=Math.round(7*DPR);
    for(let r=0;r<s.rows;r++)for(let c=0;c<s.cols;c++){
      const cl=s.cells[r*s.cols+c];
      if(cl.motif==="empty") continue;
      const k = cl.born<0?1:easeOutBack((t-cl.born)/.35);
      const cx=c*g+g/2, cy=r*g+g/2, a=(g-pad*2)*k;
      if(a<=0) continue;
      const x0=cx-a/2, y0=cy-a/2;
      x.save();
      if(cl.motif==="solid"){ x.fillStyle=cl.a; x.fillRect(x0,y0,a,a); }
      else if(cl.motif==="grad"){
        const gr=x.createLinearGradient(x0,y0,x0+a,y0+a);
        gr.addColorStop(0,cl.a); gr.addColorStop(1,cl.b);
        x.fillStyle=gr; x.fillRect(x0,y0,a,a);
      }
      else if(cl.motif==="dots"){
        x.fillStyle=cl.a; const n=6, st=a/n;
        for(let i=0;i<n;i++)for(let j=0;j<n;j++){
          x.beginPath(); x.arc(x0+st*(i+.5),y0+st*(j+.5),st*.26,0,7); x.fill();
        }
      }
      else{ /* hlines / vlines */
        x.fillStyle=cl.a; const n=7, st=a/n;
        for(let i=0;i<n;i++){
          if(cl.motif==="hlines") x.fillRect(x0, y0+i*st, a, st*.42);
          else x.fillRect(x0+i*st, y0, st*.42, a);
        }
      }
      x.restore();
    }
  }
};

/* ================= scene: PLATE =================
   Paper ground, ruled panels of black line work, one
   orange gradient field, a slowly sweeping arm.        */
const scenePlate = {
  init(W,H,rng){
    return {seed:(rng()*100)|0};
  },
  draw(x,W,H,t,s){
    x.setTransform(1,0,0,1,0,0);
    x.fillStyle="#EFEDEA"; x.fillRect(0,0,W,H);
    const m=Math.round(Math.min(W,H)*.09);
    const ink="#141414", lw=Math.max(1,1.1*DPR);
    x.strokeStyle=ink; x.lineWidth=lw;
    x.font=`${Math.round(10*DPR)}px "IBM Plex Mono",monospace`;
    x.fillStyle=ink;
    /* three panels */
    const gap=m*.5, pw=(W-m*2-gap*2)/3, ph=H-m*2, py=m;
    for(let i=0;i<3;i++){
      const px=m+i*(pw+gap);
      x.strokeRect(px,py,pw,ph);
      x.fillStyle=ink;
      x.fillText("FIG. 0"+(i+1), px, py-6*DPR);
      x.save(); x.beginPath(); x.rect(px,py,pw,ph); x.clip();
      if(i===0){ /* concentric arcs + sweeping arm */
        const cx=px+pw/2, cy=py+ph/2, R=Math.min(pw,ph)*.42;
        for(let r=R*.15;r<=R;r+=R*.12){ x.beginPath(); x.arc(cx,cy,r,0,7); x.stroke(); }
        const a=t*.5;
        x.beginPath(); x.moveTo(cx,cy);
        x.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); x.stroke();
        x.beginPath(); x.arc(cx+Math.cos(a)*R, cy+Math.sin(a)*R, 4*DPR,0,7); x.fill();
        for(let k=0;k<24;k++){ const b=k/24*Math.PI*2;
          x.beginPath();
          x.moveTo(cx+Math.cos(b)*R, cy+Math.sin(b)*R);
          x.lineTo(cx+Math.cos(b)*(R+6*DPR), cy+Math.sin(b)*(R+6*DPR)); x.stroke(); }
      }else if(i===1){ /* translating hatch over an orange field */
        const gr=x.createRadialGradient(px+pw*.5,py+ph*.38,0, px+pw*.5,py+ph*.38, pw*.7);
        gr.addColorStop(0,"rgba(240,86,30,.85)"); gr.addColorStop(1,"rgba(240,86,30,0)");
        x.fillStyle=gr; x.fillRect(px,py,pw,ph);
        const st=9*DPR, off=(t*8*DPR)%st;
        x.beginPath();
        for(let yy=py-pw; yy<py+ph+pw; yy+=st){
          x.moveTo(px, yy+off); x.lineTo(px+pw, yy+off-pw*.35);
        }
        x.stroke();
      }else{ /* scattered circles with leader lines */
        const r=mulberry32(77+s.seed);
        for(let k=0;k<14;k++){
          const ccx=px+pw*(.12+.66*r()), ccy=py+ph*(.08+.84*r());
          const rr=(3+r()*14)*DPR;
          const wob=1+.06*Math.sin(t*1.2+k);
          x.beginPath(); x.arc(ccx,ccy,rr*wob,0,7); x.stroke();
          x.beginPath(); x.moveTo(ccx+rr*wob,ccy);
          x.lineTo(ccx+rr*wob+12*DPR, ccy-10*DPR);
          x.lineTo(ccx+rr*wob+30*DPR, ccy-10*DPR); x.stroke();
        }
      }
      x.restore();
    }
  }
};

/* ================= scene: SPECIMEN =================
   Dark ground; a grid of colour blocks dealt one at a
   time — rings, fans, spikes, tendrils, marble.        */
const sceneSpecimen = {
  init(W,H,rng){
    const g=Math.round(150*DPR), gapv=Math.round(10*DPR);
    const cols=Math.ceil(W/(g+gapv)), rows=Math.ceil(H/(g+gapv));
    const PAL=["#FF2CB0","#FFE800","#0E2A8C","#E9E9E7","#FF7A1A"];
    const mk=(rng)=>{
      let a=pick(rng,PAL), b=pick(rng,PAL);
      if(a===b) b = a==="#E9E9E7" ? "#0A0A0A" : "#E9E9E7";
      return {motif:pick(rng,["rings","fan","spikes","tendrils","marble"]),a,b,born:-1,ph:rng()*7};
    };
    const order=[];
    for(let i=0;i<cols*rows;i++) order.push(i);
    for(let i=order.length-1;i>0;i--){const j=(rng()*(i+1))|0;const t=order[i];order[i]=order[j];order[j]=t}
    const cells=order.map(()=>mk(rng));
    return {g,gapv,cols,rows,cells,order,mk,rng,last:0};
  },
  draw(x,W,H,t,s){
    const total=s.cols*s.rows;
    const visible=Math.min(total, Math.floor(t/.12)+1);
    if(visible>=total && t-s.last>.7){
      s.last=t;
      const i=(s.rng()*total)|0;
      s.cells[i]=s.mk(s.rng); s.cells[i].born=t;
    }
    x.setTransform(1,0,0,1,0,0);
    x.fillStyle="#0A0A0A"; x.fillRect(0,0,W,H);
    const g=s.g, st=g+s.gapv;
    for(let n=0;n<visible;n++){
      const idx=s.order[n], cl=s.cells[idx];
      const c=idx%s.cols, r=(idx/s.cols)|0;
      const bornT = cl.born<0 ? n*.12 : cl.born;
      const k=easeOutBack((t-bornT)/.3);
      if(k<=0) continue;
      const cx=c*st+g/2+s.gapv/2, cy=r*st+g/2+s.gapv/2, a=g*Math.min(1,k);
      x.save();
      x.translate(cx,cy);
      x.fillStyle=cl.a; x.fillRect(-a/2,-a/2,a,a);
      x.beginPath(); x.rect(-a/2,-a/2,a,a); x.clip();
      x.strokeStyle=cl.b; x.fillStyle=cl.b; x.lineWidth=2.2*DPR;
      const R=a/2;
      if(cl.motif==="rings"){
        for(let rr=R*.16;rr<R*1.05;rr+=R*.18){ x.beginPath(); x.arc(0,0,rr,0,7); x.stroke(); }
      }else if(cl.motif==="fan"){
        const nw=7;
        for(let i2=0;i2<nw;i2++){
          const a0=Math.PI+ i2/nw*Math.PI + .05, a1=Math.PI+(i2+.62)/nw*Math.PI;
          x.beginPath(); x.moveTo(0,R*.9);
          x.arc(0,R*.9,R*1.7,a0,a1); x.closePath();
          if(i2%2===0) x.fill(); else x.stroke();
        }
      }else if(cl.motif==="spikes"){
        const n2=10;
        for(let i2=0;i2<n2;i2++){
          const b=i2/n2*Math.PI*2 + cl.ph;
          x.beginPath();
          x.moveTo(Math.cos(b-.14)*R*.28, Math.sin(b-.14)*R*.28);
          x.lineTo(Math.cos(b)*R*1.1, Math.sin(b)*R*1.1);
          x.lineTo(Math.cos(b+.14)*R*.28, Math.sin(b+.14)*R*.28);
          x.closePath(); x.fill();
        }
      }else if(cl.motif==="tendrils"){
        for(let i2=0;i2<4;i2++){
          x.beginPath();
          const xo=-R*.6+i2*R*.4;
          for(let yy=-R; yy<=R; yy+=4*DPR){
            const xx=xo+Math.sin(yy*.02/DPR+cl.ph+i2+t*.6)*R*.16;
            yy===-R? x.moveTo(xx,yy): x.lineTo(xx,yy);
          }
          x.stroke();
        }
      }else{ /* marble: nested wobbly blobs */
        for(let b2=3;b2>=1;b2--){
          x.beginPath();
          for(let a2=0;a2<=Math.PI*2+.01;a2+=.16){
            const rr=R*.28*b2*(1+.22*vnoise(Math.cos(a2)+cl.ph,Math.sin(a2)+b2,t*.25));
            const px2=Math.cos(a2)*rr, py2=Math.sin(a2)*rr;
            a2===0? x.moveTo(px2,py2): x.lineTo(px2,py2);
          }
          x.closePath(); x.stroke();
        }
      }
      x.restore();
    }
  }
};

/* ================= scene: TERRAIN =================
   Low-res posterised noise field, ordered dither at the
   band edges, upscaled with smoothing off.             */
const BAYER4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const sceneTerrain = {
  init(W,H,rng){
    const pix=Math.round(6*DPR);
    const gw=Math.ceil(W/pix), gh=Math.ceil(H/pix);
    const tiny=document.createElement("canvas");
    tiny.width=gw; tiny.height=gh;
    const tctx=tiny.getContext("2d");
    const PAL=["#141216","#5A2C4F","#FF6B4A","#F79A57","#F6C21B","#F8E9C9"]
      .map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
    return {gw,gh,tiny,tctx,img:tctx.createImageData(gw,gh),
      PAL, ox:rng()*80, oy:rng()*80};
  },
  draw(x,W,H,t,s){
    const {gw,gh,img,PAL}=s, d=img.data, L=PAL.length;
    const sc=0.014, tz=t*.045;
    for(let yy=0;yy<gh;yy++){
      for(let xx=0;xx<gw;xx++){
        const n=fbm(xx*sc+s.ox, yy*sc*1.4+s.oy, tz, 4);
        const dith=(BAYER4[yy&3][xx&3]/16-.5)*.55;
        let v=Math.floor(n*L + dith);
        v=v<0?0:(v>=L?L-1:v);
        const p=PAL[v], i=(yy*gw+xx)*4;
        d[i]=p[0]; d[i+1]=p[1]; d[i+2]=p[2]; d[i+3]=255;
      }
    }
    s.tctx.putImageData(img,0,0);
    x.setTransform(1,0,0,1,0,0);
    x.imageSmoothingEnabled=false;
    x.drawImage(s.tiny,0,0,W,H);
  }
};

/* ================= scene: STIPPLE =================
   Halftone lattice reading a drifting noise field,
   mirrored across centre. Red on near-black.        */
const sceneStipple = {
  init(W,H,rng){
    const st=Math.round(21*DPR);
    const pts=[];
    for(let yy=st/2; yy<H; yy+=st)
      for(let xx=st/2; xx<W; xx+=st)
        pts.push(xx,yy);
    return {st,pts,ox:rng()*60,oy:rng()*60};
  },
  draw(x,W,H,t,s){
    x.setTransform(1,0,0,1,0,0);
    x.fillStyle="#101010"; x.fillRect(0,0,W,H);
    const st=s.st, cx=W/2, sc=.0035/DPR;
    for(let i=0;i<s.pts.length;i+=2){
      const px=s.pts[i], py=s.pts[i+1];
      const mx=Math.abs(px-cx); /* mirror symmetry */
      const n=fbm(mx*sc+s.ox, py*sc+s.oy, t*.09, 3);
      const r=Math.max(0,(n-.32))*st*1.15;
      if(r<.6) continue;
      x.fillStyle = n>.72 ? "#FFA3C2" : "#FF2D2D";
      x.beginPath(); x.arc(px,py,Math.min(r,st*.52),0,7); x.fill();
    }
  }
};

/* ================= scene: FILAMENT =================
   Particles tracing a flow field with fading trails —
   streamlines bundle into ropes and splay apart.      */
const sceneFilament = {
  init(W,H,rng){
    const N=Math.min(1200, Math.round(W*H/(2000*DPR*DPR)));
    const parts=[];
    for(let i=0;i<N;i++){
      parts.push({x:rng()*W, y:rng()*H, life:20+rng()*140,
        col: rng()<.82 ? "#2B4BFF" : (rng()<.5 ? "#F58FD0" : "#F2E85C")});
    }
    return {parts,rng,ox:rng()*40,oy:rng()*40,first:true};
  },
  draw(x,W,H,t,s){
    x.setTransform(1,0,0,1,0,0);
    if(s.first){ x.fillStyle="#05060F"; x.fillRect(0,0,W,H); s.first=false; }
    x.fillStyle="rgba(5,6,15,0.045)"; x.fillRect(0,0,W,H);
    const sc=.0011/DPR, sp=1.6*DPR;
    x.lineWidth=1.1*DPR; x.lineCap="round";
    for(const p of s.parts){
      const a=fbm(p.x*sc+s.ox, p.y*sc+s.oy, t*.03, 3)*Math.PI*4;
      const nx=p.x+Math.cos(a)*sp, ny=p.y+Math.sin(a)*sp;
      x.strokeStyle=p.col; x.globalAlpha=.55;
      x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(nx,ny); x.stroke();
      p.x=nx; p.y=ny; p.life--;
      if(p.life<0||p.x<-9||p.x>W+9||p.y<-9||p.y>H+9){
        p.x=s.rng()*W; p.y=s.rng()*H; p.life=20+s.rng()*140;
      }
    }
    x.globalAlpha=1;
  }
};

/* ================= scene: TOKENS =================
   Chunky mirrored pixel grid stepping through states. */
const sceneTokens = {
  init(W,H,rng){
    const cell=Math.round(38*DPR);
    const cols=Math.ceil(W/cell), rows=Math.ceil(H/cell);
    const PAL=["#0b0b0d","#0b0b0d","#0b0b0d","#FF2D6E","#0b0b0d","#1B4FA0","#0b0b0d","#8E9A24","#0b0b0d","#0b0b0d","#FFD23F","#0b0b0d","#EFEDE8","#0b0b0d"];
    return {cell,cols,rows,PAL,ox:rng()*90,oy:rng()*90};
  },
  draw(x,W,H,t,s){
    const step=Math.floor(t*3)/3; /* discrete ticks — pixel feel */
    x.setTransform(1,0,0,1,0,0);
    x.fillStyle="#0b0b0d"; x.fillRect(0,0,W,H);
    const half=Math.ceil(s.cols/2);
    for(let r=0;r<s.rows;r++){
      for(let c=0;c<half;c++){
        const n=fbm(c*.19+s.ox, r*.19+s.oy, step*.11, 3);
        const i=Math.min(s.PAL.length-1, Math.floor(n*s.PAL.length));
        const col=s.PAL[i];
        if(col==="#0b0b0d") continue;
        x.fillStyle=col;
        const pad=Math.max(1,1*DPR);
        x.fillRect(c*s.cell+pad, r*s.cell+pad, s.cell-pad*2, s.cell-pad*2);
        const mc=s.cols-1-c; /* mirror */
        if(mc!==c) x.fillRect(mc*s.cell+pad, r*s.cell+pad, s.cell-pad*2, s.cell-pad*2);
      }
    }
  }
};

/* ================= wiring ================= */
const SCENES = [sceneOddgrid, sceneModular, scenePlate, sceneSpecimen,
                sceneTerrain, sceneStipple, sceneFilament, sceneTokens]
  .map(def=>makeScene(def));

let current=(Math.random()*SCENES.length)|0;
let previous=-1;
let fadeStart=-1;
let sceneStart=performance.now()/1000;
let hoverLock=false;

const tagLabel=document.getElementById("scene-label");
const tagSw=document.getElementById("scene-sw");
const tagBtn=document.getElementById("scene-tag");

function updateChrome(){
  const t=TOOLS[current];
  tagLabel.textContent=`BG — ${t.name.toUpperCase()} ${String(current+1).padStart(2,"0")}/${String(TOOLS.length).padStart(2,"0")}`;
  tagSw.style.background=t.tint;
  [...listEl.children].forEach((li,i)=>{
    li.dataset.active = i===current ? "1":"0";
  });
}

function setScene(i,instant){
  if(i===current) return;
  previous=current; current=i;
  sceneStart=performance.now()/1000;
  fadeStart = (instant||reduceMotion) ? -1 : sceneStart;
  SCENES[current].inited=false; /* fresh roll every time it comes up */
  updateChrome();
}

function resize(){
  W=Math.round(innerWidth*DPR); H=Math.round(innerHeight*DPR);
  main.width=W; main.height=H;
  SCENES.forEach(s=>s.inited=false);
}
addEventListener("resize",resize);
resize(); updateChrome();

/* hover on the list previews that tool's background */
[...listEl.children].forEach((li,i)=>{
  li.addEventListener("mouseenter",()=>{ hoverLock=true; setScene(i); });
  li.addEventListener("mouseleave",()=>{ hoverLock=false; sceneStart=performance.now()/1000; });
});
tagBtn.addEventListener("click",()=>setScene((current+1)%SCENES.length));

let staticDrawn=false;
function frame(){
  requestAnimationFrame(frame);
  if(document.hidden) return;
  const now=performance.now()/1000;

  if(!hoverLock && !reduceMotion && now-sceneStart>SCENE_SECONDS){
    setScene((current+1)%SCENES.length);
  }

  const cur=SCENES[current];
  const wasInited=cur.inited;
  cur.tick(now);
  if(reduceMotion && wasInited && staticDrawn) return;
  staticDrawn=true;

  mctx.setTransform(1,0,0,1,0,0);
  mctx.globalAlpha=1;

  if(fadeStart>0 && previous>=0){
    const k=(now-fadeStart)/FADE_SECONDS;
    if(k<1){
      const prev=SCENES[previous];
      prev.tick(now);
      mctx.drawImage(prev.canvas,0,0);
      mctx.globalAlpha=Math.min(1,Math.max(0,k));
      mctx.drawImage(cur.canvas,0,0);
      mctx.globalAlpha=1;
      return;
    }
    fadeStart=-1; previous=-1;
  }
  mctx.drawImage(cur.canvas,0,0);
}
requestAnimationFrame(frame);
</script>
