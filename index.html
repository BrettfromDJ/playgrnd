<style>
:root{
  --bg:#FFFFFF; --ink:#111112; --ghost:#c2c2be; --line:#e8e8e5; --rule:#111112;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

.wrap{padding-left:clamp(16px,1.6vw,32px); padding-right:clamp(16px,1.6vw,32px)}

/* ---------- top: logo left, round menu right ---------- */
.topbar{
  display:flex; align-items:flex-start; justify-content:space-between;
  padding-top:clamp(20px,2.6vw,40px); padding-bottom:clamp(36px,5vw,84px);
}
.brand{
  display:block; width:clamp(148px,14vw,224px); color:var(--ink);
}
.brand .logo{width:100%; height:auto; display:block}
.menuwrap{position:relative}
.menu{
  width:clamp(48px,4.4vw,84px); height:clamp(48px,4.4vw,84px); border-radius:50%;
  background:#9c9c9a; display:flex; align-items:center; justify-content:center;
  transition:background .2s ease;
}
.menu:hover{background:#7f7f7d}
.menu svg{width:42%; height:auto; display:block}
.dropdown{
  position:absolute; right:0; top:calc(100% + 10px); z-index:50;
  background:var(--bg); border:1px solid var(--ink);
  min-width:220px; padding:10px 0; display:none;
}
.dropdown.open{display:block}
.dropdown button{
  display:flex; width:100%; justify-content:space-between; align-items:baseline;
  padding:9px 18px; font-size:15px; color:var(--ghost); text-align:left;
}
.dropdown button:hover,.dropdown button[aria-pressed=true]{color:var(--ink)}
.dropdown button .n{font-size:12px}

/* ---------- the index table ---------- */
.thead{
  border-top:1px solid var(--rule);
  display:grid; grid-template-columns:90px 150px 1.55fr 1fr 200px;
  gap:16px; align-items:baseline;
  padding-top:16px; padding-bottom:clamp(40px,5vw,72px);
  font-size:16px;
}
.thead .h{display:flex; align-items:center; gap:7px}
.thead button.h:hover{opacity:.6}
.thead .h svg{width:12px; height:12px; transition:transform .2s ease}
.thead .h.flip svg{transform:rotate(180deg)}
.thead .right{justify-self:end; text-align:right}

.rows{padding-bottom:clamp(60px,8vw,120px)}
.row{
  display:grid; grid-template-columns:90px 150px 1.55fr 1fr 200px;
  gap:16px; align-items:baseline;
  padding:15px 0;
  border-bottom:1px solid var(--line);
  font-size:17px; color:var(--ghost);
  transition:color .12s ease;
}
.rows .row:first-child{border-top:1px solid var(--line)}
.row:hover{color:var(--ink)}
.row .right{justify-self:end; text-align:right}
.row.hidden{display:none}

/* floating thumbnail that follows the cursor (desktop pointers only) */
#peek{
  position:fixed; z-index:60; width:clamp(260px,24vw,460px); aspect-ratio:4/3;
  pointer-events:none; overflow:hidden; display:none; background:#eee;
}
/* frames stack on top of each other and cross-fade — a flipbook, no GIF */
#peek img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
  opacity:0; transition:opacity .18s linear;
}
#peek img.show{opacity:1}
@media (hover:hover) and (pointer:fine){ #peek.on{display:block} }
@media (prefers-reduced-motion:reduce){ #peek img{transition:none} }

.empty{
  display:none; padding:48px 0; font-size:15px; color:var(--ghost);
}

@media (max-width:900px){
  .thead{grid-template-columns:52px 64px 1fr 150px}
  .thead .h.client{display:none}
  .row{grid-template-columns:52px 64px 1fr 150px}
  .row .client{display:none}
}
@media (max-width:560px){
  .thead{grid-template-columns:44px 1fr 110px; font-size:14px}
  .thead .h.year{display:none}
  .row{grid-template-columns:44px 1fr 110px; font-size:15px}
  .row .year{display:none}
}
</style>

const $=s=>document.querySelector(s);
const rowsEl=$("#rows");
let newestFirst=true, activeCat="All";

const numbered=TOOLS.map((t,i)=>({...t,no:i+1}));
/* one image or many — always hand back a list of frames */
const frames=t=>!t.art?[]:(Array.isArray(t.art)?t.art:[t.art]);

function render(){
  let list=numbered.slice();
  if(newestFirst)list.reverse();
  rowsEl.innerHTML=list.map(t=>`
    <a class="row" data-cat="${t.cat}" data-art="${frames(t).join("|")}" href="${t.slug}/index.html" aria-label="${t.name} — ${t.desc}">
      <span>${t.no}</span>
      <span class="year">${t.year}</span>
      <span>${t.name}</span>
      <span class="client">${t.desc}</span>
      <span class="right">${t.cat}</span>
    </a>`).join("");
  applyFilter();
}
function applyFilter(){
  let shown=0;
  rowsEl.querySelectorAll(".row").forEach(r=>{
    const on=activeCat==="All"||r.dataset.cat===activeCat;
    r.classList.toggle("hidden",!on);
    if(on)shown++;
  });
  $("#empty").style.display=shown?"none":"block";
}

/* Year header: flip between newest-first and oldest-first */
$("#sortYear").addEventListener("click",()=>{
  newestFirst=!newestFirst;
  $("#sortYear").classList.toggle("flip",!newestFirst);
  render();
});
/* Category header: step through the categories */
const CATS=["All",...[...new Set(TOOLS.map(t=>t.cat))].sort()];
$("#sortCat").addEventListener("click",()=>{
  activeCat=CATS[(CATS.indexOf(activeCat)+1)%CATS.length];
  $("#sortCat").firstChild.textContent=(activeCat==="All"?"Category":activeCat)+" ";
  applyFilter();
  syncMenu();
});

/* round menu: category filter */
const drop=$("#dropdown"),menuBtn=$("#menuBtn");
function syncMenu(){
  drop.innerHTML=CATS.map(c=>{
    const n=c==="All"?TOOLS.length:TOOLS.filter(t=>t.cat===c).length;
    return `<button type="button" data-cat="${c}" aria-pressed="${String(c===activeCat)}">${c==="All"?"All tools":c}<span class="n">${String(n).padStart(2,"0")}</span></button>`;
  }).join("");
}
syncMenu();
menuBtn.addEventListener("click",e=>{
  e.stopPropagation();
  const open=!drop.classList.contains("open");
  drop.classList.toggle("open",open);
  menuBtn.setAttribute("aria-expanded",String(open));
});
drop.addEventListener("click",e=>{
  const b=e.target.closest("button[data-cat]");
  if(!b)return;
  activeCat=b.dataset.cat;
  $("#sortCat").firstChild.textContent=(activeCat==="All"?"Category":activeCat)+" ";
  applyFilter(); syncMenu();
  drop.classList.remove("open");
  menuBtn.setAttribute("aria-expanded","false");
});
document.addEventListener("click",()=>{
  drop.classList.remove("open");
  menuBtn.setAttribute("aria-expanded","false");
});

/* hover thumbnail follows the cursor and flips through its frames */
const FRAME_MS=620;
const peek=$("#peek");
let peekKey="",flipTimer=0;
function stopFlip(){clearInterval(flipTimer);flipTimer=0;}
function showThumb(key){
  if(key===peekKey)return;
  peekKey=key; stopFlip();
  const srcs=key.split("|").filter(Boolean);
  peek.innerHTML=srcs.map((s,i)=>`<img src="${s}" alt=""${i===0?' class="show"':""}>`).join("");
  if(srcs.length<2)return;
  const imgs=[...peek.children];
  let i=0;
  flipTimer=setInterval(()=>{
    imgs[i].classList.remove("show");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("show");
  },FRAME_MS);
}
rowsEl.addEventListener("mouseover",e=>{
  const row=e.target.closest(".row");
  if(!row||!row.dataset.art){peek.classList.remove("on");stopFlip();return;}
  showThumb(row.dataset.art);
  peek.classList.add("on");
});
rowsEl.addEventListener("mouseleave",()=>{peek.classList.remove("on");stopFlip();peekKey="";});
rowsEl.addEventListener("mousemove",e=>{
  const w=peek.offsetWidth||460,h=peek.offsetHeight||345;
  let x=e.clientX+28,y=e.clientY+22;
  if(x+w>innerWidth-16)x=e.clientX-w-28;
  if(y+h>innerHeight-16)y=e.clientY-h-22;
  peek.style.left=x+"px"; peek.style.top=y+"px";
});

render();
})();
</script>
</body>
</html>
