<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tools — small tools for making things</title>
<meta name="description" content="A small collection of free, single-purpose design tools. No accounts, no uploads, everything runs in your browser.">
<!-- SWAP THE DOMAIN on the lines below once your live URL is set -->
<meta property="og:title" content="Tools">
<meta property="og:description" content="A small collection of free, single-purpose design tools.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oddgrid.vercel.app/">
<meta property="og:image" content="https://oddgrid.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://oddgrid.vercel.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23FFFFFF'/%3E%3Crect x='1' y='1' width='3' height='3' fill='%23FF87C3'/%3E%3Crect x='4' y='1' width='3' height='3' fill='%231B4FA0'/%3E%3Crect x='1' y='4' width='3' height='3' fill='%238E9A24'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23FF5B1E'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFFFF; --ink:#111112; --ghost:#c2c2be; --line:#e8e8e5; --rule:#111112;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

.wrap{padding-left:clamp(16px,1.6vw,32px); padding-right:clamp(16px,1.6vw,32px)}

/* ---------- top: logo left, round menu right ---------- */
.topbar{
  display:flex; align-items:flex-start; justify-content:space-between;
  padding-top:clamp(20px,2.6vw,40px); padding-bottom:clamp(36px,5vw,84px);
}
.brand{
  font-weight:700; letter-spacing:-.02em; line-height:1.04;
  font-size:clamp(22px,1.8vw,32px);
}
.menuwrap{position:relative}
.menu{
  width:clamp(48px,4.4vw,84px); height:clamp(48px,4.4vw,84px); border-radius:50%;
  background:#9c9c9a; display:flex; align-items:center; justify-content:center;
  transition:background .2s ease;
}
.menu:hover{background:#7f7f7d}
.menu svg{width:42%; height:auto; display:block}
.dropdown{
  position:absolute; right:0; top:calc(100% + 10px); z-index:50;
  background:var(--bg); border:1px solid var(--ink);
  min-width:220px; padding:10px 0; display:none;
}
.dropdown.open{display:block}
.dropdown button{
  display:flex; width:100%; justify-content:space-between; align-items:baseline;
  padding:9px 18px; font-size:15px; color:var(--ghost); text-align:left;
}
.dropdown button:hover,.dropdown button[aria-pressed=true]{color:var(--ink)}
.dropdown button .n{font-size:12px}

/* ---------- the index table ---------- */
.thead{
  border-top:1px solid var(--rule);
  display:grid; grid-template-columns:90px 150px 1.55fr 1fr 200px;
  gap:16px; align-items:baseline;
  padding-top:16px; padding-bottom:clamp(40px,5vw,72px);
  font-size:16px;
}
.thead .h{display:flex; align-items:center; gap:7px}
.thead button.h:hover{opacity:.6}
.thead .h svg{width:12px; height:12px; transition:transform .2s ease}
.thead .h.flip svg{transform:rotate(180deg)}
.thead .right{justify-self:end; text-align:right}

.rows{padding-bottom:clamp(60px,8vw,120px)}
.row{
  display:grid; grid-template-columns:90px 150px 1.55fr 1fr 200px;
  gap:16px; align-items:baseline;
  padding:15px 0;
  border-bottom:1px solid var(--line);
  font-size:17px; color:var(--ghost);
  transition:color .12s ease;
}
.rows .row:first-child{border-top:1px solid var(--line)}
.row:hover{color:var(--ink)}
.row .right{justify-self:end; text-align:right}
.row.hidden{display:none}

/* floating thumbnail that follows the cursor (desktop pointers only) */
#peek{
  position:fixed; z-index:60; width:clamp(260px,24vw,460px); aspect-ratio:4/3;
  pointer-events:none; overflow:hidden; display:none; background:#eee;
}
/* frames stack on top of each other and cross-fade — a flipbook, no GIF */
#peek img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
  opacity:0; transition:opacity .18s linear;
}
#peek img.show{opacity:1}
@media (hover:hover) and (pointer:fine){ #peek.on{display:block} }
@media (prefers-reduced-motion:reduce){ #peek img{transition:none} }

.empty{
  display:none; padding:48px 0; font-size:15px; color:var(--ghost);
}

@media (max-width:900px){
  .thead{grid-template-columns:52px 64px 1fr 150px}
  .thead .h.client{display:none}
  .row{grid-template-columns:52px 64px 1fr 150px}
  .row .client{display:none}
}
@media (max-width:560px){
  .thead{grid-template-columns:44px 1fr 110px; font-size:14px}
  .thead .h.year{display:none}
  .row{grid-template-columns:44px 1fr 110px; font-size:15px}
  .row .year{display:none}
}
</style>
</head>
<body>

<header class="wrap topbar">
  <div class="brand">Tools<sup>®</sup></div>
  <div class="menuwrap">
    <button class="menu" id="menuBtn" type="button" aria-label="Filter by category" aria-expanded="false">
      <svg viewBox="0 0 36 14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
        <path d="M2 2h32"/><path d="M2 12h32"/>
      </svg>
    </button>
    <nav class="dropdown" id="dropdown" aria-label="Categories"></nav>
  </div>
</header>

<main class="wrap">
  <div class="thead">
    <span class="h">No.</span>
    <button class="h year" id="sortYear" type="button">Year
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
    </button>
    <span class="h">Title</span>
    <span class="h client">Makes</span>
    <button class="h right" id="sortCat" type="button">Category
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
    </button>
  </div>
  <div class="rows" id="rows"></div>
  <div class="empty" id="empty">Nothing in this category yet.</div>
</main>

<div id="peek" aria-hidden="true"></div>

<script>
(() => {
"use strict";
/* Order sets the numbering: add new tools to the end of this list.
   `cat` groups tools for the category filter in the round menu.
   `art` is the hover thumbnail. Give it a LIST of images instead of one and
   the thumbnail flips through them like a GIF while you hover the row —
   e.g. art:["art/oddgrid-1.jpg","art/oddgrid-2.jpg","art/oddgrid-3.jpg"].
   Keep every frame of a tool the same shape so it doesn't jump. */
const TOOLS=[
  {slug:"oddgrid",  name:"Oddgrid",  year:2026, cat:"Patterns",    desc:"generative pixel compositions", art:["art/oddgrid-1.jpg","art/oddgrid-2.jpg","art/oddgrid-3.jpg"]},
  {slug:"terrain",  name:"Terrain",  year:2026, cat:"Backgrounds", desc:"layered contour landscapes", art:"art/terrain.jpg"},
  {slug:"filament", name:"Filament", year:2026, cat:"Backgrounds", desc:"flowing thread fields", art:"art/filament.svg"},
  {slug:"zig",      name:"Zig",      year:2026, cat:"Patterns",    desc:"rounded zigzag patterns", art:"art/zig.svg"},
  {slug:"quilt",    name:"Quilt",    year:2026, cat:"Patterns",    desc:"pixel blanket patterns", art:"art/quilt.svg"},
  {slug:"galaxy",   name:"Galaxy",   year:2026, cat:"Backgrounds", desc:"zoom-burst dot trails", art:"art/galaxy.svg"},
  {slug:"aura",     name:"Aura",     year:2026, cat:"Backgrounds", desc:"soft vibrant gradients", art:"art/aura.png"},
  {slug:"warp",     name:"Warp",     year:2026, cat:"Patterns",    desc:"warped op-art patterns", art:"art/warp.svg"},
  {slug:"specimen", name:"Specimen", year:2026, cat:"Posters",     desc:"type specimen posters", art:"art/specimen.svg"},
  {slug:"tokens",   name:"Tokens",   year:2026, cat:"Badges",      desc:"geometric badge sets", art:"art/tokens.svg"},
  {slug:"vee",      name:"Vee",      year:2026, cat:"Patterns",    desc:"mirrored chevron stripes", art:"art/vee.svg"},
  {slug:"fete",     name:"Fete",     year:2026, cat:"Posters",     desc:"festival patch posters", art:"art/fete.svg"},
  {slug:"parcel",   name:"Parcel",   year:2026, cat:"Posters",     desc:"pixel parcel posters", art:"art/parcel.svg"},
  {slug:"magnet",   name:"Magnet",   year:2026, cat:"Grids",       desc:"field-aligned mark grids", art:"art/magnet.svg"},
  {slug:"weave",    name:"Weave",    year:2026, cat:"Patterns",    desc:"striped ribbon bands", art:"art/weave.svg"},
  {slug:"stipple",  name:"Stipple",  year:2026, cat:"Textures",    desc:"halftone dot portraits of light", art:"art/stipple.svg"},
  {slug:"modular",  name:"Modular",  year:2026, cat:"Posters",     desc:"rounded modular grid posters", art:"art/modular.svg"},
  {slug:"ember",    name:"Ember",    year:2026, cat:"Grids",       desc:"heat-mapped field grids", art:"art/ember.svg"},
  {slug:"static",   name:"Static",   year:2026, cat:"Posters",     desc:"glitch pixel posters", art:"art/static.svg"},
  {slug:"optic",    name:"Optic",    year:2026, cat:"Posters",     desc:"striped counterchange posters", art:"art/optic.svg"},
  {slug:"rise",     name:"Rise",     year:2026, cat:"Backgrounds", desc:"radial stripe arcs", art:"art/rise.svg"},
  {slug:"prism",    name:"Prism",    year:2026, cat:"Backgrounds", desc:"pixel aurora backdrops", art:"art/prism.svg"},
  {slug:"riso",     name:"Riso",     year:2026, cat:"Posters",     desc:"torn paper collage", art:"art/riso.svg"},
  {slug:"plakat",   name:"Plakat",   year:2026, cat:"Posters",     desc:"neon band posters", art:"art/plakat.svg"},
  {slug:"mist",     name:"Mist",     year:2026, cat:"Backgrounds", desc:"sprayed neon washes", art:"art/mist.png"}
];
const $=s=>document.querySelector(s);
const rowsEl=$("#rows");
let newestFirst=true, activeCat="All";

const numbered=TOOLS.map((t,i)=>({...t,no:i+1}));
/* one image or many — always hand back a list of frames */
const frames=t=>!t.art?[]:(Array.isArray(t.art)?t.art:[t.art]);

function render(){
  let list=numbered.slice();
  if(newestFirst)list.reverse();
  rowsEl.innerHTML=list.map(t=>`
    <a class="row" data-cat="${t.cat}" data-art="${frames(t).join("|")}" href="${t.slug}/index.html" aria-label="${t.name} — ${t.desc}">
      <span>${t.no}</span>
      <span class="year">${t.year}</span>
      <span>${t.name}</span>
      <span class="client">${t.desc}</span>
      <span class="right">${t.cat}</span>
    </a>`).join("");
  applyFilter();
}
function applyFilter(){
  let shown=0;
  rowsEl.querySelectorAll(".row").forEach(r=>{
    const on=activeCat==="All"||r.dataset.cat===activeCat;
    r.classList.toggle("hidden",!on);
    if(on)shown++;
  });
  $("#empty").style.display=shown?"none":"block";
}

/* Year header: flip between newest-first and oldest-first */
$("#sortYear").addEventListener("click",()=>{
  newestFirst=!newestFirst;
  $("#sortYear").classList.toggle("flip",!newestFirst);
  render();
});
/* Category header: step through the categories */
const CATS=["All",...[...new Set(TOOLS.map(t=>t.cat))].sort()];
$("#sortCat").addEventListener("click",()=>{
  activeCat=CATS[(CATS.indexOf(activeCat)+1)%CATS.length];
  $("#sortCat").firstChild.textContent=(activeCat==="All"?"Category":activeCat)+" ";
  applyFilter();
  syncMenu();
});

/* round menu: category filter */
const drop=$("#dropdown"),menuBtn=$("#menuBtn");
function syncMenu(){
  drop.innerHTML=CATS.map(c=>{
    const n=c==="All"?TOOLS.length:TOOLS.filter(t=>t.cat===c).length;
    return `<button type="button" data-cat="${c}" aria-pressed="${String(c===activeCat)}">${c==="All"?"All tools":c}<span class="n">${String(n).padStart(2,"0")}</span></button>`;
  }).join("");
}
syncMenu();
menuBtn.addEventListener("click",e=>{
  e.stopPropagation();
  const open=!drop.classList.contains("open");
  drop.classList.toggle("open",open);
  menuBtn.setAttribute("aria-expanded",String(open));
});
drop.addEventListener("click",e=>{
  const b=e.target.closest("button[data-cat]");
  if(!b)return;
  activeCat=b.dataset.cat;
  $("#sortCat").firstChild.textContent=(activeCat==="All"?"Category":activeCat)+" ";
  applyFilter(); syncMenu();
  drop.classList.remove("open");
  menuBtn.setAttribute("aria-expanded","false");
});
document.addEventListener("click",()=>{
  drop.classList.remove("open");
  menuBtn.setAttribute("aria-expanded","false");
});

/* hover thumbnail follows the cursor and flips through its frames */
const FRAME_MS=620;
const peek=$("#peek");
let peekKey="",flipTimer=0;
function stopFlip(){clearInterval(flipTimer);flipTimer=0;}
function showThumb(key){
  if(key===peekKey)return;
  peekKey=key; stopFlip();
  const srcs=key.split("|").filter(Boolean);
  peek.innerHTML=srcs.map((s,i)=>`<img src="${s}" alt=""${i===0?' class="show"':""}>`).join("");
  if(srcs.length<2)return;
  const imgs=[...peek.children];
  let i=0;
  flipTimer=setInterval(()=>{
    imgs[i].classList.remove("show");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("show");
  },FRAME_MS);
}
rowsEl.addEventListener("mouseover",e=>{
  const row=e.target.closest(".row");
  if(!row||!row.dataset.art){peek.classList.remove("on");stopFlip();return;}
  showThumb(row.dataset.art);
  peek.classList.add("on");
});
rowsEl.addEventListener("mouseleave",()=>{peek.classList.remove("on");stopFlip();peekKey="";});
rowsEl.addEventListener("mousemove",e=>{
  const w=peek.offsetWidth||460,h=peek.offsetHeight||345;
  let x=e.clientX+28,y=e.clientY+22;
  if(x+w>innerWidth-16)x=e.clientX-w-28;
  if(y+h>innerHeight-16)y=e.clientY-h-22;
  peek.style.left=x+"px"; peek.style.top=y+"px";
});

render();
})();
</script>
</body>
</html>
