<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riso — playgrnd</title>
<meta name="description" content="Generate torn-paper riso collages — stacked bands of ragged two-colour patterns, wandering scribbles, big dots and grain. Exports SVG, PNG and video.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=DM+Mono&display=swap">
<style>
:root{
  --gnd:#EFEFEC;
  --ink:#15161A;
  --hair:rgba(21,22,26,.28);
  --hair2:rgba(21,22,26,.13);
  --key:rgba(21,22,26,.45);
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100dvh;background:radial-gradient(120% 80% at 50% 0%,#F5F5F3 0%,#EAEAE7 100%);
  background-attachment:fixed;color:var(--ink);font-family:var(--mono);font-weight:400;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

/* ---------------- page marks ---------------- */
.mark{position:fixed;pointer-events:none;z-index:1}
.crop{width:20px;height:20px;border:1px solid var(--hair)}
.crop.tl{left:26px;top:26px;border-right:0;border-bottom:0}
.crop.tr{right:26px;top:26px;border-left:0;border-bottom:0}
.crop.bl{left:26px;bottom:26px;border-right:0;border-top:0}
.crop.br{right:26px;bottom:26px;border-left:0;border-top:0}
.edgetick{width:8px;height:1px;background:var(--hair)}

/* ---------------- type ---------------- */
.h{font-size:10px;letter-spacing:.32em;text-transform:uppercase;margin:0 0 13px}
.k{font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--key)}
.v{font-size:8.5px;letter-spacing:.19em;text-transform:uppercase}
.tbl{display:grid;grid-template-columns:auto auto;column-gap:22px;row-gap:5px;align-items:baseline}
.tbl .v{justify-self:start}
.lnk{display:inline-flex;align-items:center;gap:7px;font-size:8.5px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--key);transition:color .12s}
/* icons carried over from a tool's own buttons stay at label size */
.lnk svg,.misc svg,.grp-b svg{width:11px;height:11px;flex:none;display:block}
.lnk:hover{color:var(--ink)}
.lnk[aria-pressed=true],.lnk.on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

/* ---------------- rig ---------------- */
.rig{height:100dvh;display:grid;
  grid-template-columns:246px minmax(0,1fr) 246px;
  grid-template-rows:minmax(0,1fr) auto;
  padding:var(--pad) 60px;column-gap:38px;row-gap:16px;position:relative;z-index:2}
.zone{min-width:0}
/* the side columns run the full height of the page and scroll on their own, so a
   tool can carry any number of parameter groups without the layout changing */
.z-left{grid-column:1;grid-row:1/3} .z-right{grid-column:3;grid-row:1/3}
.z-left,.z-right{align-self:stretch;min-height:0;max-height:100%;
  display:flex;flex-direction:column}
/* one soft-edged scroll box: no scrollbar, no border, just a fade at the foot */
.l-scroll,.z-right{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;-ms-overflow-style:none;--fade:0px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - var(--fade)),transparent 100%);
  mask-image:linear-gradient(to bottom,#000 calc(100% - var(--fade)),transparent 100%)}
.l-scroll::-webkit-scrollbar,.z-right::-webkit-scrollbar{width:0;height:0;display:none}
.l-top,.l-bot{flex:none}
.l-bot{padding-top:26px}
.z-stage{grid-column:2;grid-row:1}
.z-bottom{grid-column:2;grid-row:2;justify-self:center;text-align:center}
.z-right{text-align:right}
.r-mid{margin:auto 0}          /* centred between the readout and the corner */
.r-bot{flex:none}

/* ---------------- identity ---------------- */
.idline{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-bottom:14px}
.idline .brand{display:block;width:74px;color:var(--ink)}
.idline .brand svg{width:100%;height:auto;display:block}
.idline .slash{font-size:10px;color:var(--key)}
.idline .tool{font-size:10px;letter-spacing:.32em;text-transform:uppercase}
.back{display:inline-block;margin-top:16px}

/* ---------------- variation pill ---------------- */
.z-top{position:absolute;left:50%;top:0;translate:-50% 0;z-index:12}
.pill{display:flex;align-items:center;gap:0;height:28px;padding:0 4px 0 18px;
  border:1px solid var(--ink);border-radius:999px;background:var(--gnd)}
.pill .lb{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase}
.pill .sep{width:1px;height:11px;background:var(--hair);margin:0 14px}
.seed{width:62px;border:0;background:none;text-align:center;font-size:9px;
  letter-spacing:.16em;padding:0}
.seed:focus{outline:none;text-decoration:underline;text-underline-offset:4px}
.pbtn{height:20px;padding:0 12px;border-radius:999px;font-size:8.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--key);transition:.12s}
.pbtn:hover{color:var(--ink)}
.pbtn.go{background:var(--ink);color:var(--gnd);margin-left:12px}
.pbtn.go:hover{color:var(--gnd);opacity:.82}

/* standalone pill button — same language as the variation pill */
.pillbtn{height:28px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);
  background:none;color:var(--ink);font-size:8.5px;letter-spacing:.22em;
  text-transform:uppercase;transition:background .13s,color .13s}
.pillbtn:hover{background:rgba(21,22,26,.07)}
.pillbtn[aria-pressed=true]{background:var(--ink);color:var(--gnd)}
.pillbtn[aria-pressed=true]:hover{background:var(--ink);opacity:.85}
.btnrow{display:flex;justify-content:flex-end}
.copy.done{color:var(--ink)}

/* ---------------- hairline sliders ---------------- */
.pr{margin-bottom:17px}
.pr .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.track{position:relative;height:16px}
.track::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--hair2)}
.track::after{content:"";position:absolute;left:0;top:7px;height:1px;background:var(--ink);
  width:calc(var(--p,0) * 1%)}
.pr:hover .track::after{height:2px;top:6.5px}
.track input[type=range]{position:absolute;inset:0;width:100%;height:16px;margin:0;
  -webkit-appearance:none;appearance:none;background:none;cursor:pointer}
.track input[type=range]:active{cursor:grabbing}
.track input[type=range]::-webkit-slider-runnable-track{height:16px;background:none}
.track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:3px;height:16px;border:0;border-radius:0;background:var(--ink)}
.track input[type=range]:hover::-webkit-slider-thumb{width:5px}
.track input[type=range]::-moz-range-thumb{cursor:grab}
.track input[type=range]:active::-moz-range-thumb{cursor:grabbing}
.track input[type=range]::-moz-range-track{height:16px;background:none;border:0}
.track input[type=range]::-moz-range-thumb{width:3px;height:16px;border:0;border-radius:0;
  background:var(--ink)}
.notch{position:absolute;top:5px;width:1px;height:5px;background:var(--hair2)}

/* ---------------- stage ---------------- */
.z-stage{position:relative;display:grid;place-items:center;padding:64px 46px 30px;min-height:0}
.ring{position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:var(--ring,100%);height:var(--ring,100%);aspect-ratio:1;
  border:1px solid var(--hair2);border-radius:50%;pointer-events:none}
.xh{position:absolute;background:var(--hair2);pointer-events:none}
.xh.hz{left:-24px;right:-24px;top:50%;height:1px}
.xh.vt{top:-24px;bottom:-24px;left:50%;width:1px}
.holder{position:relative;display:block;max-width:100%;max-height:100%;line-height:0}
#art{display:block;max-width:100%;max-height:100%;cursor:pointer;
  box-shadow:0 26px 60px rgba(21,22,26,.14)}
.corner{position:absolute;width:12px;height:12px;border:1px solid var(--ink);pointer-events:none}
.corner.a{left:-18px;top:-18px;border-right:0;border-bottom:0}
.corner.b{right:-18px;top:-18px;border-left:0;border-bottom:0}
.corner.c{left:-18px;bottom:-18px;border-right:0;border-top:0}
.corner.d{right:-18px;bottom:-18px;border-left:0;border-top:0}

/* ---------------- frame rack ---------------- */
.rack{display:grid;grid-template-columns:repeat(2,46px);gap:11px 16px;justify-content:end;
  margin-bottom:2px}
.ratio{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px}
.ratio .box{border:1px solid var(--hair);transition:.12s}
.ratio .t{font-size:7.5px;letter-spacing:.15em;color:var(--key);transition:.12s}
.ratio:hover .box{border-color:var(--ink)}
.ratio:hover .t{color:var(--ink)}
.ratio[aria-pressed=true] .box{border-color:var(--ink);background:var(--ink)}
.ratio[aria-pressed=true] .t{color:var(--ink)}

/* ---------------- inks ---------------- */
.sw-grid{display:flex;flex-wrap:wrap;gap:9px;align-items:center;max-width:210px}
.l-bot .sw-grid{max-width:none}
.l-bot .btn-row{margin-top:18px}
.sw{position:relative;width:15px;height:15px;border-radius:50%;overflow:hidden;display:block;
  transition:transform .12s}
.sw:hover{transform:scale(1.22)}
.sw input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
  border:0;padding:0;background:none;opacity:0;cursor:pointer}
.sw .fill{position:absolute;inset:0}
.sw .x{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;line-height:1;
  background:rgba(21,22,26,.72);color:var(--gnd);opacity:0;transition:.12s}
.sw:hover .x{opacity:1}
.sw.locked .x{display:none}
.sw-add{width:15px;height:15px;border-radius:50%;border:1px solid var(--hair);
  display:grid;place-items:center;font-size:9px;line-height:1;color:var(--key);transition:.12s}
.sw-add:hover{border-color:var(--ink);color:var(--ink)}
.lnks{display:flex;gap:20px;margin-top:16px}

/* ---------------- captures ---------------- */
.caps{display:flex;gap:9px;justify-content:center}
.cap{width:11px;height:11px;border-radius:50%;border:1px solid var(--hair);display:block;
  padding:0;transition:.12s}
.cap:hover{border-color:var(--ink)}
.cap[aria-current=true]{background:var(--ink);border-color:var(--ink)}
.cap.slot{opacity:.45;cursor:default}
.capnav{font-size:9px;color:var(--key);padding:0 4px;line-height:11px}
.capnav[disabled]{opacity:.3;pointer-events:none}
.tport{display:flex;align-items:center;gap:12px;margin-top:16px;justify-content:center}
.play{width:18px;height:18px;display:grid;place-items:center}
.play svg{fill:var(--ink);width:8px;height:9px}
#scrub{width:150px;height:14px;-webkit-appearance:none;appearance:none;background:none;margin:0}
#scrub::-webkit-slider-runnable-track{height:14px;background:none}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:11px;border:0;
  border-radius:0;background:var(--ink)}
#scrub::-moz-range-track{height:14px;background:none;border:0}
#scrub::-moz-range-thumb{width:3px;height:11px;border:0;border-radius:0;background:var(--ink)}
.scrubwrap{position:relative;height:14px}
.scrubwrap::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;
  background:var(--hair2)}
#scrub[disabled]{opacity:.35}
.hint{display:block;margin-top:14px}

/* ---------------- parameter groups ---------------- */
.grp{margin:0 0 4px}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.32em;
  text-transform:uppercase;padding:15px 0 13px;background:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"+";font-size:12px;line-height:1;color:var(--key);
  letter-spacing:0;transition:color .12s}
.grp[open]>summary::after{content:"\2212"}
.grp>summary:hover::after{color:var(--ink)}
.grp-b{padding-bottom:8px}
.z-right .grp>summary{flex-direction:row-reverse;justify-content:flex-start;gap:10px}
.idblock{padding-bottom:4px}
.r-top .grp>summary{padding-top:26px}
.z-left .idblock{padding-bottom:34px}

/* leftovers passed through from the tool's own panel */
.misc{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:14px;min-height:20px}
/* in the colour corner nothing sits opposite anything: label above, control below */
.l-bot .misc{flex-direction:column;align-items:flex-start;gap:9px;margin-bottom:18px}
.l-bot .misc .mhead{width:100%;justify-content:flex-start}
.l-bot .misc .mval{justify-content:flex-start;width:100%}
.l-bot .misc:last-child{margin-bottom:0}
.misc .mhead{display:flex;align-items:baseline;gap:10px;flex:none}
.misc .mval{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;
  min-width:0}
.misc .sw-grid{max-width:none}
.btn-row,.expmenu{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px}
.z-left .btn-row{justify-content:flex-start}
/* a row that is only a button has nothing to sit opposite — start it at the edge */
.misc .mhead:empty{display:none}
.misc .mhead:empty + .mval{justify-content:flex-start;flex:1}
.pair{display:flex;gap:30px;margin-bottom:18px}
.pair>*{display:flex;flex-direction:column;gap:9px}
.pair .lab{font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--key);
  display:block;margin:0}
.note{font-size:8.5px;letter-spacing:.06em;line-height:1.7;color:var(--key);margin:2px 0 14px;
  text-transform:none}
.sec-h{font-size:10px;letter-spacing:.32em;text-transform:uppercase;margin:0 0 12px}
.lab{font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--key)}
.val{font-size:8.5px;letter-spacing:.19em;text-transform:uppercase}
.switch{width:30px;height:16px;border-radius:999px;border:1px solid var(--ink);position:relative}
.switch::after{content:"";position:absolute;left:2px;top:1.5px;width:11px;height:11px;
  border-radius:50%;background:var(--ink);transition:.13s}
.switch[aria-pressed=true]{background:var(--ink)}
.switch[aria-pressed=true]::after{left:15px;background:var(--gnd)}

/* ---------------- disclosures ---------------- */
.group{margin-top:14px}
.group[hidden]{display:none}
/* floats over the page so the layout underneath never reflows */
.group.pop{position:fixed;z-index:70;margin:0;width:232px;padding:16px;
  background:var(--gnd);border:1px solid var(--ink);text-align:left}
.group.pop .chips,.group.pop .expmenu{justify-content:flex-start}
.group.pop .pr .top{flex-direction:row}
.group.pop .pr{margin-bottom:0}
.group.pop .expmenu{gap:14px 18px;margin-top:14px}
.group.pop > :last-child{margin-bottom:0}
.chips{display:flex;gap:14px;margin-top:4px}
.chip{font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--key);
  transition:color .12s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.modrow{margin-bottom:14px}
.expmenu{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;justify-content:flex-end}
.z-right .rack,.z-right .tbl,.z-right .pr,.z-right .chips{margin-left:auto}
.z-right,.z-br{text-align:right}
.z-right .tbl,.z-br .tbl{justify-content:end}
.z-right .chips{justify-content:flex-end}
.z-right .pr .top,.z-br .pr .top{flex-direction:row}
.rightblock{width:196px}

/* ---------------- add-colour popover ---------------- */
.addpop{position:fixed;z-index:80;display:flex;align-items:center;gap:9px;
  background:var(--gnd);border:1px solid var(--ink);border-radius:0;padding:9px}
.addpop .ap-sw{position:relative;width:22px;height:22px;border-radius:50%;overflow:hidden;
  display:block;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(21,22,26,.3)}
.addpop .ap-sw input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
  border:0;padding:0;background:none;opacity:0;cursor:pointer}
.addpop .ap-sw .fill{position:absolute;inset:0}
.addpop .ap-hex{width:96px;height:22px;background:none;border:0;border-bottom:1px solid var(--hair);
  padding:0 2px;font-size:9px;letter-spacing:.14em;text-transform:lowercase}
.addpop .ap-hex:focus{outline:none;border-bottom-color:var(--ink)}
.addpop .ap-hex.bad{border-bottom-color:#c8484d;color:#c8484d}
.addpop .ap-add{height:22px;padding:0 10px;font-size:8.5px;letter-spacing:.19em;
  text-transform:uppercase;background:var(--ink);color:var(--gnd)}

/* ---------------- toast ---------------- */
.toast{position:fixed;left:50%;bottom:26px;translate:-50% 8px;background:var(--ink);
  color:var(--gnd);padding:9px 18px;font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:.2s;z-index:90}
.toast.show{opacity:1;translate:-50% 0}
.toast.busy::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--gnd);margin-right:8px;vertical-align:middle;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

#strip,#glyph,#ratioVal{display:none}

/* ---------------- narrow ---------------- */
@media (max-width:1180px){
  body{overflow:auto}
  .rig{height:auto;min-height:100dvh;grid-template-columns:1fr;
    grid-template-rows:auto;row-gap:30px;padding:0 30px 60px}
  .z-left,.z-stage,.z-right,.z-bottom{
    grid-column:1;grid-row:auto;justify-self:stretch;align-self:auto;text-align:left;
    max-height:none;overflow:visible;display:block}
  .l-scroll{overflow:visible;max-height:none;-webkit-mask-image:none;mask-image:none}
  .l-bot{padding-top:12px}
  /* the work comes first and stays put while the controls scroll under it */
  .z-stage{order:1} .z-left{order:2} .z-bottom{order:3} .z-right{order:4}
  .z-stage{height:52dvh;padding:64px 26px 26px;overflow:hidden;
    position:sticky;top:0;z-index:20;background:#F3F3F1;
    margin:0 -30px;padding-left:30px;padding-right:30px}
  .z-bottom{justify-self:stretch;text-align:left}
  .z-right .grp>summary{flex-direction:row}
  .xh.hz{left:0;right:0} .xh.vt{top:0;bottom:0}
  .z-right,.z-br{text-align:left}
  .z-right .rack,.z-right .tbl,.z-right .pr,.z-right .chips{margin-left:0}
  .rack{justify-content:start}
  .z-right .chips,.expmenu,.z-right .tbl,.z-br .tbl{justify-content:start}
  .btnrow{justify-content:flex-start}
  .rightblock{width:auto}
  .z-bottom{justify-self:stretch;text-align:left}
  .caps,.tport{justify-content:flex-start}
  .mark{display:none}
}
</style>
</head>

<script>
(() => {

const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function rng(s){let a=(s>>>0)||1;return()=>{a^=a<<13;a>>>=0;a^=a>>17;a^=a<<5;a>>>=0;return a/4294967296;};}
function hashi(x,y,z,s){
  let n=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1440662683)^Math.imul(s|0,1013904223);
  n=Math.imul(n^(n>>>15),2246822519);n=Math.imul(n^(n>>>13),3266489917);n^=n>>>16;
  return (n>>>0)/4294967296;
}
function hex2rgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function relLum(h){const[r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return .2126*r+.7152*g+.0722*b;}

const RATIOS=[{id:"1:1",w:1,h:1},{id:"4:5",w:4,h:5},{id:"3:4",w:3,h:4},{id:"9:16",w:9,h:16},{id:"5:4",w:5,h:4},{id:"4:3",w:4,h:3},{id:"3:2",w:3,h:2},{id:"16:9",w:16,h:9}];
const MODES=[["tear","Tear"],["scribble","Scribble"],["flicker","Flicker"]];
/* riso ink sets: mids, one hot, one dark, one pale */
const PALETTES=[
  ["#9B7FD4","#F26B1D","#FF4FA0","#556135","#E0402A","#9A97C9"],
  ["#F2A0C8","#2B3AD8","#F5C518","#1E4A2E","#F0480F","#EFE9D4"],
  ["#63D8C2","#E0402A","#F5C518","#2B2B8C","#FF87C3","#E8E4DC"],
  ["#FF9E3D","#1B4FA0","#FF4FA0","#3A4A1E","#8A5CF0","#F2EFE8"],
  ["#C9E265","#8A2BE2","#F0621E","#1E3A5A","#FF3DA6","#F5F0E8"],
  ["#F5C518","#E22BC3","#2AAE9E","#4A2010","#2E7CFF","#EFE9D4"]
];

const S={
  seed:11, ratio:"1:1",
  bands:3, rough:.5, scrib:.6, dotp:.5, grain:.5,
  pal:PALETTES[0].slice(),
  motion:{on:false,mode:"tear",amount:.8,fps:8,frames:16},

};

function motionState(f){
  const M=S.motion;
  const t=M.on?f/M.frames:0;
  return{t,mode:M.on?M.mode:"",amp:M.amount,f};
}

/* ============================================================
   The collage engine — stacked bands of ragged two-colour
   patterns, cut with jittered polygon edges so every shape
   reads as torn paper. Canvas and SVG walk the same polygons.

const VB=1000;
function vbH(){const r=RATIOS.find(x=>x.id===S.ratio);return VB*r.h/r.w;}
function buildSpec(){
  const r=rng(S.seed*2654435761>>>0);
  const H=vbH();
  const n=S.bands|0;
  /* band heights: uneven but never slivers */
  const ws=[];let sum=0;
  for(let i=0;i<n;i++){const v=0.6+r()*1.2;ws.push(v);sum+=v;}
  const kinds=["blocks","streaks","static","blocks","streaks"];
  for(let i=kinds.length-1;i>0;i--){const j=(r()*(i+1))|0;const t2=kinds[i];kinds[i]=kinds[j];kinds[j]=t2;}
  const nc=S.pal.length;
  /* pick a second ink that actually reads against the first */
  const against=(base,r2)=>{
    let fg=(r2*nc)|0;
    for(let q=0;q<nc;q++){
      const c2=(fg+q)%nc;
      if(c2!==base&&Math.abs(relLum(S.pal[c2])-relLum(S.pal[base]))>0.09)return c2;
    }
    return (base+1)%nc;
  };
  const bands=[];let y=0;
  for(let i=0;i<n;i++){
    const h=ws[i]/sum*H;
    const bg=(r()*nc)|0;
    const fg=against(bg,r());
    bands.push({y0:y,y1:y+h,kind:kinds[i%kinds.length],bg,fg,v:r(),v2:r(),id:i});
    y+=h;
  }
  const scribs=[];
  const ns=Math.round(S.scrib*3);
  for(let i=0;i<ns;i++){
    const pts=[];
    let px=r()*VB*0.3, py=r()*H*0.5;
    let ang=r()*TAU, sp=VB*0.02+r()*VB*0.02;
    for(let q=0;q<70;q++){
      pts.push([px,py]);
      ang+=(hashi(i,q,3,S.seed)-0.5)*1.4;
      /* the pen loops back if it wanders off the page */
      if(px<0||px>VB)ang=Math.PI-ang;
      if(py<0||py>H)ang=-ang;
      px+=Math.cos(ang)*sp;py+=Math.sin(ang)*sp;
    }
    /* smooth the walk so it reads as a hand line */
    const sm=[pts[0]];
    for(let q=1;q<pts.length-1;q++)
      sm.push([(pts[q-1][0]+pts[q][0]*2+pts[q+1][0])/4,(pts[q-1][1]+pts[q][1]*2+pts[q+1][1])/4]);
    sm.push(pts[pts.length-1]);
    scribs.push(sm);
  }
  let dot=null;
  if(r()<S.dotp){
    const b=bands[(r()*bands.length)|0];
    const rr=Math.min(VB,H)*(0.14+r()*0.10);
    dot={cx:VB*(0.3+r()*0.4),cy:Math.min(b.y1-rr*0.3,Math.max(b.y0+rr*0.3,b.y0+(b.y1-b.y0)*r())),
      rr,ci:against(b.bg,r()),ph:r()};
  }
  return{bands,scribs,dot,H,SW:(r()*1e9)|0};
}
/* a ragged polygon: rectangle edges subdivided and jittered */
function tornPoly(x,y,w,h,rough,k1,k2,SW,mo,mid){
  const pts=[];
  const wob=(q,ed)=>{
    let j=(hashi(k1,q,ed+k2*7,SW)-0.5)*rough;
    if(mo.mode==="tear")
      j+=rough*0.45*Math.min(1.6,mo.amp)*Math.sin(TAU*(mo.t+hashi(k1,q,ed+50,SW)));
    return j;
  };
  const n=5;
  for(let q=0;q<=n;q++)pts.push([x+w*q/n,y+wob(q,1)]);
  for(let q=1;q<=n;q++)pts.push([x+w+wob(q,2),y+h*q/n]);
  for(let q=n-1;q>=0;q--)pts.push([x+w*q/n,y+h+wob(q,3)]);
  for(let q=n-1;q>=1;q--)pts.push([x+wob(q,4),y+h*q/n]);
  return pts;
}
/* everything on the sheet, one frame, as layered polygon lists */
function sceneParts(f){
  const mo=motionState(f);
  const sp=buildSpec();
  const H=sp.H;
  const rough=S.rough;
  const flickState=mo.mode==="flicker"?mo.f%S.motion.frames:0;
  const bandsOut=[];
  for(const b of sp.bands){
    const bh=b.y1-b.y0;
    const shapes=[];
    const rg=VB*0.016*(0.4+rough*1.6);
    if(b.kind==="blocks"){
      const cols=5+((b.v*3)|0);
      const rows=Math.max(1,Math.round(bh/(VB*0.16)));
      const cw2=VB/cols, ch2=bh/rows;
      for(let cy2=0;cy2<rows;cy2++)for(let cx2=0;cx2<cols;cx2++){
        let on=hashi(cx2,cy2,b.id*3+1,sp.SW)<0.58;
        if(mo.mode==="flicker"&&hashi(cx2,cy2,b.id*5+flickState,sp.SW)<0.05)on=!on;
        if(!on)continue;
        const jx=(hashi(cx2,cy2,b.id+11,sp.SW)-0.5)*cw2*0.4;
        const jy=(hashi(cx2,cy2,b.id+12,sp.SW)-0.5)*ch2*0.3;
        const w2=cw2*(0.7+hashi(cx2,cy2,b.id+13,sp.SW)*0.55);
        const h2=ch2*(0.75+hashi(cx2,cy2,b.id+14,sp.SW)*0.5);
        shapes.push(tornPoly(cx2*cw2+jx,b.y0+cy2*ch2+jy,w2,h2,rg,cx2+cy2*31,b.id,sp.SW,mo));
      }
    }else if(b.kind==="streaks"){
      const cols=7+((b.v*3)|0);
      const cw2=VB/cols;
      for(let i=0;i<cols;i++){
        if(hashi(i,0,b.id*7+2,sp.SW)<0.16)continue;
        const seg=6;
        const L=[],R=[];
        for(let q=0;q<=seg;q++){
          const yy=b.y0+bh*q/seg;
          let wb=(hashi(i,q,b.id*7+3,sp.SW)-0.5)*cw2*1.1*(0.4+rough);
          if(mo.mode==="tear")
            wb+=cw2*0.3*Math.min(1.6,mo.amp)*Math.sin(TAU*(mo.t+hashi(i,q,b.id+60,sp.SW)));
          const wd=cw2*(0.34+hashi(i,q,b.id*7+4,sp.SW)*0.5);
          L.push([i*cw2+cw2/2+wb-wd/2,yy]);
          R.push([i*cw2+cw2/2+wb+wd/2,yy]);
        }
        shapes.push(L.concat(R.reverse()));
      }
    }else{ /* static: rows of scratchy dashes */
      const rows=Math.max(3,Math.round(bh/(VB*0.028)));
      const rh=bh/rows;
      for(let ry=0;ry<rows;ry++){
        const nd=2+((hashi(ry,1,b.id*9+1,sp.SW)*6)|0);
        for(let d2=0;d2<nd;d2++){
          if(mo.mode==="flicker"&&hashi(ry,d2*3+flickState,b.id,sp.SW)<0.08)continue;
          const x0=hashi(ry,d2*2,b.id*9+2,sp.SW)*VB;
          const ln=VB*(0.03+hashi(ry,d2*2+1,b.id*9+3,sp.SW)*0.16);
          shapes.push(tornPoly(x0,b.y0+ry*rh+rh*0.2,ln,rh*0.55,rg*0.5,ry*17+d2,b.id,sp.SW,mo));
        }
      }
    }
    bandsOut.push({b,shapes});
  }
  /* the big dot, edge gently torn */
  let dotPoly=null;
  if(sp.dot){
    const d2=sp.dot,pts=[];
    for(let q=0;q<36;q++){
      const a2=q/36*TAU;
      let rr=d2.rr*(1+(hashi(q,1,77,sp.SW)-0.5)*0.05*rough);
      pts.push([d2.cx+Math.cos(a2)*rr,d2.cy+Math.sin(a2)*rr]);
    }
    dotPoly={pts,col:S.pal[d2.ci%S.pal.length]};
  }
  /* scribbles, optionally drawing themselves */
  const scribsOut=sp.scribs.map(sm=>{
    if(mo.mode==="scribble"){
      const k=Math.max(2,Math.ceil(sm.length*((mo.f+1)/S.motion.frames)));
      return sm.slice(0,k);
    }
    return sm;
  });
  /* grain specks over everything */
  const specks=[];
  const ns=Math.round(S.grain*700);
  for(let i=0;i<ns;i++){
    const gk=mo.mode==="flicker"?flickState:0;
    specks.push([hashi(i,1,gk+91,sp.SW)*VB,hashi(i,2,gk+92,sp.SW)*H,
      hashi(i,3,gk+93,sp.SW)<0.55]);
  }
  return{bandsOut,dotPoly,scribsOut,specks,H,sp};
}
function paint(c,W,Hpx,f){
  const P=sceneParts(f);
  const k=W/VB;
  c.setTransform(1,0,0,1,0,0);
  for(const{b,shapes}of P.bandsOut){
    c.save();
    c.beginPath();c.rect(0,b.y0*k-0.5,W,(b.y1-b.y0)*k+1);c.clip();
    c.fillStyle=S.pal[b.bg%S.pal.length];c.fillRect(0,b.y0*k-1,W,(b.y1-b.y0)*k+2);
    c.fillStyle=S.pal[b.fg%S.pal.length];
    for(const pts of shapes){
      c.beginPath();
      pts.forEach((p,i)=>i?c.lineTo(p[0]*k,p[1]*k):c.moveTo(p[0]*k,p[1]*k));
      c.closePath();c.fill();
    }
    c.restore();
  }
  if(P.dotPoly){
    c.beginPath();
    P.dotPoly.pts.forEach((p,i)=>i?c.lineTo(p[0]*k,p[1]*k):c.moveTo(p[0]*k,p[1]*k));
    c.closePath();c.fillStyle=P.dotPoly.col;c.fill();
  }
  c.strokeStyle=INK;c.lineWidth=Math.max(1,VB*0.0035*k);c.lineCap="round";c.lineJoin="round";
  for(const sm of P.scribsOut){
    c.beginPath();
    sm.forEach((p,i)=>i?c.lineTo(p[0]*k,p[1]*k):c.moveTo(p[0]*k,p[1]*k));
    c.stroke();
  }
  const sr=Math.max(1,VB*0.0016*k);
  for(const[x,y,dk]of P.specks){
    c.fillStyle=dk?"rgba(10,10,10,0.5)":"rgba(255,255,255,0.4)";
    c.fillRect(x*k,y*k,sr,sr);
  }
}
/* ---------- SVG: the same parts as strings, per layer ---------- */
function svgLayers(f,uid){
  const P=sceneParts(f);
  const f1=x=>x.toFixed(1);
  const poly=pts=>`<polygon points="${pts.map(p=>f1(p[0])+","+f1(p[1])).join(" ")}"/>`;
  let bands="",defs="";
  P.bandsOut.forEach(({b,shapes},i)=>{
    const cid=`c${uid}_${i}`;
    defs+=`<clipPath id="${cid}"><rect x="0" y="${f1(b.y0-0.5)}" width="${VB}" height="${f1(b.y1-b.y0+1)}"/></clipPath>`;
    bands+=`<g clip-path="url(#${cid})"><rect x="0" y="${f1(b.y0-1)}" width="${VB}" height="${f1(b.y1-b.y0+2)}" fill="${S.pal[b.bg%S.pal.length]}"/>`+
      `<g fill="${S.pal[b.fg%S.pal.length]}">${shapes.map(poly).join("")}</g></g>`;
  });
  const dot=P.dotPoly?`<g fill="${P.dotPoly.col}">${poly(P.dotPoly.pts)}</g>`:"";
  const scrib=P.scribsOut.length
    ?`<g fill="none" stroke="${INK}" stroke-width="${(VB*0.0035).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">`+
      P.scribsOut.map(sm=>`<polyline points="${sm.map(p=>f1(p[0])+","+f1(p[1])).join(" ")}"/>`).join("")+`</g>`:"";
  let g1="",g2="";
  for(const[x,y,dk]of P.specks){
    const r2=`<rect x="${f1(x)}" y="${f1(y)}" width="1.6" height="1.6"/>`;
    if(dk)g1+=r2;else g2+=r2;
  }
  const grain=(g1||g2)?`<g fill="#0A0A0A" opacity="0.5">${g1}</g><g fill="#FFFFFF" opacity="0.4">${g2}</g>`:"";
  return{defs,bands,dot,scrib,grain,H:P.H};
}
function svgWrap(defs,inner){
  const r=RATIOS.find(x=>x.id===S.ratio);
  const W=S.size,H=Math.round(S.size*r.h/r.w);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${VB} ${vbH().toFixed(1)}">`+
    (defs?`<defs>${defs}</defs>`:"")+inner+`</svg>`;
}
function buildSVG(){
  const L=svgLayers(curFrame,0);
  return svgWrap(L.defs,L.bands+L.dot+L.scrib+L.grain);
}
/* the loop stacks only the layers the current movement changes */
function buildLoopSVG(){
  const M=S.motion,F=M.frames,dur=(F/M.fps).toFixed(3);
  const moving=M.mode==="tear"?["bands"]:M.mode==="scribble"?["scrib"]:["bands","grain"];
  const perFrame=[];let defs="";
  for(let f=0;f<F;f++){const L=svgLayers(f,f);perFrame.push(L);if(f===0)defs="";defs+=L.defs;}
  const stack=key=>{
    const segs=[];
    for(let f=0;f<F;f++){
      const s2=perFrame[f][key];
      const cmp=s2.replace(/c\d+_/g,"c_");
      if(segs.length&&segs[segs.length-1].cmp===cmp)segs[segs.length-1].n++;
      else segs.push({cmp,c:s2,f0:f,n:1});
    }
    let out2="";
    segs.forEach((sg,i)=>{
      const t0=(sg.f0/F).toFixed(5),t1=((sg.f0+sg.n)/F).toFixed(5);
      const anim=i===0
        ?`<animate attributeName="visibility" values="visible;hidden" keyTimes="0;${t1}" dur="${dur}s" calcMode="discrete" repeatCount="indefinite"/>`
        :`<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;${t0};${t1}" dur="${dur}s" calcMode="discrete" repeatCount="indefinite"/>`;
      out2+=`<g visibility="${i===0?"visible":"hidden"}">${anim}${sg.c}</g>`;
    });
    return out2;
  };
  const L0=perFrame[0];
  const part=key=>moving.includes(key)?stack(key):L0[key];
  return svgWrap(defs,part("bands")+part("dot")+part("scrib")+part("grain"));
}

const art=$("#art"), ctx=art.getContext("2d",{alpha:false});
function fitCanvas(){
  const r=RATIOS.find(x=>x.id===S.ratio);
  const box=$(".stage-inner");
  let dpr=Math.min(2,window.devicePixelRatio||1);
  let availW=700,availH=700;
  if(box&&box.clientWidth){
    const bs=getComputedStyle(box);
    availW=box.clientWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight);
    availH=box.clientHeight-parseFloat(bs.paddingTop)-parseFloat(bs.paddingBottom);
  }
  availW=Math.max(80,availW);availH=Math.max(80,availH);
  const s=Math.min(availW/r.w,availH/r.h);
  const dispW=Math.max(40,Math.floor(r.w*s)),dispH=Math.max(40,Math.floor(r.h*s));
  const w=Math.round(dispW*dpr),h=Math.round(dispH*dpr);
  if(art.width!==w||art.height!==h){art.width=w;art.height=h;}
  if(art.style.width!==dispW+"px"||art.style.height!==dispH+"px"){
    art.style.width=dispW+"px";art.style.height=dispH+"px";
  }
  return{w,h};
}
let curFrame=0,queued=false;
function draw(){
  const{w,h}=fitCanvas();
  const t0=performance.now();
  paint(ctx,w,h,curFrame);
  const ms=Math.round(performance.now()-t0);
  $("#dims").textContent=w+"×"+h+" · "+ms+"ms";
  const F=S.motion.on?S.motion.frames:1;
  $("#frameno").textContent=String(curFrame+1).padStart(2,"0")+" / "+String(F).padStart(2,"0");
}
function requestDraw(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;draw();});}
const reframe=requestDraw;
if(window.ResizeObserver){
  const box=$(".stage-inner");
  if(box){let p=false;new ResizeObserver(()=>{if(p)return;p=true;requestAnimationFrame(()=>{p=false;draw();});}).observe(box);}
}
let playing=false,t0=0,raf=0;
function tick(now){
  if(!playing)return;
  const M=S.motion,dur=(M.frames/M.fps)*1000;
  const f=Math.floor(((now-t0)%dur)/dur*M.frames)%M.frames;
  if(f!==curFrame){curFrame=f;$("#scrub").value=f;draw();}
  raf=requestAnimationFrame(tick);
}
function setPlaying(v){
  playing=v&&S.motion.on;
  $("#playIcon").innerHTML=playing
    ?'<rect x="0" y="0" width="3.5" height="11"/><rect x="6.5" y="0" width="3.5" height="11"/>'
    :'<path d="M0 0l10 5.5L0 11z"/>';
  cancelAnimationFrame(raf);
  if(playing){t0=performance.now()-(curFrame/S.motion.frames)*(S.motion.frames/S.motion.fps*1000);raf=requestAnimationFrame(tick);}
  else requestDraw();
}

function pickVideoType(){
  const t=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  for(const x of t)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(x))return x;

}
$("#expVid").addEventListener("click",()=>{
  if(!S.motion.on)return toast("Turn on motion first");
  const type=pickVideoType();
  if(!type)return toast("This browser can't record video");
  const ext=type.startsWith("video/mp4")?"mp4":"webm";
  const r=RATIOS.find(x=>x.id===S.ratio);
  let W=Math.min(1120,S.size);W-=W%2;
  let H=Math.round(W*r.h/r.w);H-=H%2;
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const cc=c.getContext("2d");

  const rec=new MediaRecorder(c.captureStream(60),{mimeType:type,videoBitsPerSecond:16000000});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{save(new Blob(chunks,{type}),stamp()+"-loop."+ext);toast(ext.toUpperCase()+" saved");};
  const was=playing;setPlaying(false);
  toast("Recording…",true);
  let n=0;
  rec.start();
  (function step(){
    paint(cc,W,H,n%F);
    n++;
    if(n<F*loops) setTimeout(()=>requestAnimationFrame(step), Math.max(0,1000/S.motion.fps-4));
    else setTimeout(()=>{rec.stop();if(was)setPlaying(true);},200);
  })();
});

    const commit=hex=>{S.pal.push(hex);buildSwatches();accent();reframe();};
    if(window.__pickColour) window.__pickColour(add,commit);
    else commit(hsl2hex(Math.random()*360,45+Math.random()*45,42+Math.random()*30));
  });
  host.appendChild(add);
}
function setPalette(p){S.pal=p.slice();buildSwatches();accent();reframe();}
function bindRange(id,fmt,set,after){
  const el=$("#"+id),label=$("#"+id+"Val");
  if(!el)return;
  el.addEventListener("input",()=>{
    const v=parseFloat(el.value);set(v);
    if(label)label.textContent=fmt(v);
    (after||reframe)();
  });
}
const pct=v=>Math.round(v*100)+"%";

buildRatios();buildSwatches();accent();
segmented($("#modes"),MODES,()=>S.motion.mode,v=>{S.motion.mode=v;reframe();});
function hsl2hex(h,sa,l){
  h=((h%360)+360)%360;sa/=100;l/=100;
  const a=sa*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));
    return Math.round(c*255).toString(16).padStart(2,"0");};
  return "#"+f(0)+f(8)+f(4);
}
/* New set mixes fresh riso ink sets with the curated list */
function newPalette(){
  const R=Math.random;
  if(R()<0.25)return PALETTES[(R()*PALETTES.length)|0].slice();
  const h=R()*360;
  return[
    hsl2hex(h,45+R()*25,60+R()*10),
    hsl2hex(h+120+R()*60,70+R()*25,52+R()*10),
    hsl2hex(h+200+R()*60,80+R()*20,58+R()*8),
    hsl2hex(h+60+R()*40,30+R()*20,24+R()*10),
    hsl2hex(h+300+R()*40,75+R()*25,50+R()*10),
    hsl2hex(h+30,20+R()*20,84+R()*8)
  ];
}
$("#shufColors").addEventListener("click",()=>{
  let p;do{p=newPalette();}while(p[0]===S.pal[0]&&p[1]===S.pal[1]);
  const n=S.pal.length;
  while(p.length<n) p.push(hsl2hex(Math.random()*360,45+Math.random()*45,42+Math.random()*30));
  setPalette(p.slice(0,n));
});
$("#rotColors").addEventListener("click",()=>{
  setPalette(S.pal.slice(1).concat([S.pal[0]]));
});
bindRange("bands",v=>v,v=>S.bands=v|0);
bindRange("rough",pct,v=>S.rough=v);
bindRange("scrib",pct,v=>S.scrib=v);
bindRange("dotp",pct,v=>S.dotp=v);
bindRange("grain",pct,v=>S.grain=v);
bindRange("amt",v=>v.toFixed(2),v=>S.motion.amount=v);
$("#fps").addEventListener("input",e=>{S.motion.fps=parseInt(e.target.value,10);
  $("#fpsVal").textContent=S.motion.fps+" fps";if(playing)setPlaying(true);});
$("#frames").addEventListener("input",e=>{S.motion.frames=parseInt(e.target.value,10);
  $("#framesVal").textContent=S.motion.frames+" frames";$("#scrub").max=S.motion.frames-1;
  curFrame=Math.min(curFrame,S.motion.frames-1);reframe();if(playing)setPlaying(true);});
$("#size").addEventListener("input",e=>{S.size=parseInt(e.target.value,10);$("#sizeVal").textContent=S.size+" px";});
$("#motionTog").addEventListener("click",e=>{
  S.motion.on=!S.motion.on;
  e.currentTarget.setAttribute("aria-pressed",String(S.motion.on));
  $("#motionBody").hidden=!S.motion.on;
  curFrame=0;$("#scrub").value=0;
  reframe();updateExportNote();
  setPlaying(S.motion.on&&!reduceMotion);
});
$("#play").addEventListener("click",()=>{if(!S.motion.on){$("#motionTog").click();return;}setPlaying(!playing);});
$("#scrub").addEventListener("input",e=>{setPlaying(false);curFrame=parseInt(e.target.value,10)%Math.max(1,S.motion.frames);draw();});
/* the seed deals the whole collage inside the engine; here it deals
   the layout numbers */
function applySeed(){
  const r=rng((S.seed^0x9e3779b9)>>>0);
  const pick=a=>a[(r()*a.length)|0];
  S.bands=pick([2,3,3,3,4,5]);
  S.rough=pick([0.35,0.5,0.5,0.65,0.8]);
  S.scrib=pick([0.3,0.6,0.6,0.9]);
}
function syncControls(){
  const set=(id,v,txt)=>{const el=$("#"+id);if(el)el.value=v;const l=$("#"+id+"Val");if(l)l.textContent=txt;};
  set("bands",S.bands,S.bands);
  set("rough",S.rough,pct(S.rough));
  set("scrib",S.scrib,pct(S.scrib));
}
function newSeed(v){S.seed=(v!==undefined)?v:(Math.random()*99999|0)+1;$("#seed").value=S.seed;applySeed();syncControls();reframe();}
$("#shuf").addEventListener("click",()=>newSeed());
$("#seed").addEventListener("change",e=>{const v=parseInt(e.target.value,10);newSeed(Number.isFinite(v)?Math.abs(v):1);});
art.addEventListener("click",()=>newSeed());
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.code==="Space"){e.preventDefault();newSeed();}
  if(e.key==="p"||e.key==="P"){if(S.motion.on)setPlaying(!playing);}
});
newSeed(11);
$("#scrub").max=S.motion.frames-1;
updateExportNote();
draw();
})();
</script>

     (used by the landing page to show live output as its background). -->
<style>
html.embed .topbar,html.embed .panel,html.embed .transport,html.embed .toast{display:none!important}
html.embed .app{height:100dvh!important;grid-template-rows:1fr!important}

html.embed body{overflow:hidden!important}
</style>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  /* embed mode: explicit flag, or being shown inside another page (the
     landing background) — servers with clean URLs drop query strings */
  var embedded=q.has("embed")||location.hash.indexOf("embed")>-1;
  try{embedded=embedded||window.self!==window.top;}catch(e){embedded=true;}
  if(!embedded) return;
  document.documentElement.classList.add("embed");
  /* pick the preset ratio closest to the viewport so the cover-crop stays small */
  var R=[[9,16],[3,4],[4,5],[1,1],[5,4],[4,3],[3,2],[16,9]];
  var vr=innerWidth/Math.max(1,innerHeight),best=3,bd=1e9;
  for(var i=0;i<R.length;i++){var d=Math.abs(Math.log(vr*R[i][1]/R[i][0]));if(d<bd){bd=d;best=i}}
  var rb=document.querySelectorAll("#ratios .ratio")[best]; if(rb) rb.click();
  /* fresh artwork per load, or a pinned one via ?seed=N */
  var seed=q.get("seed"), si=document.getElementById("seed");
  if(seed&&si){si.value=seed;si.dispatchEvent(new Event("change"));}
  else{var sh=document.getElementById("shuf"); if(sh) sh.click();}
  /* start the tool's own motion; static tools re-roll on a slow cadence instead */
  var mt=document.getElementById("motionTog");
  if(mt){if(mt.getAttribute("aria-pressed")!=="true") mt.click();}
  else setInterval(function(){var sh=document.getElementById("shuf");if(sh)sh.click();},7000);
  /* tell an embedding page the first frame has painted */
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    try{if(parent!==window)parent.postMessage({type:"tool-embed-ready"},"*");}catch(e){}
  });});
})();
</script>
<!-- Hex entry for colour swatches: tap a swatch, type a hex code.

<style>
.hexpop{position:fixed;z-index:70;display:flex;gap:6px;align-items:center;
  background:var(--panel-2,#15151a);border:1px solid var(--line,#22222a);border-radius:6px;

.hexpop .hexfield:focus{outline:none;border-color:var(--accent,#F0621E)}
.hexpop .hexfield.bad{border-color:#c8484d}
.hexpop .hexwheel{font-family:var(--mono,ui-monospace,monospace);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted,#7c7c88);background:none;border:1px solid var(--line,#22222a);
  border-radius:4px;padding:7px 9px;cursor:pointer}
.hexpop .hexwheel:hover{color:var(--text,#EFEDE8)}
</style>
<script>
(function(){
  "use strict";
  var pop=null,bypass=false;
  function close(){if(pop){pop.remove();pop=null;}}
  function openFor(inp){
    close();
    pop=document.createElement("div");
    pop.className="hexpop";
    pop.innerHTML='<input class="hexfield" spellcheck="false" autocomplete="off" inputmode="text" value="'+inp.value+'">'+
      '<button class="hexwheel" type="button">Wheel</button>';
    document.body.appendChild(pop);
    var anchor=(inp.closest&&(inp.closest(".sw")||inp.closest("label")))||inp;
    var r=anchor.getBoundingClientRect();
    var w=pop.offsetWidth||170,h=pop.offsetHeight||38;
    var x=Math.min(Math.max(8,r.left),innerWidth-w-8);
    var y=r.bottom+6; if(y+h>innerHeight-8)y=r.top-h-6;
    pop.style.left=x+"px";pop.style.top=y+"px";
    var f=pop.querySelector(".hexfield");
    function norm(){
      var v=f.value.trim().replace(/^#/,"");
      if(/^[0-9a-fA-F]{3}$/.test(v))v=v.replace(/./g,function(c){return c+c;});
      return /^[0-9a-fA-F]{6}$/.test(v)?"#"+v.toLowerCase():null;
    }
    function apply(){
      var hex=norm();
      f.classList.toggle("bad",!hex);
      if(!hex)return false;
      inp.value=hex;
      inp.dispatchEvent(new Event("input",{bubbles:true}));
      inp.dispatchEvent(new Event("change",{bubbles:true}));
      return true;
    }
    f.addEventListener("input",apply);
    f.addEventListener("keydown",function(e){
      if(e.key==="Enter"){e.preventDefault();if(apply())close();}
      if(e.key==="Escape")close();
    });
    pop.querySelector(".hexwheel").addEventListener("click",function(){
      close();bypass=true;inp.click();bypass=false;
    });
    f.focus();f.select();
  }
  document.addEventListener("click",function(e){
    if(pop&&pop.contains(e.target))return;
    var t=e.target;
    var inp=t&&t.matches&&t.matches('input[type=color]')&&!t.hasAttribute('data-nohex')?t:null;
    if(inp&&!bypass){
      e.preventDefault();e.stopPropagation();
      openFor(inp);
      return;
    }
    if(pop)close();
  },true);
})();
</script>











<!-- Instrument chassis runtime: hairline slider fills, capture dots, the corner
     readouts and the Animate / Export disclosures. The tool's own code is untouched. -->
<style>
/* the tool's own hex popover ships after the chassis sheet, so its restyle has to too */
.hexpop{background:var(--gnd);border:1px solid var(--ink);border-radius:0;box-shadow:none;
  padding:9px;gap:9px}
.hexpop .hexfield{background:none;color:var(--ink);border:0;border-bottom:1px solid var(--hair);
  border-radius:0;font-size:9px;letter-spacing:.14em}
.hexpop .hexfield:focus{border-bottom-color:var(--ink)}
.hexpop .hexfield.bad{border-bottom-color:#c8484d;color:#c8484d}
.hexpop .hexwheel{background:var(--ink);color:var(--gnd);border:0;border-radius:0;
  font-size:8.5px;letter-spacing:.19em}
.hexpop .hexwheel:hover{color:var(--gnd);opacity:.85}
</style>
<script>
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s);};

  /* ---- hairline slider fills ------------------------------------------ */
  function pct(el){
    var min=parseFloat(el.min); if(!isFinite(min)) min=0;
    var max=parseFloat(el.max); if(!isFinite(max)) max=100;
    var v=parseFloat(el.value);
    if(!isFinite(v)||max<=min) return 0;
    return Math.max(0,Math.min(100,(v-min)/(max-min)*100));
  }
  function paint(el){
    var pr=el.closest(".pr");
    if(pr) pr.style.setProperty("--p",pct(el).toFixed(3));
  }
  function syncSliders(){
    document.querySelectorAll(".pr input[type=range]").forEach(function(el){
      if(!el.__ins){ el.__ins=1; el.addEventListener("input",function(){paint(el);}); }
      paint(el);
    });
  }
  syncSliders();

  /* ---- the reticle circumscribes whatever the canvas currently is ------ */
  (function reticle(){
    var stage=$(".z-stage"), ring=$(".ring"), c=$("#art");
    if(!stage||!ring||!c) return;
    function size(){
      var b=c.getBoundingClientRect(), s=stage.getBoundingClientRect();
      if(!b.width) return;
      var d=Math.hypot(b.width,b.height)+38;
      d=Math.min(d,Math.min(s.width,s.height));
      stage.style.setProperty("--ring",Math.round(d)+"px");
    }
    size();
    if(window.ResizeObserver){ new ResizeObserver(size).observe(c); new ResizeObserver(size).observe(stage); }
    addEventListener("resize",size);
  })();

  /* whole-number sliders get a notch per step, but only when they fit */
  function notches(){
    document.querySelectorAll(".pr input[type=range]").forEach(function(el){
      var tr=el.parentNode;
      if(tr.__notched) return;
      var w=tr.clientWidth;
      if(!w) return;                      /* inside a collapsed group — try again later */
      tr.__notched=1;
      var min=parseFloat(el.min),max=parseFloat(el.max),st=parseFloat(el.step);
      if(!isFinite(st)||st<=0) return;
      var n=Math.round((max-min)/st);
      if(n<2||n>8||w/n<16) return;
      for(var i=1;i<n;i++){
        var s=document.createElement("span");
        s.className="notch"; s.style.left=(i/n*100).toFixed(2)+"%";
        tr.appendChild(s);
      }
    });
  }
  notches();

  /* ---- the columns fade out at the foot while there is more to scroll -- */
  var boxes=[$(".l-scroll"),$(".z-right")].filter(Boolean);
  function fade(el){
    var more=el.scrollHeight-el.clientHeight-el.scrollTop;
    el.style.setProperty("--fade", more>2 ? "56px" : "0px");
  }
  function fadeAll(){ boxes.forEach(fade); }
  boxes.forEach(function(el){
    el.addEventListener("scroll",function(){fade(el);},{passive:true});
    if(window.ResizeObserver) new ResizeObserver(function(){fade(el);}).observe(el);
  });
  addEventListener("resize",fadeAll);
  /* opening or closing a parameter group changes both the fade and the notches */
  document.addEventListener("toggle",function(){
    syncSliders(); notches(); fadeAll();
  },true);
  fadeAll();

  /* ---- corner readouts ------------------------------------------------- */
  var ratioEcho=$("#ratioEcho"), ratioVal=$("#ratioVal"),
      sizeEcho=$("#sizeEcho"), sizeVal=$("#sizeVal"),
      inkEcho=$("#inkEcho"), swatches=$("#swatches");
  function put(el,v){ if(el && el.textContent!==v) el.textContent=v; }
  function echo(){
    if(ratioVal) put(ratioEcho, ratioVal.textContent||"1:1");
    if(sizeVal) put(sizeEcho, sizeVal.textContent||"");
    if(swatches){
      var n=swatches.querySelectorAll(".sw").length;
      put(inkEcho, (n<10?"0":"")+n);
    }
  }
  echo();
  /* watch only the sources — never the targets, or echo() would feed itself */
  if(window.MutationObserver){
    var mo=new MutationObserver(echo);
    [ratioVal,sizeVal,swatches].forEach(function(n){
      if(n) mo.observe(n,{childList:true,subtree:true,characterData:true});
    });
  }
  var clock=$("#clock");
  if(clock){
    var d=new Date();
    var p=function(n){return (n<10?"0":"")+n;};
    clock.textContent=p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+
      " \u00b7 "+p(d.getHours())+":"+p(d.getMinutes());
  }

  /* ---- captures -------------------------------------------------------- */
  var art=$("#art"), seedIn=$("#seed"), strip=$("#history");
  var hist=[], at=-1, SLOTS=8, CAP=60;

  function snap(){
    if(!art||!art.width) return "";
    var c=document.createElement("canvas");
    c.width=c.height=64;
    var x=c.getContext("2d");
    var s=Math.min(art.width,art.height);
    x.drawImage(art,(art.width-s)/2,(art.height-s)/2,s,s,0,0,64,64);
    try{ return c.toDataURL("image/png"); }catch(e){ return ""; }
  }
  function record(){
    var seed=seedIn?seedIn.value:"";
    var shot=snap();
    if(at>=0 && hist[at] && hist[at].seed===seed){ hist[at].img=shot; }
    else{
      hist=hist.slice(0,at+1);
      hist.push({seed:seed,img:shot});
      if(hist.length>CAP) hist.shift();
      at=hist.length-1;
    }
    drawStrip();
  }
  function go(i){
    if(i<0||i>=hist.length) return;
    at=i;
    if(seedIn){
      seedIn.value=hist[i].seed;
      seedIn.dispatchEvent(new Event("change",{bubbles:true}));
    }
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      if(hist[at]) hist[at].img=snap();
      drawStrip();
    });});
  }
  function drawStrip(){
    if(!strip) return;
    var end=Math.max(SLOTS-1,at), start=end-SLOTS+1;
    var out='<button class="capnav" id="hBack" aria-label="Previous variation">&lsaquo;</button>';
    for(var k=0;k<SLOTS;k++){
      var i=start+k, h=hist[i];
      out += h
        ? '<button class="cap" data-i="'+i+'" aria-current="'+(i===at)+'" '+
          'title="Variation '+h.seed+'" aria-label="Variation '+h.seed+'"></button>'
        : '<span class="cap slot" aria-hidden="true"></span>';
    }
    out += '<button class="capnav" id="hFwd" aria-label="Next variation">&rsaquo;</button>';
    strip.innerHTML=out;
    var b=$("#hBack"), f=$("#hFwd");
    if(b){ b.disabled = at<=0; b.onclick=function(){go(at-1);}; }
    if(f){ f.disabled = at>=hist.length-1; f.onclick=function(){go(at+1);}; }
    strip.querySelectorAll(".cap[data-i]").forEach(function(t){
      t.onclick=function(){go(+t.dataset.i);};
    });
  }

  var shuf=$("#shuf"), rnd=$("#randomize");
  if(rnd){
    rnd.addEventListener("click",function(){
      if(shuf) shuf.click();
      requestAnimationFrame(function(){requestAnimationFrame(record);});
    });
  }
  ["keydown","click"].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(ev==="keydown" && e.code!=="Space") return;
      if(ev==="keydown" && e.target.matches("input,textarea")) return;
      if(ev==="click" && e.target!==art) return;
      requestAnimationFrame(function(){requestAnimationFrame(record);});
    });
  });
  if(seedIn) seedIn.addEventListener("change",function(){
    requestAnimationFrame(function(){requestAnimationFrame(record);});
  });

  /* ---- copy ------------------------------------------------------------ */
  var copy=$("#copySeed");
  function confirmCopy(v){
    if(window.__toast) window.__toast("Variation "+v+" copied");
    if(!copy) return;
    copy.classList.add("done");
    copy.textContent="Copied";
    clearTimeout(copy.__t);
    copy.__t=setTimeout(function(){copy.classList.remove("done");copy.textContent="Copy";},1500);
  }
  function legacy(v){
    try{
      var t=document.createElement("textarea");
      t.value=v; t.style.cssText="position:fixed;opacity:0;pointer-events:none";
      document.body.appendChild(t); t.select();
      var ok=document.execCommand("copy");
      t.remove();
      ok ? confirmCopy(v) : window.__toast && window.__toast("Press Ctrl+C to copy "+v);
    }catch(e){ if(window.__toast) window.__toast("Press Ctrl+C to copy "+v); }
  }
  if(copy) copy.addEventListener("click",function(){
    var v=String(seedIn.value);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(function(){confirmCopy(v);},function(){legacy(v);});
    } else legacy(v);
  });

  /* ---- add-colour popover --------------------------------------------- */
  var pop=null;
  function closePop(){ if(pop){ pop.remove(); pop=null; } }
  window.__pickColour=function(anchor,commit){
    closePop();
    var hex=freshHue();
    pop=document.createElement("div");
    pop.className="addpop";
    pop.innerHTML=
      '<label class="ap-sw"><input type="color" data-nohex value="'+hex+'" aria-label="Pick a colour">'+
      '<span class="fill" style="background:'+hex+'"></span></label>'+
      '<input class="ap-hex" spellcheck="false" autocomplete="off" value="'+hex+'" aria-label="Hex value">'+
      '<button class="ap-add" type="button">Add</button>';
    document.body.appendChild(pop);
    var r=anchor.getBoundingClientRect();
    var w=pop.offsetWidth||210, h=pop.offsetHeight||40;
    var x=Math.min(Math.max(8,r.left-6),innerWidth-w-8);
    var y=r.bottom+8; if(y+h>innerHeight-8) y=r.top-h-8;
    pop.style.left=x+"px"; pop.style.top=y+"px";
    var wheel=pop.querySelector("input[type=color]");
    var fill=pop.querySelector(".fill");
    var field=pop.querySelector(".ap-hex");
    function norm(v){
      v=String(v).trim().replace(/^#/,"");
      if(/^[0-9a-f]{3}$/i.test(v)) v=v.replace(/./g,function(c){return c+c;});
      return /^[0-9a-f]{6}$/i.test(v) ? "#"+v.toLowerCase() : null;
    }
    function show(v){ hex=v; fill.style.background=v; }
    wheel.addEventListener("input",function(){ show(wheel.value); field.value=wheel.value; field.classList.remove("bad"); });
    field.addEventListener("input",function(){
      var v=norm(field.value);
      field.classList.toggle("bad",!v);
      if(v){ show(v); wheel.value=v; }
    });
    function add(){ var v=norm(field.value); if(!v){field.classList.add("bad");field.focus();return;} closePop(); commit(v); }
    pop.querySelector(".ap-add").addEventListener("click",add);
    field.addEventListener("keydown",function(e){
      if(e.key==="Enter"){ e.preventDefault(); add(); }
      if(e.key==="Escape"){ closePop(); }
    });
    setTimeout(function(){ field.focus(); field.select(); },0);
  };
  function freshHue(){
    var h=Math.floor(Math.random()*360), s=62, l=56, a=s/100*Math.min(l/100,1-l/100);
    function f(n){ var k=(n+h/30)%12, c=l/100-a*Math.max(-1,Math.min(k-3,9-k,1));
      return Math.round(c*255).toString(16).padStart(2,"0"); }
    return "#"+f(0)+f(8)+f(4);
  }
  document.addEventListener("mousedown",function(e){
    if(pop && !pop.contains(e.target) && !e.target.closest(".sw-add")) closePop();
  },true);

  /* ---- disclosures ----------------------------------------------------- */
  var exp=$("#exportTog"), expBody=$("#exportBody");
  function place(body,btn){
    if(!body||!btn||body.hidden) return;
    body.classList.add("pop");
    var w=body.offsetWidth||232, h=body.offsetHeight||160;
    var r=btn.getBoundingClientRect();
    var x=r.right-w, y=r.bottom+10;
    if(y+h>innerHeight-16) y=r.top-h-10;
    y=Math.max(16,Math.min(y,innerHeight-h-16));
    x=Math.max(16,Math.min(x,innerWidth-w-16));
    body.style.left=Math.round(x)+"px";
    body.style.top=Math.round(y)+"px";
  }
  function closeExport(){
    if(!expBody||expBody.hidden) return;
    expBody.hidden=true;
    expBody.classList.remove("pop");
    exp.setAttribute("aria-pressed","false");
    exp.classList.remove("on");
  }
  if(exp) exp.addEventListener("click",function(){
    var open=expBody.hidden;
    if(!open){ closeExport(); return; }
    expBody.hidden=false;
    exp.setAttribute("aria-pressed","true");
    exp.classList.add("on");
    syncSliders();
    place(expBody,exp);
  });
  document.addEventListener("mousedown",function(e){
    if(expBody && !expBody.hidden && !expBody.contains(e.target) && e.target!==exp
       && !e.target.closest("#exportTog")) closeExport();
  },true);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeExport(); });

  var mot=$("#motionTog");
  if(mot) mot.addEventListener("click",function(){
    var on=mot.getAttribute("aria-pressed")==="true";
    mot.classList.toggle("on",on);
    if(on) syncSliders();
  });
  addEventListener("resize",function(){ place(expBody,exp); });

  requestAnimationFrame(function(){requestAnimationFrame(record);});
})();
</script>
</body>
</html>
