<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riso — torn paper collage</title>
<meta name="description" content="Generate torn-paper riso collages — stacked bands of ragged two-colour patterns, wandering scribbles, big dots and grain. Exports SVG, PNG and video.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=DM+Mono&display=swap">
<style>
:root{
  --bg:#ffffff;              /* frame ground */
  --field:#f4f4f6;           /* slider base, thumbnails, ratio tiles, buttons */
  --edge:rgba(0,0,0,.09);
  --edge-on:rgba(0,0,0,.30);
  --gloss:none;              /* flat: no bevel */
  --raise:#e9e9ee;           /* slider fill and pressed states — flat, one step darker */
  --raise-hi:#e1e1e7;
  --handle:#7c818a;
  --label:#6f747a;
  --text:#111114;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
  --accent:#ffffff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:12px;letter-spacing:-.24px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:1px solid rgba(0,0,0,.55);outline-offset:2px}

.app{height:100dvh;display:grid;grid-template-columns:325px minmax(0,1fr)}

/* ---------------- panel ---------------- */
.panel{border-right:1px solid var(--edge);display:flex;flex-direction:column;
  min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:#d8d8dd transparent}
.panel::-webkit-scrollbar{width:10px}
.panel::-webkit-scrollbar-thumb{background:#d8d8dd;border:3px solid var(--bg);border-radius:9px}
.phead{flex:none;display:flex;align-items:flex-start;gap:15px;padding:12px 0 0 12px;height:52px}
.backbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:89px;height:40px;border-radius:var(--r);border:1px solid transparent;
  background:var(--field);color:var(--text);
  text-decoration:none;font-size:12px;line-height:12px;transition:background .13s}
.backbtn:hover{background:var(--raise-hi)}
.backbtn svg{width:12px;height:12px;flex:none}
.brand{display:block;width:94px;color:var(--text);flex:none;margin-top:7px}
.brand svg{width:100%;height:auto;display:block}
.pbody{padding:34px 24px 40px}

/* section label */
.sec-h{font-size:12px;line-height:12px;letter-spacing:-.24px;color:var(--label);
  margin:0 0 11px;font-weight:400}
.divider{height:1px;background:var(--edge);margin:24px 0 25px}

/* ---------------- rows / sliders ---------------- */
.row{position:relative;display:flex;align-items:center;justify-content:space-between;
  height:40px;padding:0 12px;background:var(--field);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden}
.row:last-child{margin-bottom:0}
.row>*{position:relative;z-index:1}
.lab{font-size:12px;letter-spacing:-.24px;color:var(--text);white-space:nowrap}
.val{font-size:12px;letter-spacing:-.48px;color:var(--text);text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}

.row.is-slider{cursor:ew-resize}
.row.is-slider::before{content:"";position:absolute;top:0;bottom:0;left:0;z-index:0;
  width:calc(var(--p,0) * 1%);background:var(--raise);border-radius:var(--r)}
/* handle rides inside the fill, 12px in from its edge, and passes behind
   the label and value (which sit at z-index 1) */
.row.is-slider::after{content:"";position:absolute;top:50%;z-index:0;
  left:clamp(6px,calc(var(--p,0) * 1% - 12px),calc(100% - 10px));
  width:4px;height:24px;margin-top:-12px;border-radius:40px;background:var(--handle)}
.row.is-slider input[type=range]{position:absolute;inset:0;z-index:2;width:100%;height:100%;
  margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none;background:none}
.row.is-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:100%}
.row.is-slider:has(input:disabled){opacity:.45;cursor:default}

/* ---------------- variation ---------------- */
.varhead{display:flex;align-items:center;justify-content:space-between;height:12px;margin-bottom:11px}
.seedwrap{display:flex;align-items:center;gap:7px}
.seed{background:none;border:none;padding:0;width:56px;height:12px;text-align:right;
  font-size:12px;line-height:12px;letter-spacing:-.24px;color:var(--text);
  font-variant-numeric:tabular-nums}
.seed:focus{outline:none;color:#fff;text-decoration:underline}
.copy{width:12px;height:12px;color:var(--text);opacity:.85;display:block;flex:none;line-height:0}
.copy:hover{opacity:1}
.copy.done{opacity:1;color:#1a7f37}
.copy svg{width:12px;height:12px;display:block}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;
  border-radius:var(--r);border:1px solid transparent;background:var(--field);
  color:var(--text);font-size:12px;line-height:12px;
  letter-spacing:-.24px;transition:background .13s}
.btn:hover{background:var(--raise-hi)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}
.btn.on{background:var(--raise-hi)}

.history{display:flex;gap:9px;margin-top:10px}
.hbtn{width:32px;height:32px;flex:none;border-radius:var(--r);border:1px solid transparent;
  background:var(--field);display:grid;place-items:center;
  color:var(--text);transition:background .13s}
.hbtn:hover{background:var(--raise-hi)}
.hbtn[disabled]{opacity:.35;pointer-events:none}
.hbtn svg{width:12px;height:12px;display:block}
.hbtn.fwd svg{transform:rotate(180deg)}
.thumb{width:32px;height:32px;flex:none;border-radius:var(--r);border:1px solid transparent;
  background:var(--field);overflow:hidden;padding:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.5;transition:opacity .13s}
.thumb[aria-current=true] img,.thumb:hover img{opacity:1}

/* ---------------- aspect ratio ---------------- */
.ratios{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ratio{height:63px;border-radius:var(--r);border:1px solid transparent;background:var(--field);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:7px 0 0;gap:4px;transition:background .13s,border-color .13s}
.ratio:hover{background:var(--raise-hi)}
.ratio .box{border:1px solid transparent;border-radius:2px;background:rgba(0,0,0,.18);flex:none}
.ratio .t{font-size:8px;line-height:10px;letter-spacing:-.32px;color:var(--text);text-align:center}
.ratio[aria-pressed=true]{background:var(--raise-hi)}
.ratio[aria-pressed=true] .box{background:rgba(0,0,0,.62)}

/* ---------------- colours ---------------- */
.sw-grid{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:8px;
  min-height:40px;padding:7px 8px;background:var(--field);border-radius:var(--r)}
.sw{position:relative;width:24px;height:24px;flex:none;border-radius:50%;overflow:hidden;
  padding:0;display:block;transition:transform .13s}
.sw:hover{transform:scale(1.08)}
.sw input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
  border:none;padding:0;background:none;cursor:pointer;opacity:0}
.sw .fill{position:absolute;inset:0}
.sw .x{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;line-height:1;
  background:rgba(0,0,0,.6);color:#fff;opacity:0;transition:.12s}
.sw:hover .x{opacity:1}
.sw.locked .x{display:none}
.sw-add{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:#fff;border:1px solid transparent;
  color:var(--text);font-size:13px;line-height:1;transition:background .13s}
.sw-add:hover{background:var(--raise-hi)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

/* movement options — the design doesn't show this state, so they follow the
   same raised-when-active language as the buttons */
.chips{display:flex;gap:6px;align-items:center}
.chip{padding:6px 10px;border-radius:6px;border:1px solid transparent;font-size:12px;
  letter-spacing:-.24px;color:var(--label);background:none;white-space:nowrap;transition:.13s}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{background:var(--raise-hi);color:var(--text)}

/* add-colour popover: pick before committing, never a random ink */
.addpop{position:fixed;z-index:80;display:flex;align-items:center;gap:8px;
  background:var(--field);border-radius:10px;padding:8px}
.addpop .ap-sw{position:relative;width:28px;height:28px;flex:none;border-radius:50%;
  overflow:hidden;display:block;cursor:pointer}
.addpop .ap-sw input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
  border:none;padding:0;background:none;opacity:0;cursor:pointer}
.addpop .ap-sw .fill{position:absolute;inset:0}
.addpop .ap-hex{width:104px;height:28px;background:#fff;border:1px solid transparent;
  border-radius:7px;padding:0 9px;font-size:12px;letter-spacing:-.24px;color:var(--text);
  font-family:var(--mono);text-transform:lowercase}
.addpop .ap-hex:focus{outline:none}
.addpop .ap-hex.bad{background:#fbeced;color:#c8484d}
.addpop .ap-add{height:28px;padding:0 14px;border-radius:7px;border:1px solid transparent;
  background:var(--raise-hi);color:var(--text);font-size:12px;
  letter-spacing:-.24px}
.addpop .ap-add:hover{background:#d7d7de}

/* ---------------- collapsible groups ---------------- */
.group{margin-top:12px}
.group[hidden]{display:none}
.note{font-size:11px;line-height:1.55;color:var(--label);margin:10px 0 0}

/* ---------------- canvas ---------------- */
.stage{position:relative;min-width:0;min-height:0;display:grid;
  grid-template-rows:auto minmax(0,1fr);background:var(--bg)}
.toolname{font-family:var(--mono);font-size:14px;line-height:12px;letter-spacing:-.28px;
  color:var(--text);text-align:center;padding:34px 0 0}
.stage-inner{min-height:0;display:flex;align-items:center;justify-content:center;
  padding:74px 40px 128px;overflow:hidden}
#art{max-width:100%;max-height:100%;min-width:0;min-height:0;object-fit:contain;
  background:var(--field);cursor:pointer;display:block}
.transport{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);
  width:min(626px,calc(100% - 80px));height:51px;border-radius:100px;
  background:var(--field);
  display:flex;align-items:center;gap:14px;padding:0 20px;color:var(--label);font-size:12px}
.transport b{color:var(--text);font-weight:400;font-variant-numeric:tabular-nums}
.transport>span{white-space:nowrap}
.play{width:28px;height:28px;flex:none;border-radius:50%;border:1px solid transparent;
  background:var(--raise-hi);display:grid;place-items:center;transition:background .13s}
.play:hover{background:#d7d7de}
.play svg{fill:var(--text)}
#scrub{flex:1;min-width:80px;-webkit-appearance:none;appearance:none;height:20px;
  background:none;margin:0}
#scrub::-webkit-slider-runnable-track{height:4px;background:var(--raise);border-radius:4px}
#scrub::-moz-range-track{height:4px;background:var(--raise);border-radius:4px}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--handle);margin-top:-4px}
#scrub::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--handle)}
#scrub:disabled{opacity:.4;pointer-events:none}
.frameno{font-variant-numeric:tabular-nums;min-width:52px;text-align:right;white-space:nowrap}
.hint{color:var(--label);white-space:nowrap}
@media (max-width:1200px){.hint{display:none}}
.build{color:var(--label)}

/* export menu */
.expwrap{position:relative;margin-top:12px}
.expmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.expmenu[hidden]{display:none}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);
  background:var(--raise-hi);
  border-radius:100px;padding:13px 22px;font-size:12px;color:var(--text);opacity:0;
  pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.busy::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--text);margin-right:9px;vertical-align:middle;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

#strip,#glyph{display:none}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto auto}
  .panel{order:2;border-right:none;border-top:1px solid var(--edge);overflow:visible}
  .stage{order:1;height:52dvh;position:sticky;top:0;z-index:20}
  .stage-inner{padding:20px 20px 88px}
  .transport{bottom:16px;gap:10px;padding:0 14px}
  .transport>span:not(.frameno){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {
"use strict";
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function rng(s){let a=(s>>>0)||1;return()=>{a^=a<<13;a>>>=0;a^=a>>17;a^=a<<5;a>>>=0;return a/4294967296;};}
function hashi(x,y,z,s){
  let n=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1440662683)^Math.imul(s|0,1013904223);
  n=Math.imul(n^(n>>>15),2246822519);n=Math.imul(n^(n>>>13),3266489917);n^=n>>>16;
  return (n>>>0)/4294967296;
}
function hex2rgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function relLum(h){const[r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return .2126*r+.7152*g+.0722*b;}

const RATIOS=[{id:"1:1",w:1,h:1},{id:"4:5",w:4,h:5},{id:"3:4",w:3,h:4},{id:"9:16",w:9,h:16},{id:"5:4",w:5,h:4},{id:"4:3",w:4,h:3},{id:"3:2",w:3,h:2},{id:"16:9",w:16,h:9}];
const MODES=[["tear","Tear"],["scribble","Scribble"],["flicker","Flicker"]];
/* riso ink sets: mids, one hot, one dark, one pale */
const PALETTES=[
  ["#9B7FD4","#F26B1D","#FF4FA0","#556135","#E0402A","#9A97C9"],
  ["#F2A0C8","#2B3AD8","#F5C518","#1E4A2E","#F0480F","#EFE9D4"],
  ["#63D8C2","#E0402A","#F5C518","#2B2B8C","#FF87C3","#E8E4DC"],
  ["#FF9E3D","#1B4FA0","#FF4FA0","#3A4A1E","#8A5CF0","#F2EFE8"],
  ["#C9E265","#8A2BE2","#F0621E","#1E3A5A","#FF3DA6","#F5F0E8"],
  ["#F5C518","#E22BC3","#2AAE9E","#4A2010","#2E7CFF","#EFE9D4"]
];
const INK="#1A1A1A";

const S={
  seed:11, ratio:"1:1",
  bands:3, rough:.5, scrib:.6, dotp:.5, grain:.5,
  pal:PALETTES[0].slice(),
  motion:{on:false,mode:"tear",amount:.8,fps:8,frames:16},
  size:2400
};

function motionState(f){
  const M=S.motion;
  const t=M.on?f/M.frames:0;
  return{t,mode:M.on?M.mode:"",amp:M.amount,f};
}

/* ============================================================
   The collage engine — stacked bands of ragged two-colour
   patterns, cut with jittered polygon edges so every shape
   reads as torn paper. Canvas and SVG walk the same polygons.
============================================================ */
const VB=1000;
function vbH(){const r=RATIOS.find(x=>x.id===S.ratio);return VB*r.h/r.w;}
function buildSpec(){
  const r=rng(S.seed*2654435761>>>0);
  const H=vbH();
  const n=S.bands|0;
  /* band heights: uneven but never slivers */
  const ws=[];let sum=0;
  for(let i=0;i<n;i++){const v=0.6+r()*1.2;ws.push(v);sum+=v;}
  const kinds=["blocks","streaks","static","blocks","streaks"];
  for(let i=kinds.length-1;i>0;i--){const j=(r()*(i+1))|0;const t2=kinds[i];kinds[i]=kinds[j];kinds[j]=t2;}
  const nc=S.pal.length;
  /* pick a second ink that actually reads against the first */
  const against=(base,r2)=>{
    let fg=(r2*nc)|0;
    for(let q=0;q<nc;q++){
      const c2=(fg+q)%nc;
      if(c2!==base&&Math.abs(relLum(S.pal[c2])-relLum(S.pal[base]))>0.09)return c2;
    }
    return (base+1)%nc;
  };
  const bands=[];let y=0;
  for(let i=0;i<n;i++){
    const h=ws[i]/sum*H;
    const bg=(r()*nc)|0;
    const fg=against(bg,r());
    bands.push({y0:y,y1:y+h,kind:kinds[i%kinds.length],bg,fg,v:r(),v2:r(),id:i});
    y+=h;
  }
  const scribs=[];
  const ns=Math.round(S.scrib*3);
  for(let i=0;i<ns;i++){
    const pts=[];
    let px=r()*VB*0.3, py=r()*H*0.5;
    let ang=r()*TAU, sp=VB*0.02+r()*VB*0.02;
    for(let q=0;q<70;q++){
      pts.push([px,py]);
      ang+=(hashi(i,q,3,S.seed)-0.5)*1.4;
      /* the pen loops back if it wanders off the page */
      if(px<0||px>VB)ang=Math.PI-ang;
      if(py<0||py>H)ang=-ang;
      px+=Math.cos(ang)*sp;py+=Math.sin(ang)*sp;
    }
    /* smooth the walk so it reads as a hand line */
    const sm=[pts[0]];
    for(let q=1;q<pts.length-1;q++)
      sm.push([(pts[q-1][0]+pts[q][0]*2+pts[q+1][0])/4,(pts[q-1][1]+pts[q][1]*2+pts[q+1][1])/4]);
    sm.push(pts[pts.length-1]);
    scribs.push(sm);
  }
  let dot=null;
  if(r()<S.dotp){
    const b=bands[(r()*bands.length)|0];
    const rr=Math.min(VB,H)*(0.14+r()*0.10);
    dot={cx:VB*(0.3+r()*0.4),cy:Math.min(b.y1-rr*0.3,Math.max(b.y0+rr*0.3,b.y0+(b.y1-b.y0)*r())),
      rr,ci:against(b.bg,r()),ph:r()};
  }
  return{bands,scribs,dot,H,SW:(r()*1e9)|0};
}
/* a ragged polygon: rectangle edges subdivided and jittered */
function tornPoly(x,y,w,h,rough,k1,k2,SW,mo,mid){
  const pts=[];
  const wob=(q,ed)=>{
    let j=(hashi(k1,q,ed+k2*7,SW)-0.5)*rough;
    if(mo.mode==="tear")
      j+=rough*0.45*Math.min(1.6,mo.amp)*Math.sin(TAU*(mo.t+hashi(k1,q,ed+50,SW)));
    return j;
  };
  const n=5;
  for(let q=0;q<=n;q++)pts.push([x+w*q/n,y+wob(q,1)]);
  for(let q=1;q<=n;q++)pts.push([x+w+wob(q,2),y+h*q/n]);
  for(let q=n-1;q>=0;q--)pts.push([x+w*q/n,y+h+wob(q,3)]);
  for(let q=n-1;q>=1;q--)pts.push([x+wob(q,4),y+h*q/n]);
  return pts;
}
/* everything on the sheet, one frame, as layered polygon lists */
function sceneParts(f){
  const mo=motionState(f);
  const sp=buildSpec();
  const H=sp.H;
  const rough=S.rough;
  const flickState=mo.mode==="flicker"?mo.f%S.motion.frames:0;
  const bandsOut=[];
  for(const b of sp.bands){
    const bh=b.y1-b.y0;
    const shapes=[];
    const rg=VB*0.016*(0.4+rough*1.6);
    if(b.kind==="blocks"){
      const cols=5+((b.v*3)|0);
      const rows=Math.max(1,Math.round(bh/(VB*0.16)));
      const cw2=VB/cols, ch2=bh/rows;
      for(let cy2=0;cy2<rows;cy2++)for(let cx2=0;cx2<cols;cx2++){
        let on=hashi(cx2,cy2,b.id*3+1,sp.SW)<0.58;
        if(mo.mode==="flicker"&&hashi(cx2,cy2,b.id*5+flickState,sp.SW)<0.05)on=!on;
        if(!on)continue;
        const jx=(hashi(cx2,cy2,b.id+11,sp.SW)-0.5)*cw2*0.4;
        const jy=(hashi(cx2,cy2,b.id+12,sp.SW)-0.5)*ch2*0.3;
        const w2=cw2*(0.7+hashi(cx2,cy2,b.id+13,sp.SW)*0.55);
        const h2=ch2*(0.75+hashi(cx2,cy2,b.id+14,sp.SW)*0.5);
        shapes.push(tornPoly(cx2*cw2+jx,b.y0+cy2*ch2+jy,w2,h2,rg,cx2+cy2*31,b.id,sp.SW,mo));
      }
    }else if(b.kind==="streaks"){
      const cols=7+((b.v*3)|0);
      const cw2=VB/cols;
      for(let i=0;i<cols;i++){
        if(hashi(i,0,b.id*7+2,sp.SW)<0.16)continue;
        const seg=6;
        const L=[],R=[];
        for(let q=0;q<=seg;q++){
          const yy=b.y0+bh*q/seg;
          let wb=(hashi(i,q,b.id*7+3,sp.SW)-0.5)*cw2*1.1*(0.4+rough);
          if(mo.mode==="tear")
            wb+=cw2*0.3*Math.min(1.6,mo.amp)*Math.sin(TAU*(mo.t+hashi(i,q,b.id+60,sp.SW)));
          const wd=cw2*(0.34+hashi(i,q,b.id*7+4,sp.SW)*0.5);
          L.push([i*cw2+cw2/2+wb-wd/2,yy]);
          R.push([i*cw2+cw2/2+wb+wd/2,yy]);
        }
        shapes.push(L.concat(R.reverse()));
      }
    }else{ /* static: rows of scratchy dashes */
      const rows=Math.max(3,Math.round(bh/(VB*0.028)));
      const rh=bh/rows;
      for(let ry=0;ry<rows;ry++){
        const nd=2+((hashi(ry,1,b.id*9+1,sp.SW)*6)|0);
        for(let d2=0;d2<nd;d2++){
          if(mo.mode==="flicker"&&hashi(ry,d2*3+flickState,b.id,sp.SW)<0.08)continue;
          const x0=hashi(ry,d2*2,b.id*9+2,sp.SW)*VB;
          const ln=VB*(0.03+hashi(ry,d2*2+1,b.id*9+3,sp.SW)*0.16);
          shapes.push(tornPoly(x0,b.y0+ry*rh+rh*0.2,ln,rh*0.55,rg*0.5,ry*17+d2,b.id,sp.SW,mo));
        }
      }
    }
    bandsOut.push({b,shapes});
  }
  /* the big dot, edge gently torn */
  let dotPoly=null;
  if(sp.dot){
    const d2=sp.dot,pts=[];
    for(let q=0;q<36;q++){
      const a2=q/36*TAU;
      let rr=d2.rr*(1+(hashi(q,1,77,sp.SW)-0.5)*0.05*rough);
      pts.push([d2.cx+Math.cos(a2)*rr,d2.cy+Math.sin(a2)*rr]);
    }
    dotPoly={pts,col:S.pal[d2.ci%S.pal.length]};
  }
  /* scribbles, optionally drawing themselves */
  const scribsOut=sp.scribs.map(sm=>{
    if(mo.mode==="scribble"){
      const k=Math.max(2,Math.ceil(sm.length*((mo.f+1)/S.motion.frames)));
      return sm.slice(0,k);
    }
    return sm;
  });
  /* grain specks over everything */
  const specks=[];
  const ns=Math.round(S.grain*700);
  for(let i=0;i<ns;i++){
    const gk=mo.mode==="flicker"?flickState:0;
    specks.push([hashi(i,1,gk+91,sp.SW)*VB,hashi(i,2,gk+92,sp.SW)*H,
      hashi(i,3,gk+93,sp.SW)<0.55]);
  }
  return{bandsOut,dotPoly,scribsOut,specks,H,sp};
}
function paint(c,W,Hpx,f){
  const P=sceneParts(f);
  const k=W/VB;
  c.setTransform(1,0,0,1,0,0);
  for(const{b,shapes}of P.bandsOut){
    c.save();
    c.beginPath();c.rect(0,b.y0*k-0.5,W,(b.y1-b.y0)*k+1);c.clip();
    c.fillStyle=S.pal[b.bg%S.pal.length];c.fillRect(0,b.y0*k-1,W,(b.y1-b.y0)*k+2);
    c.fillStyle=S.pal[b.fg%S.pal.length];
    for(const pts of shapes){
      c.beginPath();
      pts.forEach((p,i)=>i?c.lineTo(p[0]*k,p[1]*k):c.moveTo(p[0]*k,p[1]*k));
      c.closePath();c.fill();
    }
    c.restore();
  }
  if(P.dotPoly){
    c.beginPath();
    P.dotPoly.pts.forEach((p,i)=>i?c.lineTo(p[0]*k,p[1]*k):c.moveTo(p[0]*k,p[1]*k));
    c.closePath();c.fillStyle=P.dotPoly.col;c.fill();
  }
  c.strokeStyle=INK;c.lineWidth=Math.max(1,VB*0.0035*k);c.lineCap="round";c.lineJoin="round";
  for(const sm of P.scribsOut){
    c.beginPath();
    sm.forEach((p,i)=>i?c.lineTo(p[0]*k,p[1]*k):c.moveTo(p[0]*k,p[1]*k));
    c.stroke();
  }
  const sr=Math.max(1,VB*0.0016*k);
  for(const[x,y,dk]of P.specks){
    c.fillStyle=dk?"rgba(10,10,10,0.5)":"rgba(255,255,255,0.4)";
    c.fillRect(x*k,y*k,sr,sr);
  }
}
/* ---------- SVG: the same parts as strings, per layer ---------- */
function svgLayers(f,uid){
  const P=sceneParts(f);
  const f1=x=>x.toFixed(1);
  const poly=pts=>`<polygon points="${pts.map(p=>f1(p[0])+","+f1(p[1])).join(" ")}"/>`;
  let bands="",defs="";
  P.bandsOut.forEach(({b,shapes},i)=>{
    const cid=`c${uid}_${i}`;
    defs+=`<clipPath id="${cid}"><rect x="0" y="${f1(b.y0-0.5)}" width="${VB}" height="${f1(b.y1-b.y0+1)}"/></clipPath>`;
    bands+=`<g clip-path="url(#${cid})"><rect x="0" y="${f1(b.y0-1)}" width="${VB}" height="${f1(b.y1-b.y0+2)}" fill="${S.pal[b.bg%S.pal.length]}"/>`+
      `<g fill="${S.pal[b.fg%S.pal.length]}">${shapes.map(poly).join("")}</g></g>`;
  });
  const dot=P.dotPoly?`<g fill="${P.dotPoly.col}">${poly(P.dotPoly.pts)}</g>`:"";
  const scrib=P.scribsOut.length
    ?`<g fill="none" stroke="${INK}" stroke-width="${(VB*0.0035).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">`+
      P.scribsOut.map(sm=>`<polyline points="${sm.map(p=>f1(p[0])+","+f1(p[1])).join(" ")}"/>`).join("")+`</g>`:"";
  let g1="",g2="";
  for(const[x,y,dk]of P.specks){
    const r2=`<rect x="${f1(x)}" y="${f1(y)}" width="1.6" height="1.6"/>`;
    if(dk)g1+=r2;else g2+=r2;
  }
  const grain=(g1||g2)?`<g fill="#0A0A0A" opacity="0.5">${g1}</g><g fill="#FFFFFF" opacity="0.4">${g2}</g>`:"";
  return{defs,bands,dot,scrib,grain,H:P.H};
}
function svgWrap(defs,inner){
  const r=RATIOS.find(x=>x.id===S.ratio);
  const W=S.size,H=Math.round(S.size*r.h/r.w);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${VB} ${vbH().toFixed(1)}">`+
    (defs?`<defs>${defs}</defs>`:"")+inner+`</svg>`;
}
function buildSVG(){
  const L=svgLayers(curFrame,0);
  return svgWrap(L.defs,L.bands+L.dot+L.scrib+L.grain);
}
/* the loop stacks only the layers the current movement changes */
function buildLoopSVG(){
  const M=S.motion,F=M.frames,dur=(F/M.fps).toFixed(3);
  const moving=M.mode==="tear"?["bands"]:M.mode==="scribble"?["scrib"]:["bands","grain"];
  const perFrame=[];let defs="";
  for(let f=0;f<F;f++){const L=svgLayers(f,f);perFrame.push(L);if(f===0)defs="";defs+=L.defs;}
  const stack=key=>{
    const segs=[];
    for(let f=0;f<F;f++){
      const s2=perFrame[f][key];
      const cmp=s2.replace(/c\d+_/g,"c_");
      if(segs.length&&segs[segs.length-1].cmp===cmp)segs[segs.length-1].n++;
      else segs.push({cmp,c:s2,f0:f,n:1});
    }
    let out2="";
    segs.forEach((sg,i)=>{
      const t0=(sg.f0/F).toFixed(5),t1=((sg.f0+sg.n)/F).toFixed(5);
      const anim=i===0
        ?`<animate attributeName="visibility" values="visible;hidden" keyTimes="0;${t1}" dur="${dur}s" calcMode="discrete" repeatCount="indefinite"/>`
        :`<animate attributeName="visibility" values="hidden;visible;hidden" keyTimes="0;${t0};${t1}" dur="${dur}s" calcMode="discrete" repeatCount="indefinite"/>`;
      out2+=`<g visibility="${i===0?"visible":"hidden"}">${anim}${sg.c}</g>`;
    });
    return out2;
  };
  const L0=perFrame[0];
  const part=key=>moving.includes(key)?stack(key):L0[key];
  return svgWrap(defs,part("bands")+part("dot")+part("scrib")+part("grain"));
}

const art=$("#art"), ctx=art.getContext("2d",{alpha:false});
function fitCanvas(){
  const r=RATIOS.find(x=>x.id===S.ratio);
  const box=$(".stage-inner");
  let dpr=Math.min(2,window.devicePixelRatio||1);
  let availW=700,availH=700;
  if(box&&box.clientWidth){
    const bs=getComputedStyle(box);
    availW=box.clientWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight);
    availH=box.clientHeight-parseFloat(bs.paddingTop)-parseFloat(bs.paddingBottom);
  }
  availW=Math.max(80,availW);availH=Math.max(80,availH);
  const s=Math.min(availW/r.w,availH/r.h);
  const dispW=Math.max(40,Math.floor(r.w*s)),dispH=Math.max(40,Math.floor(r.h*s));
  const w=Math.round(dispW*dpr),h=Math.round(dispH*dpr);
  if(art.width!==w||art.height!==h){art.width=w;art.height=h;}
  if(art.style.width!==dispW+"px"||art.style.height!==dispH+"px"){
    art.style.width=dispW+"px";art.style.height=dispH+"px";
  }
  return{w,h};
}
let curFrame=0,queued=false;
function draw(){
  const{w,h}=fitCanvas();
  const t0=performance.now();
  paint(ctx,w,h,curFrame);
  const ms=Math.round(performance.now()-t0);
  $("#dims").textContent=w+"×"+h+" · "+ms+"ms";
  const F=S.motion.on?S.motion.frames:1;
  $("#frameno").textContent=String(curFrame+1).padStart(2,"0")+" / "+String(F).padStart(2,"0");
}
function requestDraw(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;draw();});}
const reframe=requestDraw;
if(window.ResizeObserver){
  const box=$(".stage-inner");
  if(box){let p=false;new ResizeObserver(()=>{if(p)return;p=true;requestAnimationFrame(()=>{p=false;draw();});}).observe(box);}
}
let playing=false,t0=0,raf=0;
function tick(now){
  if(!playing)return;
  const M=S.motion,dur=(M.frames/M.fps)*1000;
  const f=Math.floor(((now-t0)%dur)/dur*M.frames)%M.frames;
  if(f!==curFrame){curFrame=f;$("#scrub").value=f;draw();}
  raf=requestAnimationFrame(tick);
}
function setPlaying(v){
  playing=v&&S.motion.on;
  $("#playIcon").innerHTML=playing
    ?'<rect x="0" y="0" width="3.5" height="11"/><rect x="6.5" y="0" width="3.5" height="11"/>'
    :'<path d="M0 0l10 5.5L0 11z"/>';
  cancelAnimationFrame(raf);
  if(playing){t0=performance.now()-(curFrame/S.motion.frames)*(S.motion.frames/S.motion.fps*1000);raf=requestAnimationFrame(tick);}
  else requestDraw();
}

/* ============================================================
   Export
============================================================ */
let toastTimer;
window.__toast=toast;
window.__toast=toast;
window.__toast=toast;
window.__toast=toast;
window.__toast=toast;
window.__toast=toast;
function toast(msg,busy){
  window.__toast=toast;
  const el=$("#toast");el.textContent=msg;el.classList.toggle("busy",!!busy);el.classList.add("show");
  clearTimeout(toastTimer);if(!busy)toastTimer=setTimeout(()=>el.classList.remove("show"),2400);
}
function save(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}
function stamp(){return `riso-${S.seed}-${S.ratio.replace(":","x")}`;}
function updateExportNote(){
  const a=$("#expVid"),sc=$("#scrub"),l=$("#expSvgLoop");
  if(a)a.disabled=!S.motion.on;
  if(l)l.disabled=!S.motion.on;
  if(sc)sc.disabled=!S.motion.on;
}
$("#expPng").addEventListener("click",()=>{
  toast("Rendering…",true);
  setTimeout(()=>{
    const r=RATIOS.find(x=>x.id===S.ratio);
    const W=S.size,H=Math.round(S.size*r.h/r.w);
    const c=document.createElement("canvas");c.width=W;c.height=H;
    paint(c.getContext("2d"),W,H,curFrame);
    c.toBlob(b=>{save(b,stamp()+".png");toast(`PNG saved · ${W}×${H}`);});
  },30);
});
$("#expSvg").addEventListener("click",()=>{
  save(new Blob([buildSVG()],{type:"image/svg+xml"}),stamp()+".svg");
  toast("SVG saved");
});
$("#expSvgLoop").addEventListener("click",()=>{
  if(!S.motion.on)return toast("Turn on motion first");
  toast("Building loop\u2026",true);
  setTimeout(()=>{
    save(new Blob([buildLoopSVG()],{type:"image/svg+xml"}),stamp()+"-loop.svg");
    toast("Animated SVG saved");
  },30);
});
function pickVideoType(){
  const t=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  for(const x of t)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(x))return x;
  return null;
}
$("#expVid").addEventListener("click",()=>{
  if(!S.motion.on)return toast("Turn on motion first");
  const type=pickVideoType();
  if(!type)return toast("This browser can't record video");
  const ext=type.startsWith("video/mp4")?"mp4":"webm";
  const r=RATIOS.find(x=>x.id===S.ratio);
  let W=Math.min(1120,S.size);W-=W%2;
  let H=Math.round(W*r.h/r.w);H-=H%2;
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const cc=c.getContext("2d");
  const F=S.motion.frames,loops=1;
  const rec=new MediaRecorder(c.captureStream(60),{mimeType:type,videoBitsPerSecond:16000000});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{save(new Blob(chunks,{type}),stamp()+"-loop."+ext);toast(ext.toUpperCase()+" saved");};
  const was=playing;setPlaying(false);
  toast("Recording…",true);
  let n=0;
  rec.start();
  (function step(){
    paint(cc,W,H,n%F);
    n++;
    if(n<F*loops) setTimeout(()=>requestAnimationFrame(step), Math.max(0,1000/S.motion.fps-4));
    else setTimeout(()=>{rec.stop();if(was)setPlaying(true);},200);
  })();
});

/* ============================================================
   UI
============================================================ */
function accent(){
  let best=S.pal[1],bl=-1;
  for(const c of S.pal){const l=relLum(c);if(l>bl&&l>0.1&&l<0.85){bl=l;best=c;}}
  /* UI accent stays constant — the artwork supplies the colour */
  $("#strip").innerHTML=S.pal.map(c=>`<span style="background:${c}"></span>`).join("");
  const g=$("#glyph");
  if(g.children.length!==9)g.innerHTML=Array.from({length:9},()=>"<i></i>").join("");
  [...g.children].forEach((el,i)=>el.classList.toggle("on",[1,3,4,5,7].includes(i)));
}
function segmented(host,items,get,set){
  if(!host)return;
  host.innerHTML="";
  items.forEach(([id,label])=>{
    const b=document.createElement("button");
    b.className="chip";b.type="button";b.textContent=label;
    b.setAttribute("aria-pressed",String(get()===id));
    b.onclick=()=>{set(id);[...host.children].forEach(c=>c.setAttribute("aria-pressed",String(c===b)));};
    host.appendChild(b);
  });
}
function buildRatios(){
  const host=$("#ratios");if(!host)return;
  host.innerHTML="";
  RATIOS.forEach(r=>{
    const b=document.createElement("button");
    b.className="ratio";b.type="button";
    b.setAttribute("aria-pressed",String(S.ratio===r.id));
    const sc=Math.min(48/r.w,33/r.h);
    b.innerHTML=`<span class="box" style="width:${(r.w*sc).toFixed(1)}px;height:${(r.h*sc).toFixed(1)}px"></span><span class="t">${r.id}</span>`;
    b.onclick=()=>{S.ratio=r.id;$("#ratioVal").textContent=r.id;
      [...host.children].forEach(c=>c.setAttribute("aria-pressed",String(c===b)));reframe();};
    host.appendChild(b);
  });
}
const ROLES=["Ink 1","Ink 2","Ink 3","Ink 4","Ink 5","Ink 6"];
function buildSwatches(){
  const host=$("#swatches");
  host.innerHTML="";
  const lock=S.pal.length<=2;
  S.pal.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="sw"+(lock?" locked":"");b.type="button";
    b.setAttribute("aria-label","Ink "+(i+1)+" colour");
    b.innerHTML=`<span class="fill" style="background:${c}"></span>`+
      `<input type="color" value="${c}"><span class="x" aria-hidden="true">×</span>`;
    b.querySelector("input").addEventListener("input",e=>{
      S.pal[i]=e.target.value;
      b.querySelector(".fill").style.background=e.target.value;
      accent();reframe();
    });
    b.addEventListener("click",e=>{
      if(e.target.classList.contains("x")&&S.pal.length>2){
        e.preventDefault();e.stopPropagation();
        S.pal.splice(i,1);buildSwatches();accent();reframe();
      }
    },true);
    host.appendChild(b);
  });
  const add=document.createElement("button");
  add.className="sw-add";add.type="button";add.textContent="+";
  add.setAttribute("aria-label","Add colour");
  add.addEventListener("click",()=>{
    const commit=hex=>{S.pal.push(hex);buildSwatches();accent();reframe();};
    if(window.__pickColour) window.__pickColour(add,commit);
    else commit(hsl2hex(Math.random()*360,45+Math.random()*45,42+Math.random()*30));
  });
  host.appendChild(add);
}
function setPalette(p){S.pal=p.slice();buildSwatches();accent();reframe();}
function bindRange(id,fmt,set,after){
  const el=$("#"+id),label=$("#"+id+"Val");
  if(!el)return;
  el.addEventListener("input",()=>{
    const v=parseFloat(el.value);set(v);
    if(label)label.textContent=fmt(v);
    (after||reframe)();
  });
}
const pct=v=>Math.round(v*100)+"%";

buildRatios();buildSwatches();accent();
segmented($("#modes"),MODES,()=>S.motion.mode,v=>{S.motion.mode=v;reframe();});
function hsl2hex(h,sa,l){
  h=((h%360)+360)%360;sa/=100;l/=100;
  const a=sa*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));
    return Math.round(c*255).toString(16).padStart(2,"0");};
  return "#"+f(0)+f(8)+f(4);
}
/* New set mixes fresh riso ink sets with the curated list */
function newPalette(){
  const R=Math.random;
  if(R()<0.25)return PALETTES[(R()*PALETTES.length)|0].slice();
  const h=R()*360;
  return[
    hsl2hex(h,45+R()*25,60+R()*10),
    hsl2hex(h+120+R()*60,70+R()*25,52+R()*10),
    hsl2hex(h+200+R()*60,80+R()*20,58+R()*8),
    hsl2hex(h+60+R()*40,30+R()*20,24+R()*10),
    hsl2hex(h+300+R()*40,75+R()*25,50+R()*10),
    hsl2hex(h+30,20+R()*20,84+R()*8)
  ];
}
$("#shufColors").addEventListener("click",()=>{
  let p;do{p=newPalette();}while(p[0]===S.pal[0]&&p[1]===S.pal[1]);
  const n=S.pal.length;
  while(p.length<n) p.push(hsl2hex(Math.random()*360,45+Math.random()*45,42+Math.random()*30));
  setPalette(p.slice(0,n));
});
$("#rotColors").addEventListener("click",()=>{
  setPalette(S.pal.slice(1).concat([S.pal[0]]));
});
bindRange("bands",v=>v,v=>S.bands=v|0);
bindRange("rough",pct,v=>S.rough=v);
bindRange("scrib",pct,v=>S.scrib=v);
bindRange("dotp",pct,v=>S.dotp=v);
bindRange("grain",pct,v=>S.grain=v);
bindRange("amt",v=>v.toFixed(2),v=>S.motion.amount=v);
$("#fps").addEventListener("input",e=>{S.motion.fps=parseInt(e.target.value,10);
  $("#fpsVal").textContent=S.motion.fps+" fps";if(playing)setPlaying(true);});
$("#frames").addEventListener("input",e=>{S.motion.frames=parseInt(e.target.value,10);
  $("#framesVal").textContent=S.motion.frames+" frames";$("#scrub").max=S.motion.frames-1;
  curFrame=Math.min(curFrame,S.motion.frames-1);reframe();if(playing)setPlaying(true);});
$("#size").addEventListener("input",e=>{S.size=parseInt(e.target.value,10);$("#sizeVal").textContent=S.size+" px";});
$("#motionTog").addEventListener("click",e=>{
  S.motion.on=!S.motion.on;
  e.currentTarget.setAttribute("aria-pressed",String(S.motion.on));
  $("#motionBody").hidden=!S.motion.on;
  curFrame=0;$("#scrub").value=0;
  reframe();updateExportNote();
  setPlaying(S.motion.on&&!reduceMotion);
});
$("#play").addEventListener("click",()=>{if(!S.motion.on){$("#motionTog").click();return;}setPlaying(!playing);});
$("#scrub").addEventListener("input",e=>{setPlaying(false);curFrame=parseInt(e.target.value,10)%Math.max(1,S.motion.frames);draw();});
/* the seed deals the whole collage inside the engine; here it deals
   the layout numbers */
function applySeed(){
  const r=rng((S.seed^0x9e3779b9)>>>0);
  const pick=a=>a[(r()*a.length)|0];
  S.bands=pick([2,3,3,3,4,5]);
  S.rough=pick([0.35,0.5,0.5,0.65,0.8]);
  S.scrib=pick([0.3,0.6,0.6,0.9]);
}
function syncControls(){
  const set=(id,v,txt)=>{const el=$("#"+id);if(el)el.value=v;const l=$("#"+id+"Val");if(l)l.textContent=txt;};
  set("bands",S.bands,S.bands);
  set("rough",S.rough,pct(S.rough));
  set("scrib",S.scrib,pct(S.scrib));
}
function newSeed(v){S.seed=(v!==undefined)?v:(Math.random()*99999|0)+1;$("#seed").value=S.seed;applySeed();syncControls();reframe();}
$("#shuf").addEventListener("click",()=>newSeed());
$("#seed").addEventListener("change",e=>{const v=parseInt(e.target.value,10);newSeed(Number.isFinite(v)?Math.abs(v):1);});
art.addEventListener("click",()=>newSeed());
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.code==="Space"){e.preventDefault();newSeed();}
  if(e.key==="p"||e.key==="P"){if(S.motion.on)setPlaying(!playing);}
});
newSeed(11);
$("#scrub").max=S.motion.frames-1;
updateExportNote();
draw();
})();
</script>
<!-- Embed mode: open with ?embed to render just the artwork full-viewport
     (used by the landing page to show live output as its background). -->
<style>
html.embed .topbar,html.embed .panel,html.embed .transport,html.embed .toast{display:none!important}
html.embed .app{height:100dvh!important;grid-template-rows:1fr!important}
html.embed .main{display:grid!important;grid-template-columns:1fr!important}
html.embed .stage{height:auto!important;position:static!important;grid-template-rows:1fr!important;background:none!important;order:0!important}
html.embed .stage-inner{padding:0!important}
html.embed #art{width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;object-fit:cover!important;border-radius:0!important;box-shadow:none!important;cursor:default!important}
html.embed body{overflow:hidden!important}
</style>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  /* embed mode: explicit flag, or being shown inside another page (the
     landing background) — servers with clean URLs drop query strings */
  var embedded=q.has("embed")||location.hash.indexOf("embed")>-1;
  try{embedded=embedded||window.self!==window.top;}catch(e){embedded=true;}
  if(!embedded) return;
  document.documentElement.classList.add("embed");
  /* pick the preset ratio closest to the viewport so the cover-crop stays small */
  var R=[[9,16],[3,4],[4,5],[1,1],[5,4],[4,3],[3,2],[16,9]];
  var vr=innerWidth/Math.max(1,innerHeight),best=3,bd=1e9;
  for(var i=0;i<R.length;i++){var d=Math.abs(Math.log(vr*R[i][1]/R[i][0]));if(d<bd){bd=d;best=i}}
  var rb=document.querySelectorAll("#ratios .ratio")[best]; if(rb) rb.click();
  /* fresh artwork per load, or a pinned one via ?seed=N */
  var seed=q.get("seed"), si=document.getElementById("seed");
  if(seed&&si){si.value=seed;si.dispatchEvent(new Event("change"));}
  else{var sh=document.getElementById("shuf"); if(sh) sh.click();}
  /* start the tool's own motion; static tools re-roll on a slow cadence instead */
  var mt=document.getElementById("motionTog");
  if(mt){if(mt.getAttribute("aria-pressed")!=="true") mt.click();}
  else setInterval(function(){var sh=document.getElementById("shuf");if(sh)sh.click();},7000);
  /* tell an embedding page the first frame has painted */
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    try{if(parent!==window)parent.postMessage({type:"tool-embed-ready"},"*");}catch(e){}
  });});
})();
</script>
<!-- Hex entry for colour swatches: tap a swatch, type a hex code.
     One shared layer for every colour input on the page. -->
<style>
.hexpop{position:fixed;z-index:70;display:flex;gap:6px;align-items:center;
  background:var(--panel-2,#15151a);border:1px solid var(--line,#22222a);border-radius:6px;
  padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.hexpop .hexfield{font-family:var(--mono,ui-monospace,monospace);font-size:12px;letter-spacing:.06em;
  width:96px;background:var(--panel,#101013);color:var(--text,#EFEDE8);
  border:1px solid var(--line,#22222a);border-radius:4px;padding:7px 8px;text-transform:lowercase}
.hexpop .hexfield:focus{outline:none;border-color:var(--accent,#F0621E)}
.hexpop .hexfield.bad{border-color:#c8484d}
.hexpop .hexwheel{font-family:var(--mono,ui-monospace,monospace);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted,#7c7c88);background:none;border:1px solid var(--line,#22222a);
  border-radius:4px;padding:7px 9px;cursor:pointer}
.hexpop .hexwheel:hover{color:var(--text,#EFEDE8)}
</style>
<script>
(function(){
  "use strict";
  var pop=null,bypass=false;
  function close(){if(pop){pop.remove();pop=null;}}
  function openFor(inp){
    close();
    pop=document.createElement("div");
    pop.className="hexpop";
    pop.innerHTML='<input class="hexfield" spellcheck="false" autocomplete="off" inputmode="text" value="'+inp.value+'">'+
      '<button class="hexwheel" type="button">Wheel</button>';
    document.body.appendChild(pop);
    var anchor=(inp.closest&&(inp.closest(".sw")||inp.closest("label")))||inp;
    var r=anchor.getBoundingClientRect();
    var w=pop.offsetWidth||170,h=pop.offsetHeight||38;
    var x=Math.min(Math.max(8,r.left),innerWidth-w-8);
    var y=r.bottom+6; if(y+h>innerHeight-8)y=r.top-h-6;
    pop.style.left=x+"px";pop.style.top=y+"px";
    var f=pop.querySelector(".hexfield");
    function norm(){
      var v=f.value.trim().replace(/^#/,"");
      if(/^[0-9a-fA-F]{3}$/.test(v))v=v.replace(/./g,function(c){return c+c;});
      return /^[0-9a-fA-F]{6}$/.test(v)?"#"+v.toLowerCase():null;
    }
    function apply(){
      var hex=norm();
      f.classList.toggle("bad",!hex);
      if(!hex)return false;
      inp.value=hex;
      inp.dispatchEvent(new Event("input",{bubbles:true}));
      inp.dispatchEvent(new Event("change",{bubbles:true}));
      return true;
    }
    f.addEventListener("input",apply);
    f.addEventListener("keydown",function(e){
      if(e.key==="Enter"){e.preventDefault();if(apply())close();}
      if(e.key==="Escape")close();
    });
    pop.querySelector(".hexwheel").addEventListener("click",function(){
      close();bypass=true;inp.click();bypass=false;
    });
    f.focus();f.select();
  }
  document.addEventListener("click",function(e){
    if(pop&&pop.contains(e.target))return;
    var t=e.target;
    var inp=t&&t.matches&&t.matches('input[type=color]')&&!t.hasAttribute('data-nohex')?t:null;
    if(inp&&!bypass){
      e.preventDefault();e.stopPropagation();
      openFor(inp);
      return;
    }
    if(pop)close();
  },true);
})();
</script>










<!-- Figma chassis runtime: pill-slider fills, the variation history strip, and the
     Animate / Export disclosures. Everything else is the tool's own code. -->
<style>
/* the tool's own hex popover, restyled flat/light — it ships after the chassis
   sheet, so the override has to come after it too */
.hexpop{background:var(--field);border:1px solid transparent;border-radius:10px;box-shadow:none}
.hexpop .hexfield{background:#fff;color:var(--text);border:1px solid transparent;border-radius:7px;
  letter-spacing:-.24px;font-size:12px}
.hexpop .hexfield:focus{border-color:transparent}
.hexpop .hexfield.bad{border-color:transparent;background:#fbeced;color:#c8484d}
.hexpop .hexwheel{background:var(--raise-hi);color:var(--text);border:1px solid transparent;
  border-radius:7px;letter-spacing:-.24px;font-size:11px;text-transform:none}
.hexpop .hexwheel:hover{background:#d7d7de;color:var(--text)}
</style>
<script>
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s);};

  /* ---- slider fills ---------------------------------------------------- */
  function pct(el){
    var min=parseFloat(el.min); if(!isFinite(min)) min=0;
    var max=parseFloat(el.max); if(!isFinite(max)) max=100;
    var v=parseFloat(el.value);
    if(!isFinite(v)||max<=min) return 0;
    return Math.max(0,Math.min(100,(v-min)/(max-min)*100));
  }
  function paintRow(el){
    var row=el.closest(".row");
    if(row) row.style.setProperty("--p", pct(el).toFixed(3));
  }
  function sliders(){ return document.querySelectorAll(".panel .row input[type=range]"); }
  function syncSliders(){
    sliders().forEach(function(el){
      var row=el.closest(".row");
      if(row && !row.classList.contains("is-slider")) row.classList.add("is-slider");
      if(!el.__fig){ el.__fig=1; el.addEventListener("input",function(){paintRow(el);}); }
      paintRow(el);
    });
  }
  syncSliders();
  var panel=$(".panel");
  if(panel && window.MutationObserver){
    new MutationObserver(syncSliders).observe(panel,
      {childList:true,subtree:true,characterData:true});
  }

  /* ---- variation history ---------------------------------------------- */
  var art=$("#art"), seedIn=$("#seed"), strip=$("#history");
  var hist=[], at=-1, SLOTS=5, CAP=60;
  var ICO_L='<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.5 2.5L4 6l3.5 3.5\"/></svg>';

  function snap(){
    if(!art||!art.width) return "";
    var c=document.createElement("canvas");
    c.width=c.height=64;
    var x=c.getContext("2d");
    var s=Math.min(art.width,art.height);
    x.drawImage(art,(art.width-s)/2,(art.height-s)/2,s,s,0,0,64,64);
    try{ return c.toDataURL("image/png"); }catch(e){ return ""; }
  }
  function record(){
    var seed=seedIn?seedIn.value:"";
    var shot=snap();
    if(at>=0 && hist[at] && hist[at].seed===seed){ hist[at].img=shot; }
    else{
      hist=hist.slice(0,at+1);
      hist.push({seed:seed,img:shot});
      if(hist.length>CAP) hist.shift();
      at=hist.length-1;
    }
    drawStrip();
  }
  function go(i){
    if(i<0||i>=hist.length) return;
    at=i;
    if(seedIn){
      seedIn.value=hist[i].seed;
      seedIn.dispatchEvent(new Event("change",{bubbles:true}));
    }
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      if(hist[at]) hist[at].img=snap();
      drawStrip();
    });});
  }
  function drawStrip(){
    if(!strip) return;
    var end=Math.max(SLOTS-1,at), start=end-SLOTS+1;
    var cells="";
    for(var k=0;k<SLOTS;k++){
      var i=start+k, h=hist[i];
      cells += h
        ? '<button class="thumb" data-i="'+i+'" aria-current="'+(i===at)+'" '+
          'aria-label="Variation '+h.seed+'">'+(h.img?'<img src="'+h.img+'" alt="">':'')+'</button>'
        : '<span class="thumb" aria-hidden="true"></span>';
    }
    strip.innerHTML =
      '<button class="hbtn back" id="hBack" aria-label="Previous variation">'+ICO_L+'</button>'+
      cells+
      '<button class="hbtn fwd" id="hFwd" aria-label="Next variation">'+ICO_L+'</button>';
    var b=$("#hBack"), f=$("#hFwd");
    if(b){ b.disabled = at<=0; b.onclick=function(){go(at-1);}; }
    if(f){ f.disabled = at>=hist.length-1; f.onclick=function(){go(at+1);}; }
    strip.querySelectorAll(".thumb[data-i]").forEach(function(t){
      t.onclick=function(){go(+t.dataset.i);};
    });
  }

  var shuf=$("#shuf"), rnd=$("#randomize");
  if(rnd){
    rnd.addEventListener("click",function(){
      if(shuf) shuf.click();
      requestAnimationFrame(function(){requestAnimationFrame(record);});
    });
  }
  /* the tool re-rolls on Space and on canvas click too */
  ["keydown","click"].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(ev==="keydown" && e.code!=="Space") return;
      if(ev==="keydown" && e.target.matches("input,textarea")) return;
      if(ev==="click" && e.target!==art) return;
      requestAnimationFrame(function(){requestAnimationFrame(record);});
    });
  });
  if(seedIn) seedIn.addEventListener("change",function(){
    requestAnimationFrame(function(){requestAnimationFrame(record);});
  });

  var copy=$("#copySeed");
  function confirmCopy(v){
    if(window.__toast) window.__toast("Variation "+v+" copied");
    if(!copy) return;
    copy.classList.add("done");
    clearTimeout(copy.__t);
    copy.__t=setTimeout(function(){copy.classList.remove("done");},1400);
  }
  if(copy) copy.addEventListener("click",function(){
    var v=String(seedIn.value);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(function(){confirmCopy(v);},function(){legacy(v);});
    } else legacy(v);
  });
  function legacy(v){
    try{
      var t=document.createElement("textarea");
      t.value=v; t.style.cssText="position:fixed;opacity:0;pointer-events:none";
      document.body.appendChild(t); t.select();
      var ok=document.execCommand("copy");
      t.remove();
      ok ? confirmCopy(v) : window.__toast && window.__toast("Press Ctrl+C to copy "+v);
    }catch(e){ if(window.__toast) window.__toast("Press Ctrl+C to copy "+v); }
  }

  /* ---- add-colour popover -------------------------------------------- */
  var pop=null;
  function closePop(){ if(pop){ pop.remove(); pop=null; } }
  window.__pickColour=function(anchor,commit){
    closePop();
    var hex=freshHue();
    pop=document.createElement("div");
    pop.className="addpop";
    pop.innerHTML=
      '<label class="ap-sw"><input type="color" data-nohex value="'+hex+'" aria-label="Pick a colour">'+
      '<span class="fill" style="background:'+hex+'"></span></label>'+
      '<input class="ap-hex" spellcheck="false" autocomplete="off" value="'+hex+'" aria-label="Hex value">'+
      '<button class="ap-add" type="button">Add</button>';
    document.body.appendChild(pop);

    var r=anchor.getBoundingClientRect();
    var w=pop.offsetWidth||230, h=pop.offsetHeight||44;
    var x=Math.min(Math.max(8,r.left-6),innerWidth-w-8);
    var y=r.bottom+8; if(y+h>innerHeight-8) y=r.top-h-8;
    pop.style.left=x+"px"; pop.style.top=y+"px";

    var wheel=pop.querySelector("input[type=color]");
    var fill=pop.querySelector(".fill");
    var field=pop.querySelector(".ap-hex");
    function norm(v){
      v=String(v).trim().replace(/^#/,"");
      if(/^[0-9a-f]{3}$/i.test(v)) v=v.replace(/./g,function(c){return c+c;});
      return /^[0-9a-f]{6}$/i.test(v) ? "#"+v.toLowerCase() : null;
    }
    function show(v){ hex=v; fill.style.background=v; }
    wheel.addEventListener("input",function(){ show(wheel.value); field.value=wheel.value; field.classList.remove("bad"); });
    field.addEventListener("input",function(){
      var v=norm(field.value);
      field.classList.toggle("bad",!v);
      if(v){ show(v); wheel.value=v; }
    });
    function add(){ var v=norm(field.value); if(!v){field.classList.add("bad");field.focus();return;} closePop(); commit(v); }
    pop.querySelector(".ap-add").addEventListener("click",add);
    field.addEventListener("keydown",function(e){
      if(e.key==="Enter"){ e.preventDefault(); add(); }
      if(e.key==="Escape"){ closePop(); }
    });
    setTimeout(function(){ field.focus(); field.select(); },0);
  };
  /* a starting suggestion — nothing is added until Add is pressed */
  function freshHue(){
    var h=Math.floor(Math.random()*360), s=62, l=56, a=s/100*Math.min(l/100,1-l/100);
    function f(n){ var k=(n+h/30)%12, c=l/100-a*Math.max(-1,Math.min(k-3,9-k,1));
      return Math.round(c*255).toString(16).padStart(2,"0"); }
    return "#"+f(0)+f(8)+f(4);
  }
  document.addEventListener("mousedown",function(e){
    if(pop && !pop.contains(e.target) && !e.target.closest(".sw-add")) closePop();
  },true);

  /* ---- disclosures ------------------------------------------------------ */
  var exp=$("#exportTog"), expBody=$("#exportBody");
  if(exp) exp.addEventListener("click",function(){
    var open=expBody.hidden;
    expBody.hidden=!open;
    exp.setAttribute("aria-pressed",String(open));
    exp.classList.toggle("on",open);
  });
  var mot=$("#motionTog");
  if(mot) mot.addEventListener("click",function(){
    var on=mot.getAttribute("aria-pressed")==="true";
    mot.classList.toggle("on",on);
  });

  requestAnimationFrame(function(){requestAnimationFrame(record);});
})();
</script>
</body>
</html>
