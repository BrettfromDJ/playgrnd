<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool page — Figma build — playgrnd</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Mono:wght@400&display=swap">
<style>
:root{--bg:#000;--well:#121216;--fill:#252531;--fill2:#393945;--line:#1f1f25;--mute:#798183;--fg:#fff;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.25 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
/* 1.5px dot grid on a 20px pitch */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
.glow .b{position:absolute;inset:0;background-repeat:no-repeat}
.glow::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.13) .75px,transparent .8px);background-size:20px 20px;background-position:6px 6px}
.app{position:relative;z-index:1}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{flex:none;display:block}
[hidden]{display:none!important}
.app{height:100vh;padding:32px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:22px;height:53px}
.top .logo{height:53px;width:auto;display:block;transform:translateY(5px)}
.top .toolname{font:10px var(--mono);color:var(--fg);margin-left:3px}
.top .sp{flex:1}
.top .wrap{position:relative;flex:none}
.top .wrap+.wrap{margin-left:-10px}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:39px;padding:0 16px;border-radius:60px;font-size:12px;line-height:1;white-space:nowrap;border:1px solid transparent;flex:none}
.pill.med{font-weight:500}
.pill.fill{background:var(--line)}
.pill.line{border-color:var(--line)}
.pill.line2{border-color:rgba(255,255,255,.16)}
.pill.white{background:#fff;color:#000}
.pill.white.med,.pill.white{font-weight:500}
.pill.sm{height:29px;padding:0 12px;font-size:10px;font-weight:400}
.pill.sm.med{font-size:12px;font-weight:500}
.pill.big{width:100%;height:39px}
.pill:hover{filter:brightness(1.18)}
.pill.white:hover{filter:brightness(.94)}
.pill[aria-pressed=true]{background:var(--line);border-color:var(--line)}
.pill[aria-pressed=false]{background:transparent}
.chips{display:flex;gap:8px}

/* layout */
.main{display:flex;gap:0;align-items:stretch;flex:1;min-height:0}
.rail{width:274px;flex:none;padding-top:26px;padding-bottom:24px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 26px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 26px,#000 calc(100% - 20px),transparent)}
.stage{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-start;padding-top:12px;min-height:0}
.art{display:block;height:calc(100% - 12px);max-height:932px;width:auto;max-width:100%}

/* rail rows */
.rail hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.vrow,.arow,.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vrow{margin-top:12px;height:29px}
.arow{height:29px}
.trow{height:29px}
.seed{gap:6px;font-size:12px;padding:0 10px 0 12px;min-width:78px;justify-content:space-between}
.seed input{width:48px;min-width:0;border:0;background:transparent;padding:0;font-size:12px;font-variant-numeric:tabular-nums;outline:none;color:var(--fg)}
.seed:focus-within{border-color:var(--mute)}
.ib.cp{width:16px;height:16px;opacity:.85}.ib.cp:hover{opacity:1}
.h{font-size:12px;color:var(--fg)}
.plbl{font:10px var(--mono);color:var(--mute);line-height:1}
.sq{width:12px;height:12px;border:1px solid #fff;border-radius:2px;display:block;flex:none}
.menu{position:fixed;z-index:30;width:150px;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.menu .ri{display:flex;align-items:center;gap:14px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--fg);text-align:left}
.menu .ri:hover{background:rgba(255,255,255,.05)}
.menu .ri[aria-selected=true]{background:var(--fill)}
.menu .ri .g{width:16px;display:flex;justify-content:center}
.menu .ri .ck{margin-left:auto;display:none}
.menu .ri[aria-selected=true] .ck{display:block}

/* sections */
.sec .sh{display:flex;align-items:center;justify-content:space-between;width:100%;height:15px;font-size:12px;color:var(--fg);text-align:left}
.sec .sh svg{transition:transform .15s}
.sec.closed .sh svg{transform:rotate(180deg)}
.sec.closed .sb{display:none}
.sec .sb,#grainBody,#animBody{display:flex;flex-direction:column;gap:12px}
.sec .sb{padding-top:16px}
.param{display:flex;flex-direction:column;gap:9px}
.bar{position:relative;height:25px;border-radius:4px;background:var(--well);overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;height:24px;width:var(--p,40%);background:var(--fill);border-radius:4px;pointer-events:none}
.bar .v{position:absolute;right:8px;top:0;height:25px;display:flex;align-items:center;font-size:10px;color:var(--fg);pointer-events:none;font-variant-numeric:tabular-nums}
.bar input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;opacity:0;cursor:ew-resize}
.bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:25px}
.bar input[type=range]:focus-visible{opacity:1;outline:1px solid var(--mute);outline-offset:-1px;background:transparent}
.bar input[type=range]:focus-visible::-webkit-slider-thumb{background:#fff;width:2px}

/* toggle */
.tg{width:40px;height:20px;border-radius:60px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;opacity:.2;transition:transform .15s,opacity .15s}
.tg[aria-checked=true]{background:var(--fill2)}
.tg[aria-checked=true]::after{transform:translateX(20px);opacity:1}

/* colour */
.seg{display:grid;grid-template-columns:1fr 1fr;height:36px;padding:4px;gap:0;background:var(--well);border-radius:4px}
.seg button{height:28px;border-radius:3px;font:10px var(--mono);color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--fill);color:var(--fg)}
.inks{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;margin-bottom:2px}
.ink{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.18);padding:0;flex:none}
.ink.on{outline:2px solid #fff;outline-offset:2px}
.ink.add{border:1px solid var(--line);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;background:transparent}
.ink.derived{border-style:dashed}
.acts{display:flex;gap:8px;flex-wrap:wrap;row-gap:8px}
.acts .pill.sm{gap:10px}
.note{margin:0;font-size:12px;line-height:15px;color:var(--mute);max-width:252px}
#colorRandom,#mineEmpty,#mineFull{display:flex;flex-direction:column;gap:16px}
.pickslot:empty{display:none}
.picker{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pk-field{height:110px;border-radius:6px;position:relative;cursor:crosshair;touch-action:none}
.pk-cur{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
.pk-hue{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);margin:0}
.pk-hue::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.pk-hue::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.pk-row{display:flex;align-items:center;gap:8px}
.pk-row .hash{color:var(--mute);font-size:12px}
.pk-row input[type=text]{flex:1;min-width:0;height:29px;border:1px solid var(--line);border-radius:60px;background:transparent;color:var(--fg);padding:0 12px;font-size:12px;text-transform:uppercase;outline:none}
.pk-row input[type=text]:focus{border-color:var(--mute)}
.pk-foot{display:flex;align-items:center;justify-content:space-between}
.lnk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.lnk:hover{color:var(--fg)}
.lnk.danger:hover{color:#FF6B6B}
.ib{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);border-radius:4px}
.ib.pk{width:29px;height:29px;border:1px solid var(--line);border-radius:50%}

/* popovers (top right) */
.pop{position:absolute;right:0;top:calc(100% + 14px);width:292px;background:#000;border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;z-index:20;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mh{display:flex;align-items:center;justify-content:space-between}
.mt{font-size:12px}
.mydots{display:none;gap:2px}
#myBtn.set .mydots{display:inline-flex}
.mydots i{width:8px;height:8px;border-radius:50%;display:block}
.rows{display:flex;flex-direction:column;background:var(--well);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows .r{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px}
.rows .r+.r{border-top:1px solid var(--line)}
.rows .r .d{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.18);flex:none;cursor:pointer}
.rows .r input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:12px;font-weight:500;text-transform:uppercase;outline:none;padding:0}
.rows .r .rm{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);opacity:.7}
.rows .r .rm:hover{opacity:1}
.addrow{display:flex;gap:12px;align-items:center}
.hexin{flex:1;min-width:0;height:29px;border:1px solid var(--line);border-radius:60px;background:transparent;padding:0 12px;font-size:12px;outline:none;text-transform:uppercase}
.hexin::placeholder{color:var(--mute);opacity:.5;text-transform:none}
.hexin:focus{border-color:var(--mute)}
.pill.sm#addBtn{width:48px;padding:0;font-size:12px}
.orrow{display:flex;align-items:center;gap:12px}
.or{font-size:10px;color:var(--mute)}
.export .param{gap:9px}
.export .chips{margin-top:2px}

@media(max-width:900px){
  .app{padding:16px;height:auto;min-height:100vh}
  .top{gap:12px;height:auto;flex-wrap:wrap}
  .top .logo{height:36px}
  .main{flex-direction:column}
  .rail{width:100%;padding-top:16px;overflow:visible;-webkit-mask-image:none;mask-image:none}
  .stage{width:100%;order:-1;padding-top:16px}
  .art{height:auto;width:100%}
  .pop{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto}
}

  <section class="sec"><button class="sh" aria-expanded="true"><span>Glow</span><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l8-8 8 8"/></svg></button><div class="sb"><div class="param"><span class="plbl">Blur</span><div class="bar"><div class="fill"></div><span class="v"></span><input type="range" id="blur" min="0" max="1" step="0.01" value="0.06" data-fmt="pct" aria-label="Blur"></div></div><div class="param"><span class="plbl">Halo</span><div class="bar"><div class="fill"></div><span class="v"></span><input type="range" id="halo" min="0" max="1" step="0.01" value="0.46" data-fmt="pct" aria-label="Halo"></div></div><div class="param"><span class="plbl">Dark rim</span><div class="bar"><div class="fill"></div><span class="v"></span><input type="range" id="rim" min="0" max="1" step="0.01" value="0.3" data-fmt="pct" aria-label="Dark rim"></div></div></div></section><hr>

      </div>
      <div id="mineFull" hidden>
        <div class="inks" id="inksMine"></div>
        <div class="pickslot" id="pickMine"></div>
        <div class="acts"><button class="pill line sm" id="rotMine" title="Moves each colour to the next job"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4"/><path d="M20 12a8 8 0 0 1-14 5.3"/><path d="M6 21v-4h4"/></svg><span>Rotate</span></button><button class="pill line sm" id="editMine"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 7l4 4"/></svg><span>Edit</span></button></div>
      </div>
    </div>
  </div></section>
  <hr>
  <section class="sec"><button class="sh" aria-expanded="true"><span>Animate</span><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l8-8 8 8"/></svg></button><div class="sb"><div class="trow"><span class="plbl">Animate</span><button class="tg" id="anim" role="switch" aria-checked="false" aria-label="Animate"></button></div><div id="animBody" hidden><div class="param"><span class="plbl">Amount</span><div class="bar"><div class="fill"></div><span class="v"></span><input type="range" id="amount" min="0" max="1" step="0.01" value="0.5" data-fmt="pct" aria-label="Amount"></div></div><div class="param"><span class="plbl">Speed</span><div class="bar"><div class="fill"></div><span class="v"></span><input type="range" id="fps" min="6" max="60" step="1" value="24" data-fmt="fps" aria-label="Speed"></div></div></div></div></section><hr>
  <section class="sec"><button class="sh" aria-expanded="true"><span>Grain</span><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l8-8 8 8"/></svg></button><div class="sb"><div class="trow"><span class="plbl">Grain</span><button class="tg" id="grainOn" role="switch" aria-checked="true" aria-label="Grain"></button></div><div id="grainBody"><div class="chips" data-one><button class="pill fill sm" aria-pressed="true">Overlay</button><button class="pill line sm" aria-pressed="false">Multiply</button><button class="pill line sm" aria-pressed="false">Add</button></div><div class="param"><span class="plbl">Amount</span><div class="bar"><div class="fill"></div><span class="v"></span><input type="range" id="gamt" min="0" max="1" step="0.01" value="0.06" data-fmt="pct" aria-label="Amount"></div></div><div class="param"><span class="plbl">Grain size</span><div class="bar"><div class="fill"></div><span class="v"></span><input type="range" id="gsize" min="0" max="1" step="0.01" value="0.06" data-fmt="pct" aria-label="Grain size"></div></div></div></div></section>
</aside>
<main class="stage"><img class="art" id="art" src="../art/crowd.jpg" alt=""></main>
</div></div><script>
(function(){
  var $=function(s){return document.querySelector(s)};
  /* sliders: fill + readout */
  function fmtv(r){var v=+r.value,f=r.dataset.fmt||"pct";return f==="px"?v+"px":f==="fps"?v+" fps":f==="int"?String(v):Math.round(v*100)+"%";}
  document.querySelectorAll(".bar input[type=range]").forEach(function(r){
    var bar=r.parentNode,fill=bar.querySelector(".fill"),out=bar.querySelector(".v");
    function show(){var p=(r.value-r.min)/(r.max-r.min)*100;fill.style.width=p+"%";out.textContent=fmtv(r);}
    r.addEventListener("input",show);show();
  });
  /* section headers collapse */
  document.querySelectorAll(".sec .sh").forEach(function(b){b.addEventListener("click",function(){var s=b.parentNode,c=s.classList.toggle("closed");b.setAttribute("aria-expanded",String(!c));});});
  /* toggles */
  document.querySelectorAll(".tg").forEach(function(t){t.addEventListener("click",function(){var on=t.getAttribute("aria-checked")!=="true";t.setAttribute("aria-checked",String(on));
    var body=document.getElementById(t.id==="anim"?"animBody":t.id==="grainOn"?"grainBody":"");if(body)body.hidden=!on;});});
  /* one-of chip groups */
  document.querySelectorAll("[data-one]").forEach(function(g){g.querySelectorAll("[aria-pressed]").forEach(function(b){b.addEventListener("click",function(){
    g.querySelectorAll("[aria-pressed]").forEach(function(x){x.setAttribute("aria-pressed","false");x.classList.remove("fill");x.classList.add(g.closest(".export")?"line2":"line");});
    b.setAttribute("aria-pressed","true");b.classList.add("fill");b.classList.remove("line","line2");});});});
  /* new variation + seed */
  var arts=["../art/crowd.jpg","../art/vein.jpg","../art/motley.jpg"],ai=0;
  /* ambient glow: sample the output on a tiny canvas, paint 3 soft blobs, crossfade */
  var glow=$("#glow"),gb=document.createElement("div");gb.className="b";glow.appendChild(gb);
  function sampleArt(img){try{var c=document.createElement("canvas"),n=12;c.width=n;c.height=n;var x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,n,n);var d=x.getImageData(0,0,n,n).data,px=[];
      for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);px.push({r:r,g:g,b:b,s:mx?(mx-mn)/mx:0,v:mx/255});}
      px.sort(function(a,b){return (b.s*b.v)-(a.s*a.v);});var out=[];
      px.forEach(function(q){if(out.length>=3)return;var far=out.every(function(o){return Math.abs(o.r-q.r)+Math.abs(o.g-q.g)+Math.abs(o.b-q.b)>120;});if(far)out.push(q);});
      while(out.length<3)out.push(px[out.length]||{r:60,g:60,b:80});return out;}catch(e){return null;}}
  function paintGlow(){var img=$("#art");if(!img.complete||!img.naturalWidth)return;var c=sampleArt(img);if(!c)return;
    var f=function(q,a){return "rgba("+q.r+","+q.g+","+q.b+","+a+")"};
    /* quiet wash from the top edge, like a screen lit from above; no animation */
    gb.style.backgroundImage="radial-gradient(95vw 60vh at 50% -8%,"+f(c[0],.20)+",transparent 70%),radial-gradient(55vw 40vh at 88% 6%,"+f(c[1],.10)+",transparent 70%)";}
  $("#art").addEventListener("load",paintGlow);paintGlow();
  function showSeed(n){ai=n%arts.length;$("#art").src=arts[ai];}
  document.querySelector("[data-new]").addEventListener("click",function(){var n=Math.floor(Math.random()*90000)+10000;$("#seedNum").value=n;showSeed(n);});
  $("#seedNum").addEventListener("input",function(){this.value=this.value.replace(/\D/g,"");});
  $("#seedNum").addEventListener("change",function(){if(this.value)showSeed(+this.value);});
  $("#seedNum").addEventListener("keydown",function(e){if(e.key==="Enter"){this.blur();}});
  $("#seedBtn").addEventListener("click",function(){var s=$("#seedNum"),n=s.value;if(navigator.clipboard)navigator.clipboard.writeText(n).catch(function(){});s.value="Copied";setTimeout(function(){s.value=n;},900);});
  /* aspect ratio cycles */
  var RATIOS=[[9,16],[3,4],[2,3],[1,1],[4,3],[16,9],[3,2]],ri=3;
  var CK='<svg class="ck" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
  function glyph(w,h,m){var k=m/Math.max(w,h);var e=document.createElement("i");e.className="sq";e.style.width=Math.round(w*k)+"px";e.style.height=Math.round(h*k)+"px";return e;}
  function setRatio(i){ri=i;var r=RATIOS[i];$("#ratioLbl").textContent=r[0]+":"+r[1];var b=$("#ratioBtn");b.replaceChild(glyph(r[0],r[1],12),b.querySelector(".sq"));}
  var rm=$("#ratioMenu");document.body.appendChild(rm); /* out of the scrolling, masked rail */
  RATIOS.forEach(function(r,i){var b=document.createElement("button");b.className="ri";b.setAttribute("role","option");var g=document.createElement("span");g.className="g";g.appendChild(glyph(r[0],r[1],14));b.appendChild(g);
    var t=document.createElement("span");t.textContent=r[0]+":"+r[1];b.appendChild(t);b.insertAdjacentHTML("beforeend",CK);
    b.addEventListener("click",function(){setRatio(i);closeRatio();});rm.appendChild(b);});
  function openRatio(){closeAll();rm.querySelectorAll(".ri").forEach(function(b,i){b.setAttribute("aria-selected",String(i===ri));});rm.hidden=false;
    var a=$("#ratioBtn").getBoundingClientRect(),h=rm.offsetHeight;var top=a.top-8-h;if(top<8)top=Math.min(a.bottom+8,window.innerHeight-h-8);
    rm.style.top=top+"px";rm.style.left=Math.max(16,a.right-rm.offsetWidth)+"px";$("#ratioBtn").setAttribute("aria-expanded","true");}
  function closeRatio(){rm.hidden=true;$("#ratioBtn").setAttribute("aria-expanded","false");}
  $("#ratioBtn").addEventListener("click",function(){rm.hidden?openRatio():closeRatio();});
  document.querySelector(".rail").addEventListener("scroll",closeRatio);
  setRatio(ri);window.__closeRatio=closeRatio;
  /* popovers */
  function pop(btn,el,onOpen){
    function open(){closeAll();el.hidden=false;btn.setAttribute("aria-expanded","true");if(onOpen)onOpen();}
    function close(){el.hidden=true;btn.setAttribute("aria-expanded","false");}
    btn.addEventListener("click",function(){el.hidden?open():close();});
    return {open:open,close:close,el:el,btn:btn};
  }
  var pops=[];function closeAll(){pops.forEach(function(p){p.close();});if(window.__closeRatio)window.__closeRatio();}
  var myPop=pop($("#myBtn"),$("#myModal"),function(){setTimeout(function(){$("#hexIn").focus();},40);});
  var exPop=pop($("#expBtn"),$("#expPop"));pops.push(myPop,exPop);
  $("#myClose").addEventListener("click",myPop.close);
  $("#expGo").addEventListener("click",exPop.close);
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll();});
  document.addEventListener("click",function(e){if(e.target.closest("#setColors,#editMine,.wrap,#ratioBtn,#ratioMenu"))return;closeAll();});

  /* ---- colours ---- */
  var PALS=[["#2B2140","#B5F53A","#1E3BFF","#F0FF6A"],["#0B0F1A","#FF3DA6","#3DE0FF","#FFE45C"],["#E9E4D6","#FF5C39","#2B3BFF","#1B1B1B"],["#2A2340","#FFE45C","#00E5A8","#7B5CFF"]];
  var rnd=PALS[0].slice(),mine=[],mode="random",pi=0,pick=null;
  try{var st=JSON.parse(localStorage.getItem("playgrnd.design.mycolors")||"null");if(st&&st.cols&&st.cols.length){mine=st.cols;if(st.on)mode="mine";}}catch(e){}
  function persist(){try{localStorage.setItem("playgrnd.design.mycolors",JSON.stringify({cols:mine,on:mode==="mine"}));}catch(e){}}
  var PLUS='<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>';
  var X='<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var EYE='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6M4 20l1-4 9-9 3 3-9 9z"/></svg>';
  var ROLES=["Ground","Core","Halo","Band","Extra"];
  function dot(c,derived,list,i){var b=document.createElement("button");b.className="ink"+(derived?" derived":"")+(pick&&pick.list===list&&pick.i===i?" on":"");b.style.background=c;b.title=(ROLES[i]||"Extra")+" · "+c;b.setAttribute("aria-label",b.title+" (tap to change)");
    if(!derived)b.addEventListener("click",function(){pick=(pick&&pick.list===list&&pick.i===i)?null:{list:list,i:i};render();});return b;}
  function addDot(list){var b=document.createElement("button");b.className="ink add";b.innerHTML=PLUS;b.title="Add colour";b.setAttribute("aria-label","Add colour");
    b.addEventListener("click",function(){var arr=list==="rnd"?rnd:mine;arr.push("#"+["FF6B6B","3DE0FF","F5C21B","B5F53A","FF3DA6"][arr.length%5]);pick={list:list,i:arr.length-1};persist();render();});return b;}
  function hex2hsv(h){var n=parseInt(h.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,hh=0;
    if(d){if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360;}return {h:hh,s:mx?d/mx:0,v:mx};}
  function hsv2hex(h,s,v){var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;
    if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
    var t=function(q){return ("0"+Math.round((q+m)*255).toString(16)).slice(-2)};return ("#"+t(r)+t(g)+t(b)).toUpperCase();}
  function picker(list,i){
    var arr=list==="rnd"?rnd:mine,col=arr[i],hsv=hex2hsv(col);
    var el=document.createElement("div");el.className="picker";
    el.innerHTML='<div class="pk-field"><span class="pk-cur"></span></div><input type="range" class="pk-hue" min="0" max="360" step="1" aria-label="Hue">'+
      '<div class="pk-row"><span class="hash">#</span><input type="text" maxlength="6" aria-label="Hex"><button class="ib pk" data-eye aria-label="Pick from screen" title="Pick from screen">'+EYE+'</button></div>'+
      '<div class="pk-foot"><button class="lnk danger" data-rm>Remove colour</button><button class="pill line sm" data-ok>Done</button></div>';
    var field=el.querySelector(".pk-field"),cur=el.querySelector(".pk-cur"),hue=el.querySelector(".pk-hue"),hex=el.querySelector("input[type=text]");
    function paint(){field.style.background="linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl("+hsv.h+",100%,50%))";cur.style.left=(hsv.s*100)+"%";cur.style.top=((1-hsv.v)*100)+"%";hue.value=hsv.h;hex.value=col.slice(1);}
    function commit(){arr[i]=col;paint();persist();
      var host=document.getElementById(list==="rnd"?"inksRandom":"inksMine"),dots=host.querySelectorAll(".ink:not(.add)");if(dots[i]){dots[i].style.background=col;dots[i].title=col;}
      if(list==="mine")drawDots();}
    function fromField(e){var r=field.getBoundingClientRect();hsv.s=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));hsv.v=Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height));col=hsv2hex(hsv.h,hsv.s,hsv.v);commit();}
    var down=false;field.addEventListener("pointerdown",function(e){down=true;field.setPointerCapture(e.pointerId);fromField(e);});
    field.addEventListener("pointermove",function(e){if(down)fromField(e);});field.addEventListener("pointerup",function(){down=false;});
    hue.addEventListener("input",function(){hsv.h=+hue.value;col=hsv2hex(hsv.h,hsv.s,hsv.v);commit();});
    hex.addEventListener("change",function(){var v=("#"+hex.value.replace("#","")).toUpperCase();if(/^#[0-9A-F]{6}$/.test(v)){col=v;hsv=hex2hsv(col);commit();}else hex.value=col.slice(1);});
    var eye=el.querySelector("[data-eye]");if(window.EyeDropper){eye.addEventListener("click",function(){new EyeDropper().open().then(function(r){col=r.sRGBHex.toUpperCase();hsv=hex2hsv(col);commit();}).catch(function(){});});}else eye.hidden=true;
    el.querySelector("[data-rm]").addEventListener("click",function(){if(arr.length>1){arr.splice(i,1);pick=null;persist();render();}});
    el.querySelector("[data-ok]").addEventListener("click",function(){pick=null;render();});
    paint();return el;}
  function shade(c,k){var n=parseInt(c.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;var f=function(v){return Math.round(v+(255-v)*k)};return "#"+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1).toUpperCase();}
  function fit(cols,n){var out=cols.slice(0,n),i=0;while(out.length<n){out.push({c:shade(cols[i%cols.length],0.35+0.15*i),d:true});i++;}return out.map(function(x){return typeof x==="string"?{c:x,d:false}:x});}
  function drawDots(){var md=$("#myDots");md.innerHTML="";mine.slice(0,4).forEach(function(c){var i=document.createElement("i");i.style.background=c;md.appendChild(i);});}
  function render(){
    var has=mine.length>0;
    $("#colorRandom").hidden=mode!=="random";$("#colorMine").hidden=mode!=="mine";
    document.querySelectorAll("#src button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.mode===mode));});
    var ir=$("#inksRandom");ir.innerHTML="";rnd.forEach(function(c,i){ir.appendChild(dot(c,false,"rnd",i));});ir.appendChild(addDot("rnd"));
    var pr=$("#pickRandom");pr.innerHTML="";if(pick&&pick.list==="rnd"&&rnd[pick.i])pr.appendChild(picker("rnd",pick.i));
    $("#mineEmpty").hidden=has;$("#mineFull").hidden=!has;
    var im=$("#inksMine");im.innerHTML="";if(has){fit(mine,4).forEach(function(x,i){im.appendChild(dot(x.c,x.d,"mine",i));});im.appendChild(addDot("mine"));}
    var pm=$("#pickMine");pm.innerHTML="";if(pick&&pick.list==="mine"&&mine[pick.i])pm.appendChild(picker("mine",pick.i));
    $("#myBtn").classList.toggle("set",has);$("#myLbl").textContent=has?"My colors":"Set colors";drawDots();
    var rows=$("#myRows");rows.innerHTML="";rows.hidden=!has;
    mine.forEach(function(c,i){var r=document.createElement("div");r.className="r";r.innerHTML='<button class="d" style="background:'+c+'" aria-label="Change colour"></button><input value="'+c.replace("#","")+'" aria-label="Hex" spellcheck="false"><button class="rm" aria-label="Remove">'+X+'</button>';
      r.querySelector(".d").addEventListener("click",function(){mode="mine";pick={list:"mine",i:i};myPop.close();persist();render();});
      r.querySelector("input").addEventListener("change",function(e){var v=("#"+e.target.value.replace("#","")).toUpperCase();if(/^#[0-9A-F]{6}$/.test(v)){mine[i]=v;persist();render();}else e.target.value=c.replace("#","");});
      r.querySelector(".rm").addEventListener("click",function(){mine.splice(i,1);if(!mine.length)mode="random";persist();render();});
      rows.appendChild(r);});
    $("#saveCurBtn").textContent=has?"Replace with current colors":"Save current colors";
  }
  function parse(t){return (t.match(/#?[0-9a-fA-F]{6}\b/g)||[]).map(function(h){return ("#"+h.replace("#","")).toUpperCase();});}
  function addFromInput(){var v=parse($("#hexIn").value);if(v.length){mine=mine.concat(v);$("#hexIn").value="";mode="mine";persist();render();}else{$("#hexIn").classList.add("bad");setTimeout(function(){$("#hexIn").classList.remove("bad");},400);}}
  $("#addBtn").addEventListener("click",addFromInput);
  $("#hexIn").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addFromInput();}});
  $("#hexIn").addEventListener("paste",function(){setTimeout(function(){if(parse($("#hexIn").value).length>1)addFromInput();},0);});
  $("#saveCurBtn").addEventListener("click",function(){mine=rnd.slice();mode="mine";pick=null;persist();render();});
  document.querySelectorAll("#src button").forEach(function(b){b.addEventListener("click",function(){mode=b.dataset.mode;pick=null;persist();render();});});
  $("#shufRandom").addEventListener("click",function(){pi=(pi+1)%PALS.length;rnd=PALS[pi].slice();pick=null;render();});
  function rotate(hostId,arr){
    var host=$(hostId),cells=[].slice.call(host.querySelectorAll(".ink:not(.add)"));if(cells.length<2)return;
    var step=cells[1].getBoundingClientRect().left-cells[0].getBoundingClientRect().left;
    cells.forEach(function(k,i){k.style.transition="transform .22s ease";k.style.transform=i===0?"translate("+(step*(cells.length-1))+"px,-8px)":"translateX("+(-step)+"px)";});
    setTimeout(function(){arr.push(arr.shift());pick=null;persist();render();},230);}
  $("#rotRandom").addEventListener("click",function(){rotate("#inksRandom",rnd);});
  $("#rotMine").addEventListener("click",function(){rotate("#inksMine",mine);});
  $("#saveCur").addEventListener("click",function(){mine=rnd.slice();mode="mine";pick=null;persist();render();});
  $("#useThese").addEventListener("click",function(){mine=rnd.slice();pick=null;persist();render();});
  $("#setColors").addEventListener("click",function(){myPop.open();});
  $("#editMine").addEventListener("click",function(){myPop.open();});
  render();
})();
</script></body></html>
