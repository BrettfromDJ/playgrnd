<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>playgrnd — split layout (prototype)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Mono&display=swap"><style>
:root{--bg:#000;--well:rgba(16,16,22,.62);--fill:rgba(255,255,255,.11);--line:rgba(255,255,255,.08);--glass:rgba(8,8,12,.9);--stroke:rgba(255,255,255,.1);--mute:#798183;--fg:#fff;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:12px/1.25 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{flex:none;display:block}
[hidden]{display:none!important}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
.glow .b{position:absolute;inset:0;background-repeat:no-repeat;transition:opacity .5s ease;opacity:0}
.glow .b.on{opacity:1}
.app{position:relative;z-index:1;height:100dvh;padding:32px;display:flex;flex-direction:column}
.pill{-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:39px;padding:0 16px;border-radius:60px;font-size:12px;line-height:1;white-space:nowrap;border:1px solid transparent;flex:none;cursor:pointer;color:var(--fg)}
.pill.med{font-weight:500}
.pill.line{border-color:var(--stroke)}
.pill.white{background:#fff;color:#000;font-weight:500}
.pill.sm{height:29px;padding:0 12px;font-size:10px}
.pill:hover{filter:brightness(1.18)}
.pill.white:hover{filter:brightness(.94)}
.topbar{display:flex;align-items:center;gap:22px;height:53px;flex:none}
.topbar .logo{height:53px;width:auto;display:block;transform:translateY(5px)}
.topbar .sp{flex:1}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{height:29px;padding:0 12px;border-radius:60px;font-size:12px;color:var(--mute)}
.tab:hover{color:var(--fg)}
.tab[aria-pressed=true]{color:var(--fg);background:var(--fill)}
.mydots{display:none;gap:2px}
#mycBtn.set .mydots{display:inline-flex}
.mydots i{width:8px;height:8px;border-radius:50%;display:block}
.main{display:grid;grid-template-columns:minmax(360px,44%) minmax(0,1fr);gap:48px;flex:1;min-height:0;padding-top:26px}
/* featured */
.feat{display:flex;flex-direction:column;min-height:0;gap:14px}
.frame{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--well);border:1px solid var(--stroke)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s ease}
.frame img.on{opacity:1}
.cap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.cap .nm{font-size:14px;font-weight:500;margin-bottom:4px}
.cap .mk{font:10px var(--mono);color:var(--mute)}
.cap .d{font:10px var(--mono);color:var(--mute);flex:none}
.open{width:100%;height:39px}
/* tracklist */
.list{display:flex;flex-direction:column;min-height:0}
.thead,.row{display:grid;grid-template-columns:36px minmax(100px,1fr) minmax(0,1.5fr) 88px 72px;gap:16px;align-items:center}
.thead{height:32px;font:10px var(--mono);color:var(--mute);border-bottom:1px solid var(--stroke);flex:none;padding:0 8px}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 40px),transparent);padding-bottom:40px}
.scroll::-webkit-scrollbar{display:none}
.row{height:44px;border-bottom:1px solid var(--stroke);padding:0 8px;border-radius:8px;transition:background .12s}
.row:hover,.row.hi{background:rgba(255,255,255,.05)}
.row .no{font:10px var(--mono);color:var(--mute)}
.row .nm{font-size:12px;font-weight:500}
.row .mk{font:10px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font:10px var(--mono);color:var(--mute)}
.row .go{justify-self:end;height:26px;padding:0 10px;border-radius:60px;border:1px solid var(--stroke);font-size:10px;opacity:0;transition:opacity .12s;display:inline-flex;align-items:center;gap:6px}
.row:hover .go,.row.hi .go{opacity:1}
.row .nm b{background:rgba(255,255,255,.18);border-radius:3px;font-weight:500}
.empty{padding:40px 8px;color:var(--mute)}
.field{display:flex;align-items:center;height:29px;border:1px solid var(--stroke);border-radius:60px;padding:0 12px;gap:8px;color:var(--mute);width:200px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font-size:12px;padding:0}
.field input::placeholder{color:var(--mute);opacity:.6}
.field:focus-within{border-color:var(--mute)}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;padding:16px}
  .topbar{height:auto;flex-wrap:wrap;gap:12px}
  .topbar .logo{height:36px;transform:none}
  .tabs{margin:0;flex-wrap:wrap;width:100%}
  .field{width:100%}
  .main{display:flex;flex-direction:column;gap:24px;padding-top:16px}
  .frame{aspect-ratio:1;flex:none}
  .scroll{overflow:visible;-webkit-mask-image:none;mask-image:none;padding-bottom:0}
  .thead{display:none}
  .row{grid-template-columns:28px 1fr 64px;height:48px}
  .row .mk,.row .go{display:none}
}
</style></head><body>
<div class="glow" id="glow" aria-hidden="true"><div class="b" id="g0"></div><div class="b" id="g1"></div></div>
<div class="app">

<div class="main">

  </section>
</div>
</div>
<script>
