<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slider 4: Stepper — playgrnd</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../base.css">
<style>
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-height:100vh}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
.main{display:grid;grid-template-columns:300px minmax(0,1fr)}
.rail{padding:18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}
.stage{display:flex;align-items:center;justify-content:center;padding:28px}
.stage img{max-height:calc(100vh - 57px - 56px);max-width:100%;width:auto}
details{border-top:1px solid var(--line);padding-top:8px}
details:first-of-type{border-top:0;padding-top:0}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:var(--tap)}
summary::-webkit-details-marker{display:none}
summary::after{content:"–";font-size:14px;color:var(--ink2)}
details:not([open]) summary::after{content:"+"}
.body{display:flex;flex-direction:column;gap:6px;padding:0 0 10px}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.rail{position:static;max-height:none;border:0;order:2}.stage{order:1;padding:14px}.stage img{max-height:56vh}
 .bar{flex-wrap:wrap;gap:8px;padding:10px 12px}.bar .sp{display:none}.bar .crumb{width:100%}.bar .seedbox .lbl,.bar .seedbox .ghost{display:none}.bar .seedbox input{width:84px}.bar .btn{padding:0 12px}}
.dial{gap:0;min-height:48px}
.stp{display:grid;grid-template-columns:30px 1fr 30px;gap:6px;align-items:center}
.pm{height:30px;border:1px solid var(--line2);border-radius:6px;background:transparent;font-size:15px;line-height:1;padding:0}
.pm:active{background:var(--ink);color:#fff}
.dial input[type=range]{height:30px}
.dial input[type=range]::-webkit-slider-runnable-track{height:6px}
.dial input[type=range]::-moz-range-track,.dial input[type=range]::-moz-range-progress{height:6px}
.dial input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-5px}
.dial input[type=range]::-moz-range-thumb{width:12px;height:12px}</style></head>
<body>
<div class="app">
<header class="bar">
  <a class="btn ghost" href="#">&larr; All tools</a>
  <div class="crumb"><img class="logo" src="../../../logo.svg" alt="playgrnd"><span class="sub">/</span><span class="tool">Crowd</span></div>
  <span class="sp"></span>
  <div class="seedbox"><span class="lbl">Variation</span><input value="61851" inputmode="numeric" aria-label="Variation number"><button class="btn ghost">Copy</button></div>
  <button class="btn primary" data-new><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>New variation</button>
  <button class="btn">Export</button>
</header>
<div class="main">
<aside class="rail">
  <details open><summary><span class="h">Crowd</span></summary><div class="body"><div class="dial"><div class="top"><span class="lbl">Figures</span><span class="val">44</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Figures">&minus;</button><input type="range" min="1" max="48" step="1" value="44" data-fmt="int" aria-label="Figures"><button class="pm" data-d="1" aria-label="More Figures">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Size</span><span class="val">0.54</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Size">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.54" data-fmt="pct" aria-label="Size"><button class="pm" data-d="1" aria-label="More Size">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Wobble</span><span class="val">0.34</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Wobble">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.34" data-fmt="pct" aria-label="Wobble"><button class="pm" data-d="1" aria-label="More Wobble">+</button></div></div></div></details>
  <details open><summary><span class="h">Glow</span></summary><div class="body"><div class="dial"><div class="top"><span class="lbl">Blur</span><span class="val">0.42</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Blur">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.42" data-fmt="pct" aria-label="Blur"><button class="pm" data-d="1" aria-label="More Blur">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Halo</span><span class="val">0.51</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Halo">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.51" data-fmt="pct" aria-label="Halo"><button class="pm" data-d="1" aria-label="More Halo">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Dark rim</span><span class="val">0.18</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Dark rim">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.18" data-fmt="pct" aria-label="Dark rim"><button class="pm" data-d="1" aria-label="More Dark rim">+</button></div></div></div></details>
  <details open><summary><span class="h">Arrows</span></summary><div class="body"><div class="dial"><div class="top"><span class="lbl">Arrows</span><span class="val">0.5</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Arrows">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.5" data-fmt="pct" aria-label="Arrows"><button class="pm" data-d="1" aria-label="More Arrows">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Arrow size</span><span class="val">0.5</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Arrow size">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.5" data-fmt="pct" aria-label="Arrow size"><button class="pm" data-d="1" aria-label="More Arrow size">+</button></div></div></div></details>
  <details open><summary><span class="h">Color</span></summary><div class="body"><div class="inks">
<button class="ink" style="background:#2B2140" aria-label="Ink 1"></button>
<button class="ink" style="background:#B5F53A" aria-label="Ink 2"></button>
<button class="ink" style="background:#1E3BFF" aria-label="Ink 3"></button>
<button class="ink" style="background:#F0FF6A" aria-label="Ink 4"></button>
<button class="ink add" aria-label="Add colour">+</button></div><div class="acts"><button class="btn sm">New colors</button><button class="btn sm">Rotate</button><button class="btn sm">Save</button></div></div></details>
  <details open><summary><span class="h">Frame</span></summary><div class="body"><div class="ratios" data-one>
<button class="ratio" aria-pressed="false"><i style="width:7px;height:12px"></i>9:16</button>
<button class="ratio" aria-pressed="true"><i style="width:9px;height:12px"></i>3:4</button>
<button class="ratio" aria-pressed="false"><i style="width:10px;height:12px"></i>4:5</button>
<button class="ratio" aria-pressed="false"><i style="width:11px;height:11px"></i>1:1</button>
<button class="ratio" aria-pressed="false"><i style="width:12px;height:10px"></i>5:4</button>
<button class="ratio" aria-pressed="false"><i style="width:12px;height:9px"></i>4:3</button>
<button class="ratio" aria-pressed="false"><i style="width:13px;height:9px"></i>3:2</button>
<button class="ratio" aria-pressed="false"><i style="width:14px;height:8px"></i>16:9</button></div></div></details>
  <details><summary><span class="h">Motion</span></summary><div class="body"><div class="sw"><span class="lbl">Animate</span><button class="knob" aria-pressed="false" data-body="m" aria-label="Animate"></button></div><div id="m" hidden class="body"><div class="chips" data-one><button class="chip" aria-pressed="true">Sway</button><button class="chip" aria-pressed="false">Pulse</button><button class="chip" aria-pressed="false">Flicker</button></div><div class="dial"><div class="top"><span class="lbl">Amount</span><span class="val">0.6</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Amount">&minus;</button><input type="range" min="0.05" max="2" step="0.05" value="0.6" data-fmt="pct" aria-label="Amount"><button class="pm" data-d="1" aria-label="More Amount">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Speed</span><span class="val">12</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Speed">&minus;</button><input type="range" min="2" max="30" step="1" value="12" data-fmt="fps" aria-label="Speed"><button class="pm" data-d="1" aria-label="More Speed">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Loop length</span><span class="val">36</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Loop length">&minus;</button><input type="range" min="8" max="60" step="2" value="36" data-fmt="fr" aria-label="Loop length"><button class="pm" data-d="1" aria-label="More Loop length">+</button></div></div></div></div></details>
  <details><summary><span class="h">Grain</span></summary><div class="body"><div class="sw"><span class="lbl">Grain</span><button class="knob" aria-pressed="true" data-body="g" aria-label="Grain"></button></div><div id="g" class="body"><div class="chips" data-one><button class="chip" aria-pressed="true">Overlay</button><button class="chip" aria-pressed="false">Multiply</button><button class="chip" aria-pressed="false">Add</button></div><div class="dial"><div class="top"><span class="lbl">Amount</span><span class="val">0.35</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Amount">&minus;</button><input type="range" min="0" max="1" step="0.01" value="0.35" data-fmt="pct" aria-label="Amount"><button class="pm" data-d="1" aria-label="More Amount">+</button></div></div><div class="dial"><div class="top"><span class="lbl">Grain size</span><span class="val">1</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Grain size">&minus;</button><input type="range" min="0.5" max="3" step="0.1" value="1" data-fmt="pct" aria-label="Grain size"><button class="pm" data-d="1" aria-label="More Grain size">+</button></div></div></div></div></details>
  <details><summary><span class="h">Export</span></summary><div class="body"><div class="dial"><div class="top"><span class="lbl">Size</span><span class="val">2400</span></div>
<div class="stp"><button class="pm" data-d="-1" aria-label="Less Size">&minus;</button><input type="range" min="600" max="6000" step="100" value="2400" data-fmt="px" aria-label="Size"><button class="pm" data-d="1" aria-label="More Size">+</button></div></div><div class="row"><button class="btn primary" style="flex:1">PNG</button><button class="btn" style="flex:1">Video</button></div></div></details>
</aside>
<main class="stage"><img class="art" src="../../art/crowd.jpg" alt=""></main>
</div></div>
<script src="../../base.js"></script><script>document.querySelectorAll(".pm").forEach(function(b){b.addEventListener("click",function(){var r=b.parentElement.querySelector("input");r.stepUp(+b.dataset.d);r.dispatchEvent(new Event("input",{bubbles:true}));});});</script>
</body></html>
